<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艺术学概论考研复习助手</title>
<style>
/* ============================================
   极光玻璃 · 考研复习助手 · 顶部导航栏版
   ============================================ */
:root {
  --bg-1: #EEF1F8;
  --bg-2: #E8ECF7;
  --bg-3: #F0EEF9;
  --blue: #2563EB;
  --indigo: #4F46E5;
  --purple: #7C3AED;
  --pink: #DB2777;
  --cyan: #0891B2;
  --orange: #EA580C;
  --green: #059669;
  --red: #DC2626;
  --accent: #2563EB;
  --accent-2: #7C3AED;
  --accent-gradient: linear-gradient(135deg, #2563EB 0%, #4F46E5 40%, #7C3AED 100%);
  --accent-gradient-2: linear-gradient(135deg, #0891B2 0%, #2563EB 50%, #7C3AED 100%);
  --glass: rgba(255,255,255,0.65);
  --glass-strong: rgba(255,255,255,0.82);
  --glass-sidebar: rgba(255,255,255,0.55);
  --glass-border: rgba(255,255,255,0.9);
  --text-1: #1A1A2E;
  --text-2: #3D3D5C;
  --text-3: #6B6B8A;
  --text-4: #9B9BB5;
  --r-card: 20px;
  --r-control: 12px;
  --r-pill: 999px;
  --shadow-card: 0 4px 24px rgba(37,99,235,0.07), 0 1px 3px rgba(0,0,0,0.04);
  --shadow-float: 0 20px 50px rgba(37,99,235,0.13), 0 4px 12px rgba(0,0,0,0.05);
  --shadow-glow: 0 0 30px rgba(37,99,235,0.15), 0 0 60px rgba(124,58,237,0.08);
  --topnav-height: 64px;
}
[data-theme="dark"] {
  --bg-1: #0F1219;
  --bg-2: #151925;
  --bg-3: #1A1E2E;
  --glass: rgba(30,35,50,0.7);
  --glass-strong: rgba(35,40,58,0.85);
  --glass-sidebar: rgba(20,24,36,0.75);
  --glass-border: rgba(255,255,255,0.08);
  --text-1: #E8ECF4;
  --text-2: #B0B8D0;
  --text-3: #7A829C;
  --text-4: #5A627C;
  --shadow-card: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-float: 0 20px 50px rgba(0,0,0,0.4);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg-1);
  color: var(--text-1);
  -webkit-font-smoothing: antialiased;
  min-height:100vh;
  overflow-x:hidden;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(ellipse 800px 600px at 0% 0%, rgba(37,99,235,0.08), transparent 50%),
    radial-gradient(ellipse 700px 500px at 100% 100%, rgba(124,58,237,0.06), transparent 45%),
    radial-gradient(ellipse 600px 400px at 50% 50%, rgba(8,145,178,0.04), transparent 50%);
  pointer-events:none;
  z-index:0;
}
#app { position:relative; z-index:1; }

/* ===== 顶部导航栏 ===== */
.topnav {
  position:fixed; top:0; left:0; right:0; z-index:100;
  height:var(--topnav-height);
  background:rgba(255,255,255,0.7);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  border-bottom:1px solid rgba(255,255,255,0.9);
  box-shadow:0 1px 20px rgba(37,99,235,0.06);
  display:flex; align-items:center;
  padding:0 36px;
  gap:24px;
}
[data-theme="dark"] .topnav {
  background:rgba(20,24,36,0.8);
  border-bottom-color:rgba(255,255,255,0.06);
}
.topnav .brand {
  display:flex; align-items:center; gap:12px;
  flex-shrink:0;
}
.topnav .brand-icon {
  width:38px; height:38px; border-radius:12px;
  background:var(--accent-gradient);
  display:flex; align-items:center; justify-content:center;
  font-size:17px; font-weight:800; color:#fff;
  box-shadow:0 4px 16px rgba(37,99,235,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
}
.topnav .brand-name {
  font-size:15px; font-weight:800;
  letter-spacing:-0.01em;
  background:var(--accent-gradient);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  white-space:nowrap;
}
.topnav .tabs {
  display:flex; gap:4px;
  flex:1; justify-content:center;
}
.topnav .tab {
  padding:9px 20px; border-radius:var(--r-pill);
  font-size:13px; font-weight:700; color:var(--text-3);
  cursor:pointer; transition:all 0.25s cubic-bezier(0.25,0.1,0.25,1);
  border:1px solid transparent;
  letter-spacing:0.01em;
  white-space:nowrap;
}
.topnav .tab:hover {
  color:var(--text-1);
  background:rgba(37,99,235,0.06);
}
.topnav .tab.active {
  color:#fff;
  background:var(--accent-gradient);
  box-shadow:0 4px 16px rgba(37,99,235,0.3), inset 0 1px 0 rgba(255,255,255,0.2);
}
.topnav-right {
  display:flex; align-items:center; gap:10px;
  flex-shrink:0;
}
.topnav .search {
  position:relative; flex-shrink:0;
  width:240px;
}
.topnav .search input {
  width:100%; padding:10px 16px 10px 40px;
  border:1px solid rgba(37,99,235,0.12); border-radius:var(--r-control);
  background:rgba(255,255,255,0.6); font-size:13px;
  color:var(--text-1); outline:none; font-family:inherit;
  transition:all 0.25s;
  backdrop-filter:blur(10px);
}
[data-theme="dark"] .topnav .search input {
  background:rgba(30,35,50,0.6);
  border-color:rgba(255,255,255,0.08);
  color:var(--text-1);
}
.topnav .search input:focus {
  background:rgba(255,255,255,0.9);
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(37,99,235,0.12);
}
[data-theme="dark"] .topnav .search input:focus {
  background:rgba(35,40,58,0.9);
}
.topnav .search::before {
  content:'🔍'; position:absolute; left:12px; top:50%; transform:translateY(-50%);
  font-size:13px; opacity:0.6;
}
.theme-btn {
  width:40px; height:40px;
  border:1px solid rgba(37,99,235,0.12);
  border-radius:var(--r-control);
  background:rgba(255,255,255,0.6);
  cursor:pointer;
  font-size:16px;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.25s;
  flex-shrink:0;
}
[data-theme="dark"] .theme-btn {
  background:rgba(30,35,50,0.6);
  border-color:rgba(255,255,255,0.08);
}
.theme-btn:hover {
  transform:translateY(-1px);
  box-shadow:var(--shadow-card);
}

/* ===== 页面容器 ===== */
.page-container {
  padding-top:var(--topnav-height);
  min-height:100vh;
  position:relative;
  z-index:1;
}

/* ===== 筛选栏 ===== */
.filter-bar {
  display:flex;
  align-items:center;
  gap:8px;
  padding:16px 36px 8px;
  max-width:1200px;
  margin:0 auto;
  flex-wrap:wrap;
}
.filter-label {
  font-size:12px;
  color:var(--text-3);
  margin-right:4px;
  font-weight:600;
}
.filter-chip {
  padding:7px 16px;
  font-size:12px;
  border-radius:var(--r-pill);
  border:1px solid var(--glass-border);
  background:var(--glass);
  backdrop-filter:blur(12px);
  color:var(--text-2);
  cursor:pointer;
  transition:all .25s;
  font-family:inherit;
  font-weight:600;
}
.filter-chip:hover {
  border-color:var(--accent);
  color:var(--accent);
  transform:translateY(-1px);
}
.filter-chip.active {
  background:var(--accent-gradient);
  border-color:transparent;
  color:#fff;
  box-shadow:0 4px 16px rgba(37,99,235,0.25);
}

/* ===== 章节选择器（章节页顶部） ===== */
.chapter-selector {
  display:flex;
  gap:6px;
  padding:16px 36px 8px;
  max-width:1200px;
  margin:0 auto;
  overflow-x:auto;
  scrollbar-width:none;
}
.chapter-selector::-webkit-scrollbar { display:none; }
.chapter-selector-item {
  padding:8px 16px;
  font-size:12px;
  border-radius:var(--r-pill);
  border:1px solid var(--glass-border);
  background:var(--glass);
  color:var(--text-2);
  cursor:pointer;
  transition:all .25s;
  font-family:inherit;
  font-weight:600;
  white-space:nowrap;
  flex-shrink:0;
}
.chapter-selector-item:hover {
  border-color:var(--accent);
  color:var(--accent);
}
.chapter-selector-item.active {
  background:var(--accent-gradient);
  border-color:transparent;
  color:#fff;
  box-shadow:0 4px 12px rgba(37,99,235,0.25);
}

/* ===== 内容区 ===== */
.content {
  padding:16px 36px 60px;
  max-width:1200px;
  margin:0 auto;
}
.content-inner { max-width:920px; margin:0 auto; }

/* ===== 页面头部 ===== */
.page-header {
  margin-bottom:28px;
  padding-bottom:24px;
  border-bottom:1px solid rgba(37,99,235,0.1);
  position:relative;
}
.page-header::after {
  content:'';
  position:absolute;
  bottom:-1px; left:0;
  width:80px; height:2px;
  background:var(--accent-gradient);
  box-shadow:0 2px 12px rgba(37,99,235,0.3);
}
.page-title {
  font-size:28px;
  font-weight:900;
  margin-bottom:8px;
  letter-spacing:-.03em;
  background:var(--accent-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.page-desc {
  font-size:14px;
  color:var(--text-2);
  font-weight:500;
}

/* ===== 首页 ===== */
.home-hero {
  text-align:center;
  padding:48px 20px 40px;
  position:relative;
}
.home-hero h1 {
  font-size:42px;
  font-weight:900;
  letter-spacing:-.04em;
  margin-bottom:12px;
  background:var(--accent-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.15;
}
.home-hero .subtitle {
  font-size:14px;
  color:var(--text-3);
  letter-spacing:3px;
  font-weight:600;
}
.overview-grid {
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:40px;
}
.overview-card {
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-card);
  padding:24px 16px;
  text-align:center;
  transition:all .35s cubic-bezier(.25,.1,.25,1);
  position:relative;
  overflow:hidden;
}
.overview-card::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--r-card);
  padding:1.5px;
  background:linear-gradient(135deg, rgba(37,99,235,0.2), transparent 35%, transparent 65%, rgba(124,58,237,0.12));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
}
.overview-card:hover {
  transform:translateY(-4px);
  box-shadow:var(--shadow-float);
  background:var(--glass-strong);
}
.overview-num {
  font-size:32px;
  font-weight:900;
  background:var(--accent-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  line-height:1.2;
}
.overview-card.amber .overview-num { background:linear-gradient(135deg,#EA580C,#DB2777); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.overview-card.green .overview-num { background:linear-gradient(135deg,#059669,#0891B2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.overview-card.red .overview-num { background:linear-gradient(135deg,#DC2626,#EA580C); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.overview-label {
  font-size:12px;
  color:var(--text-3);
  margin-top:6px;
  letter-spacing:.5px;
  font-weight:600;
}
.section-title {
  font-size:22px;
  font-weight:900;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:12px;
  letter-spacing:-.02em;
  color:var(--text-1);
}
.section-title::before {
  content:'';
  width:4px; height:22px;
  background:var(--accent-gradient);
  border-radius:2px;
  box-shadow:0 2px 8px rgba(37,99,235,0.3);
}
.chapter-grid {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:14px;
  margin-bottom:40px;
}
.chapter-card {
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-card);
  padding:22px;
  cursor:pointer;
  transition:all .35s cubic-bezier(.25,.1,.25,1);
  position:relative;
  overflow:hidden;
}
.chapter-card::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--r-card);
  padding:1.5px;
  background:linear-gradient(135deg, rgba(37,99,235,0.25), transparent 40%, transparent 60%, rgba(124,58,237,0.15));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:0;
  transition:opacity .35s;
}
.chapter-card:hover {
  transform:translateY(-5px);
  box-shadow:var(--shadow-float);
  background:var(--glass-strong);
}
.chapter-card:hover::before { opacity:1; }
.card-num {
  font-size:11px;
  color:var(--text-4);
  letter-spacing:2px;
  margin-bottom:8px;
  font-weight:700;
}
.card-name {
  font-size:17px;
  font-weight:800;
  margin-bottom:14px;
  line-height:1.4;
  color:var(--text-1);
  letter-spacing:-.01em;
}
.card-stats {
  display:flex;
  gap:16px;
  margin-bottom:14px;
}
.card-stat {
  font-size:12px;
  color:var(--text-3);
  font-weight:500;
}
.card-stat strong {
  color:var(--accent);
  font-weight:800;
  font-size:16px;
}
.card-progress {
  height:5px;
  background:rgba(37,99,235,0.08);
  border-radius:3px;
  overflow:hidden;
}
.card-progress-fill {
  height:100%;
  background:var(--accent-gradient);
  border-radius:3px;
  transition:width .5s ease;
  box-shadow:0 0 8px rgba(37,99,235,0.3);
}

/* ===== 知识点区块 ===== */
.knowledge-block { margin-bottom:28px; }
.knowledge-header {
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:14px;
  cursor:pointer;
  padding:10px 14px;
  border-radius:var(--r-control);
  transition:background .25s;
}
.knowledge-header:hover { background:var(--glass); }
.knowledge-icon {
  width:34px; height:34px;
  background:var(--accent-gradient);
  border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:15px;
  flex-shrink:0;
  box-shadow:0 4px 12px rgba(37,99,235,0.25);
}
.knowledge-title {
  font-size:17px;
  font-weight:800;
  flex:1;
  color:var(--text-1);
  letter-spacing:-.01em;
}
.knowledge-count {
  font-size:11px;
  color:var(--purple);
  background:rgba(124,58,237,0.1);
  padding:4px 12px;
  border-radius:var(--r-pill);
  font-weight:700;
}
.knowledge-toggle {
  font-size:11px;
  color:var(--text-3);
  transition:transform .25s;
}
.knowledge-toggle.open { transform:rotate(90deg); }
.knowledge-questions {
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-left:46px;
}
.knowledge-questions.collapsed { display:none; }

/* ===== 题目卡片 ===== */
.question-card {
  background:var(--glass);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-card);
  overflow:hidden;
  transition:all .3s cubic-bezier(.25,.1,.25,1);
  position:relative;
}
.question-card::before {
  content:'';
  position:absolute;
  inset:0;
  border-radius:var(--r-card);
  padding:1.5px;
  background:linear-gradient(135deg, rgba(37,99,235,0.15), transparent 40%, transparent 60%, rgba(124,58,237,0.1));
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask-composite:exclude;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
}
.question-card:hover {
  transform:translateY(-2px);
  box-shadow:var(--shadow-card);
}
.question-card:hover::before { opacity:1; }
.question-card.mastered {
  background:linear-gradient(135deg, var(--glass), rgba(5,150,105,0.06));
  border-color:rgba(5,150,105,0.2);
}
.question-header {
  display:flex;
  align-items:flex-start;
  gap:12px;
  padding:18px 20px;
  cursor:pointer;
}
.question-type {
  flex-shrink:0;
  padding:4px 10px;
  font-size:10px;
  font-weight:700;
  border-radius:var(--r-pill);
  margin-top:2px;
  letter-spacing:.3px;
}
.type-mingci { background:rgba(37,99,235,0.1); color:var(--blue); }
.type-jianda { background:rgba(234,88,12,0.1); color:var(--orange); }
.type-lunshu { background:rgba(5,150,105,0.1); color:var(--green); }
.question-text {
  flex:1;
  font-size:14px;
  line-height:1.7;
  min-width:0;
  font-weight:600;
  color:var(--text-1);
}
.question-actions {
  display:flex;
  gap:2px;
  flex-shrink:0;
}
.q-btn {
  width:32px; height:32px;
  border:none;
  background:transparent;
  cursor:pointer;
  border-radius:8px;
  color:var(--text-3);
  font-size:14px;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s;
}
.q-btn:hover { background:rgba(37,99,235,0.08); color:var(--accent); }
.q-btn.favorited { color:var(--orange); }
.q-btn.mastered { color:var(--green); }
.answer-section {
  max-height:0;
  overflow:hidden;
  transition:max-height .4s ease;
}
.answer-section.open { max-height:20000px; }
.answer-divider {
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(37,99,235,0.12), transparent);
  margin:0 20px;
}
.answer-content {
  padding:20px 24px 24px;
  background:linear-gradient(135deg, rgba(37,99,235,0.03), rgba(124,58,237,0.02));
  font-size:14px;
  line-height:1.9;
  border-left:3px solid;
  border-image:linear-gradient(180deg, var(--blue), var(--purple)) 1;
  color:var(--text-2);
}
.answer-content p { margin-bottom:12px; line-height:1.9; }
.answer-content p:last-child { margin-bottom:0; }
.answer-content strong {
  color:var(--accent);
  font-weight:700;
}

/* ===== 搜索结果 ===== */
.search-result {
  background:var(--glass);
  backdrop-filter:blur(20px);
  border:1px solid var(--glass-border);
  border-radius:var(--r-card);
  padding:18px 20px;
  margin-bottom:10px;
  cursor:pointer;
  transition:all .25s;
}
.search-result:hover {
  border-color:var(--accent);
  box-shadow:var(--shadow-card);
  transform:translateX(4px);
}
.result-chapter {
  font-size:11px;
  color:var(--text-3);
  margin-bottom:6px;
  letter-spacing:.3px;
  font-weight:600;
}
.result-question {
  font-size:14px;
  margin-bottom:6px;
  font-weight:600;
  color:var(--text-1);
}
.result-question mark {
  background:var(--accent-gradient);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
  font-weight:800;
  padding:0;
}
.result-meta {
  font-size:11px;
  color:var(--text-4);
  display:flex;
  gap:12px;
  font-weight:500;
}
.no-results {
  text-align:center;
  padding:60px 20px;
  color:var(--text-3);
}
.no-results-icon { font-size:48px; margin-bottom:12px; opacity:.4; }

/* ===== 随机练习 ===== */
.random-card {
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(200%);
  -webkit-backdrop-filter:blur(24px) saturate(200%);
  border:1px solid var(--glass-border);
  border-radius:var(--r-card);
  padding:32px;
  max-width:700px;
  margin:0 auto;
  box-shadow:var(--shadow-card);
  position:relative;
  overflow:hidden;
}
.random-card::before {

}

  padding-bottom:16px;

/* ===== 进度页 ===== */

.progress-big.amber { background:linear-gradient(135deg,#EA580C,#DB2777); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

.progress-row-bar {

<script>
const QUESTIONS = [{"id": 1, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "1.礼乐合 一", "answer": "**定义：儒家思想以仁学及礼乐精神为核心，在此基础上主张礼乐合一，形成一种深刻的礼乐文化。“礼”**\n与“乐”被视为实现仁学的重要手段。礼是礼仪、制度，是一整套的社会规范系统，用以规范和治理社会，\n形成良好的政治秩序；而乐则是音乐，泛指今天所谓艺术。\n**评价：礼乐合一，是儒家的政治理想的集中展现，也是其基本的美学思想与艺术观念。礼乐合一的理**\n念将艺术的情感濡染与社会政治治理结合为一个互补支撑的体系。在礼乐关系的基础上，儒家进一步发展\n出美善、文质、文道、情理等关系范畴，主张美善统一、文质彬彬。"}, {"id": 2, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "2.美善统一", "answer": "**定义：“子谓《韶》,尽美矣，又尽善也。谓《武》,尽美矣，未尽善也。”儒家区别美与善为两种**\n不同的价值，认识到个体的感性需求和社会的伦理道德要求不尽一致，但是并不因此否定美的意义和价\n值， 而是在充分肯定美的意义和价值的前提下要求美与善同一，把尽美尽善视为最高理想。艺术当其表\n现仁和 礼的内容时才真正有意义，美必须是具有社会性价值的东西。\n**评价：儒家对作用于人的感情的艺术高度重视，将之与社会政治和道德伦理联系起来，强调艺术的教**\n化功能。从先秦孔孟思想到宋明理学精神，儒家艺术观念持续发展，对中国文学艺术基本形态的形成产\n生 了深远的影响。"}, {"id": 3, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "3. “情志”说", "answer": "**定义：“诗言志”是儒家艺术观的重要内容。《毛诗序》称：“诗者，志之所之也，在心为志，发言**\n为诗。情动于中而形于言，言之不足故嗟叹之，嗟叹之不足故咏歌之，咏歌之不足，不知手之舞之，足之\n蹈之也。”诗、乐、舞三位一体，艺术发端于“情志”的启动。\n**评价：尽管儒家之“志”包含着政教思想的意思，但已经与“情”并举，表示主体心灵情感的内容。**\n同时，孔子“诗可以怨”、司马迁“发愤著书”等主张，又进一步肯定文学艺术所表达之情感的宽广范围，\n包括了对国家政治、社会现实乃至个体在环境中无法实现自身的种种不合理和不满足进行批判和宣泄。但\n总体说来，儒家中庸理想使得其情感表现是有节制的，“乐而不淫，哀而不伤”,自然情感需要服从于社\n会性的人伦道德与礼制。"}, {"id": 4, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "4.虚静", "answer": "**定义：“虚静”,是一种审美必须要具备的心理状态，要求审美主体要做到忘乎物我，与道合一的境**\n界，方可纵观客观世界以自由地进行审美观照，如此，艺术创造力才最为旺盛，才能创作出和造化天工一\n致的作品。\n**发展：“虚静”说的相关观点最早可在老子《道德经》里提出的说法找到眉目，老子认为只有“涤除”,**\n也就是要扫除一切内心杂念，方能观照得到“道”;庄子继承发展了老子“虚静”的学说，提出了“心斋”、\n“坐忘”,认为它是进入道的境界时所必须具备的一种精神状态。庄子的“虚静”说对后世影响极大，后\n世的文学家和文学理论家都或多或少地受到庄子的“虚静”说的影响。陆机说“伫中区以玄览”,宗炳说\n“澄怀”,刘勰说“贵在虚静”,郭熙说“林泉之心”,都是在指出审美观照时必须具备的虚静心态。"}, {"id": 5, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "5.妙悟", "answer": "**定义：禅宗主张，人在参禅时，通过直观与妙悟的方式来得道，追求一种具有神秘经验性质的心理体**\n验——顿悟、妙悟或领悟。直观与妙悟都不是经由理性分析按照计划得来的结果，而是强调心灵在一定条\n件下对对象本质的直接把握。禅宗的许多偈语都表现人在瞬间的得道，悟之后就是人获得真理的澄明感。\n直观是对事物表象的直接把握， 妙悟就是通过直观而在瞬间参透事理，即所谓“目击道存”。而这正与艺\n术创作中的直觉、灵感与顿悟等心灵现象相通。\n**发展：南宋严羽是“妙悟说”的集大成者，他明确提出“禅道唯在妙悟，诗道亦在妙悟”,“悟乃为**\n当行，乃为本色”。悟的对象是具有“别材”和“别趣”的诗歌艺术，悟的过程“不涉理路，不落言笙”\n(《沧浪诗话 ·诗辩》)妙悟是一种与理性分析无关的、从整体把握、瞬间达至本质的艺术直觉思维。严\n羽还指出了妙悟获得的途径，熟参优秀作品，取法乎上，在浸淫体验中达到艺术感受的飞跃。"}, {"id": 6, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "6.境界", "answer": "**定义：境界是禅宗对人心参禅所达到的阶段和状态的描述，境界是心灵状态，“藉境观心”,在任一**\n境界中都可以观心灵之空静。 境界进入美学话语，突出表现为一种“空”“虚”“静”的诗境与画境，比\n如唐代王维诗歌中的空山、空林与幽静、淡远的境界，再比如明末清初朱耷的绘画，在简单又变形的怪鸟\n怪鱼形象中蕴含着画家极深的精神境界。\n**发展：严羽在《沧浪诗话》中描述“羚羊挂角，无迹可求，故其妙处，透彻玲珑，不可凑泊。如空中**\n之音，相中之色，水中之月，镜中之像，言有尽而意无穷”“色即是空”般的空灵淡远是受禅宗影响的唐\n以后中国艺术特别追求的一种境界。\n到了晚清，王国维更把“境界/意境”当作衡量文学作品高下的最终依据，王国维的“境界/意境”.大\n概是指一种真切鲜明地表现出来的情景交融的艺术形象，其中“真”是最本质的要求。而到了宗白华这里，\n“意境”成为中国古典美学与艺术精神的典范代表，可与西方文化和艺术精神进行对话。\n### (二)简答题"}, {"id": 7, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "1.简述儒家礼乐合一的艺术观念。", "answer": "以孔子为代表的儒家思想是中国古典思想中最重要的内容之一，它对中国人的政治、伦理、生活、文\n学和艺术都产生了巨大而长久的影响。儒家对作用于人的感情的艺术高度重视，将之与社会政治和道德伦\n理联系起来，强调艺术的教化功能。从先秦孔孟思想到宋明理学精神，儒家艺术观念持续发展，对中国文\n学艺术基本形态的形成产生了深远的影响。\n(1)“礼乐合一”与“美善统一 ”\n儒家思想以仁学及礼乐精神为核心，在此基础上主张礼乐合一，形成一种深刻的礼乐文化。“礼”与\n“乐”被视为实现仁学的重要手段。礼是礼仪、制度，是一整套的社会规范系统，用以规范和治理社会，\n形成良好的政治秩序；而乐则是音乐，泛指今天所谓艺术。艺术作用于人的感性和精神，把社会的伦理道\n德规范转化为个体的自觉需求。礼乐合一，是儒家的政治理想的集中展现，也是其基本的美学思想与艺术\n观念。礼乐合一的理念将艺术的情感濡染与社会政治治理结合为一个互补支撑的体系。\n在礼乐关系的基础上，儒家进一步发展出美善、文质、文道、情理等关系范畴，主张美善统一、文质\n彬彬。“子谓《韶》,尽美矣，又尽善也。谓《武》,尽美矣，未尽善也。”儒家区别美与善为两种不同\n的价值，认识到个体的感性需求和社会的伦理道德要求不尽一致，但是并不因此否定美的意义和价值，而\n是在充分肯定美的意义和价值的前提下要求美与善同一，把尽美尽善视为最高理想。艺术当其表现仁和礼\n的内容时才真正有意义，美必须是具有社会性价值的东西。\n(2)“成于乐”与“游于艺”\n在礼乐合一的基础上，儒家进而将艺术看作是完善人格的重要手段，“兴于诗，立于礼，成于乐。”\n这里把诗、礼、乐三者并立，视为培养君子良好的人格品性的必要条件，是人成为仁人的途径。君子修身\n从学诗开始，而最后的完成在于乐，诗与乐都是艺术，孔子高度重视艺术对修身育德的意义。“志于道，\n据于德，依于仁，游于艺”的表达，更明确地将“艺”纳入君子教育的系统中，使道、德、仁和艺四方面\n共同构成一个完整人格达成所必需的四种要素。\n(3)“情志”说\n大体而言，与注重模仿和再现的西方艺术传统相比，中国古典艺术更多处在一种抒情传统的脉络里，\n尤其体现在中国诗词、戏曲、音乐、舞蹈等多种艺术形式。“诗言志”是儒家艺术观的重要内容。《毛诗\n序》称：“诗者，志之所之也，在心为志，发言为诗。情动于中而形于言，言之不足故嗟叹之，嗟叹之不\n足故咏歌之，咏歌之不足，不知手之舞之，足之蹈之也。”诗、乐、舞三位一体，艺术发端于“情志”的\n启动。尽管儒家之“志”包含着政教思想的意思，但此处已经与“情”并举，表示主体心灵情感的内容。\n同时，孔子“诗可以怨”、司马迁“发愤著书”等主张，又进一步肯定文学艺术所表达之情感的宽广范围，\n包括了对国家政治、社会现实乃至个体在环境中无法实现自身的种种不合理和不满足进行批判和宣泄。但\n总体说来，儒家中庸理想使得其情感表现是有节制的，“乐而不淫，哀而不伤”,自然情感需要服从于社\n会性的人伦道德与礼制。"}, {"id": 8, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "2.简述道家自然自由的艺术观念。", "answer": "“儒道互补”是中国古典思想的重要特征之一，其中，道家思想虽然很少有直接讨论美和艺术的内容，\n甚至其思想会贬抑某种刻意的艺术或美，但其追求自然无为、自由无限的价值观，恰恰与艺术和美的本质\n精神相吻合。\n(1)将自然视为最高的美\n道家认为一切人之艺术都需要遵从自然。“天地有大美而不言”(《庄子 ·知北游》),美存在于自\n然之中，人在自然中了解美、寻求美。自然在道家的价值序列中位置很高，自然与“道”同一，自然之美\n在于它体现了道的自然无为的根本特性，“无为而无不为”(老子《道德经》),是道的特性，也是自然\n美的特性。自然无为，意味着无功利、无目的，这恰恰包含了美的基本性质。 一切艺术和美都应该是类自\n然的，无利害、非刻意，反而达至大美。从自然美出发，与美善统一的儒家不同，道家艺术观更多地强调\n美与真的一致性，认为美必须真实无伪，艺术与虚假的事物和情感是格格不入的。道家法天贵真，崇尚天\n然去雕饰的艺术风格，认为真是美的必要条件。\n(2)将自由视为人生和艺术的最高境界\n庄子《逍遥游》的核心是关于自由，真人、至人、神人因懂得天地的自然无为之道而达到自由的境界，\n“游”的境界正是自由与无限的境界，也是美和艺术的境界。道家思想由道和自然的自由与无限推导出人\n的自由与无限，主张人从现实关系中挣脱出来进入超越的境地，人之生命的自然存有与自由发展是根本目\n的，反对一切压迫与功利，而这正是美的本质态度。由“有待”进入“无待”,无所桎梏与依赖，这种道\n家所想象的人的理想境地，也正是高超的艺术之境。\n(3)提出了虚静、物化、心斋、坐忘等艺术美学问题\n在道家看来，得道的途径是主体的心理与精神超越有限自我而与无限的自然和大道同一。主体进入虚\n静的状态，心斋坐忘，超越有形与有限的自我，将己物化，与外物合一，身形虽具，但精神已进入逍遥，\n驰骋于天地万物。这种状态恰恰与艺术创作的状态类似，强调艺术主体超越于一切现实利害关系进入纯粹\n的自由的审美境地，后世文人与艺术家极力标榜道家此种虚静的艺术心理状态。"}, {"id": 9, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "3.简述禅宗的艺术观念。", "answer": "两汉之际，佛教进入中国，经过长久的融合发展和演变，最终成为中国社会重要的宗教形式之一。同\n时，佛教与中国固有思想相结合，形成了特有的禅宗教派，在唐宋时期达至鼎盛。禅宗思想特别推进了中\n国士人的精神生活，其包含的独特的艺术与美学观念，在文学艺术领域产生了巨大的影响。\n(1) 直观与妙悟\n禅宗主张，人在参禅时，通过直观与妙悟的方式来得道，追求一种具有神秘经验性质的心理体验——\n顿悟、妙悟或领悟。直观与妙悟都不是经由理性分析按照计划得来的结果，而是强调心灵在一定条件下对\n对象本质的直接把握。禅宗的许多偈语都表现人在瞬间的得道，悟之后就是人获得真理的澄明感。直观是\n对事物表象的直接把握，妙悟就是通过直观而在瞬间参透事理，即所谓“目击道存”。而这正与艺术创作\n中的直觉、灵感与顿悟等心灵现象相通。\n(2) 韵味与境界\n禅宗的发展带给中国艺术一种特别的美学气质，由于禅宗所追求的内在精神超越，唐代以后中国山水\n画与诗歌日益心灵化，特别表现为一种对无穷的“韵味”和空灵的“境界”的追求。\n在唐宋时代，艺术理论上逐渐用神、趣、韵、味等概念，取代了道、气、理、法等范畴，品鉴书画等\n级的画论和书论提出“逸品”“神品”“妙品”“能品”。逸品和神品都是文人书画所具有的一种超越性\n的精神面貌。司空图的《二十四诗品》更明确将一种清澄淡远的“韵外之致”“味外之旨”作为诗歌品质\n的标准。在禅宗思想影响下，宋人追求一种冲淡、空灵、高古的艺术韵味，大捧陶潜诗歌，诗文推崇“淡”\n味，山水画注重“平远冲淡”,讲求笔墨韵味。\n在韵味之外，境界是禅宗艺术理论的又一核心问题。境界是禅宗对人心参禅所达到的阶段和状态的描\n述，境界是心灵状态，“藉境观心”,在任一境界中都可以观心灵之空静。境界进入美学话语，突出表现\n为一种“空”“虚”“静”的诗境与画境，比如唐代王维诗歌中的空山、空林与幽静、淡远的境界，再比\n如明末清初朱耷的绘画，在简单又变形的怪鸟怪鱼形象中蕴含着画家极深的精神境界。\n严羽在《沧浪诗话》中描述“羚羊挂角，无迹可求，故其妙处，透彻玲珑，不可凑泊。如空中之音，\n相中之色，水中之月，镜中之像，言有尽而意无穷”“色即是空”般的空灵淡远是受禅宗影响的唐以后中\n国艺术特别追求的一种境界。\n到了晚清，王国维更把“境界/意境”当作衡量文学作品高下的最终依据，王国维的“境界/意境”大\n概是指一种真切鲜明地表现出来的情景交融的艺术形象，其中“真”是最本质的要求。而到了宗白华这里，\n“意境”成为中国古典美学与艺术精神的典范代表，可与西方文化和艺术精神进行对话。\n### (三)论述题"}, {"id": 10, "chapter": "第一章艺术观念", "knowledge_point": "知识点1.中国艺术观念演变", "type": "(一)名词解释", "question": "1.论述中国传统的艺术观念。", "answer": "在漫长的历史过程中，中国人形成了丰富多样而又不断发展变化的艺术观念。儒家、道家和禅宗是中\n国古典思想文化中的三个主要流派，它们彼此不同而又相互联系和渗透的关于艺术的论述，可以代表我国\n传统艺术观念的主要内容。\n(1) 儒家礼乐合一的艺术观念\n以孔子为代表的儒家思想是中国古典思想中最重要的内容之一，它对中国人的政治、伦理、生活、文\n学和艺术都产生了巨大而长久的影响。儒家对作用于人的感情的艺术高度重视，将之与社会政治和道德伦\n理联系起来，强调艺术的教化功能。从先秦孔孟思想到宋明理学精神，儒家艺术观念持续发展，对中国文\n学艺术基本形态的形成产生了深远的影响。\n第一，“礼乐合一”与“美善统一”。儒家思想以仁学及礼乐精神为核心，在此基础上主张礼乐合一，\n形成一种深刻的礼乐文化。“礼”与“乐”被视为实现仁学的重要手段。礼是礼仪、制度，是一整套的社\n会规范系统，用以规范和治理社会，形成良好的政治秩序；而乐则是音乐，泛指今天所谓艺术。艺术作用\n于人的感性和精神，把社会的伦理道德规范转化为个体的自觉需求。礼乐合一，是儒家的政治理想的集中\n展现，也是其基本的美学思想与艺术观念。礼乐合一的理念将艺术的情感濡染与社会政治治理结合为一个\n互补支撑的体系。\n在礼乐关系的基础上，儒家进一步发展出美善、文质、文道、情理等关系范畴，主张美善统一、文质\n彬彬。“子谓《韶》,尽美矣，又尽善也。谓《武》,尽美矣，未尽善也。”儒家区别美与善为两种不同\n的价值，认识到个体的感性需求和社会的伦理道德要求不尽一致，但是并不因此否定美的意义和价值，而\n是在充分肯定美的意义和价值的前提下要求美与善同一，把尽美尽善视为最高理想。艺术当其表现仁和礼\n的内容时才真正有意义，美必须是具有社会性价值的东西。\n第二，“成于乐”与“游于艺”。在礼乐合一的基础上，儒家进而将艺术看作是完善人格的重要手段，\n“兴于诗，立于礼，成于乐。”这里把诗、礼、乐三者并立，视为培养君子良好的人格品性的必要条件，\n是人成为仁人的途径。君子修身从学诗开始，而最后的完成在于乐，诗与乐都是艺术，孔子高度重视艺术\n对修身育德的意义。“志于道，据于德，依于仁，游于艺”的表达，更明确地将“艺”纳入君子教育的系\n统中，使道、德、仁和艺四方面共同构成一个完整人格达成所必需的四种要素。\n第三，“情志”说。大体而言，与注重模仿和再现的西方艺术传统相比，中国古典艺术更多处在一种\n抒情传统的脉络里，尤其体现在中国诗词、戏曲、音乐、舞蹈等多种艺术形式。“诗言志”是儒家艺术观\n的重要内容。《毛诗序》称：“诗者，志之所之也，在心为志，发言为诗。情动于中而形于言，言之不足\n故嗟叹之，嗟叹之不足故咏歌之，咏歌之不足，不知手之舞之，足之蹈之也。”诗、乐、舞三位一体，艺\n术发端于“情志”的启动。尽管儒家之“志”包含着政教思想的意思，但此处已经与“情”并举，表示主\n体心灵情感的内容。同时，孔子“诗可以怨”、司马迁“发愤著书”等主张，又进一步肯定文学艺术所表\n达之情感的宽广范围，包括了对国家政治、社会现实乃至个体在环境中无法实现自身的种种不合理和不满\n足进行批判和宣泄。但总体说来，儒家中庸理想使得其情感表现是有节制的，“乐而不淫，哀而不伤”,\n自然情感需要服从于社会性的人伦道德与礼制。\n(2)道家自然自由的艺术观念\n“儒道互补”是中国古典思想的重要特征之一，其中，道家思想虽然很少有直接讨论美和艺术的内容，\n甚至其思想会贬抑某种刻意的艺术或美，但其追求自然无为、自由无限的价值观，恰恰与艺术和美的本质\n精神相吻合。\n第一，将自然视为最高的美。道家认为一切人之艺术都需要遵从自然。“天地有大美而不言”(《庄\n子 ·知北游》),美存在于自然之中，人在自然中了解美、寻求美。自然在道家的价值序列中位置很高，\n自然与“道”同一，自然之美在于它体现了道的自然无为的根本特性，“无为而无不为”(老子《道德经》),\n是道的特性，也是自然美的特性。自然无为，意味着无功利、无目的，这恰恰包含了美的基本性质。 一切\n艺术和美都应该是类自然的，无利害、非刻意，反而达至大美。从自然美出发，与美善统一的儒家不同，\n道家艺术观更多地强调美与真的一致性，认为美必须真实无伪，艺术与虚假的事物和情感是格格不入的。\n道家法天贵真，崇尚天然去雕饰的艺术风格，认为真是美的必要条件。\n第二，将自由视为人生和艺术的最高境界。庄子《逍遥游》的核心是关于自由，真人、至人、神人因\n懂得天地的自然无为之道而达到自由的境界，“游”的境界正是自由与无限的境界，也是美和艺术的境界。\n道家思想由道和自然的自由与无限推导出人的自由与无限，主张人从现实关系中挣脱出来进入超越的境地，\n人之生命的自然存有与自由发展是根本目的，反对一切压迫与功利，而这正是美的本质态度。由“有待”\n进入“无待”,无所桎梏与依赖，这种道家所想象的人的理想境地，也正是高超的艺术之境。\n第三，提出了虚静、物化、心斋、坐忘等艺术美学问题。在道家看来，得道的途径是主体的心理与精\n神超越有限自我而与无限的自然和大道同一。主体进入虚静的状态，心斋坐忘，超越有形与有限的自我，\n将己物化，与外物合一，身形虽具，但精神已进入逍遥，驰骋于天地万物。这种状态恰恰与艺术创作的状\n态类似，强调艺术主体超越于一切现实利害关系进入纯粹的自由的审美境地，后世文人与艺术家极力标榜\n道家此种虚静的艺术心理状态。\n(3)禅宗的艺术观念\n两汉之际，佛教进入中国，经过长久的融合发展和演变，最终成为中国社会重要的宗教形式之一。同\n时，佛教与中国固有思想相结合，形成了特有的禅宗教派，在唐宋时期达至鼎盛。禅宗思想特别推进了中\n国士人的精神生活，其包含的独特的艺术与美学观念，在文学艺术领域产生了巨大的影响。\n第一，直观与妙悟。禅宗主张，人在参禅时，通过直观与妙悟的方式来得道，追求一种具有神秘经验\n性质的心理体验——顿悟、妙悟或领悟。直观与妙悟都不是经由理性分析按照计划得来的结果，而是强调\n心灵在一定条件下对对象本质的直接把握。禅宗的许多偈语都表现人在瞬间的得道，悟之后就是人获得真\n理的澄明感。直观是对事物表象的直接把握，妙悟就是通过直观而在瞬间参透事理，即所谓“目击道存”。\n而这正与艺术创作中的直觉、灵感与顿悟等心灵现象相通。\n第二，韵味与境界。禅宗的发展带给中国艺术一种特别的美学气质，由于禅宗所追求的内在精神超越，\n唐代以后中国山水画与诗歌日益心灵化，特别表现为一种对无穷的“韵味”和空灵的“境界”的追求。\n在唐宋时代，艺术理论上逐渐用神、趣、韵、味等概念，取代了道、气、理、法等范畴，品鉴书画等\n级的画论和书论提出“逸品”“神品”“妙品”“能品”。逸品和神品都是文人书画所具有的一种超越性\n的精神面貌。司空图的《二十四诗品》更明确将一种清澄淡远的“韵外之致”“味外之旨”作为诗歌品质\n的标准。在禅宗思想影响下，宋人追求一种冲淡、空灵、高古的艺术韵味，大捧陶潜诗歌，诗文推崇“淡”\n味，山水画注重“平远冲淡”,讲求笔墨韵味。\n在韵味之外，境界是禅宗艺术理论的又一核心问题。境界是禅宗对人心参禅所达到的阶段和状态的描\n述，境界是心灵状态，“藉境观心”,在任一境界中都可以观心灵之空静。境界进入美学话语，突出表现\n为一种“空”“虚”“静”的诗境与画境，比如唐代王维诗歌中的空山、空林与幽静、淡远的境界，再比\n如明末清初朱耷的绘画，在简单又变形的怪鸟怪鱼形象中蕴含着画家极深的精神境界。\n严羽在《沧浪诗话》中描述“羚羊挂角，无迹可求，故其妙处，透彻玲珑，不可凑泊。如空中之音，\n相中之色，水中之月，镜中之像，言有尽而意无穷”“色即是空”般的空灵淡远是受禅宗影响的唐以后中\n国艺术特别追求的一种境界。\n到了晚清，王国维更把“境界/意境”当作衡量文学作品高下的最终依据，王国维的“境界/意境”大\n概是指一种真切鲜明地表现出来的情景交融的艺术形象，其中“真”是最本质的要求。而到了宗白华这里\n， “意境”成为中国古典美学与艺术精神的典范代表，可与西方文化和艺术精神进行对话。"}, {"id": 11, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "1.模仿论", "answer": "观点：模仿论(早期用“摹仿论”)可谓“西方第一艺术理论”,从古希腊柏拉图开始，直到卢卡奇\n的现实主义，艺术都被认为是对外部自然与社会现实的模仿、描摹、反映和再现。模仿论既是艺术发生论\n--- 艺术来源于对现实的模仿，也是艺术价值论——艺术的价值与意义就在于对外部现实的忠实的映照。\n代表人物：柏拉图、亚里士多德、黑格尔。柏拉图提出了三重世界说；亚里士多德指出，不仅艺术是\n真实的，甚至艺术可能是比现实或历史更真实，“诗人的职责显然不在于描述已发生的事，而在于描述可\n能发生的事，即按照可然律或必然律可能发生的事。”后世的黑格尔继承了柏拉图的理念说，在其《美学》\n中提出“美是理念的感性显现”。"}, {"id": 12, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "2.表现论", "answer": "观点：与模仿论相反相成的是表现论，即认为艺术的本质是人的情感、内心世界、主观精神等的表现，\n而非对自然或社会现实的模仿。这种情感表现论从古希腊的朗吉努斯就开始了，但表现论在西方古典艺术\n观念中一直未成为主流，直到19世纪前后浪漫主义思潮的兴起，情感表现才被广泛接受为一种艺术准则。\n代表人物：华兹华斯、克罗齐。“诗是强烈情感的自然流露，它起源于在平静中回忆起来的情感。”\n华兹华斯用“自然流露”来说明这种诗歌情感的状态，说明诗歌的素材既非事物也非行动，而是诗人液体\n般的情感，并且这种情感流露的原动力不是主观可控的，而是直抒胸臆、不得不发。意大利美学家克罗齐\n提出“美就是直觉，直觉就是表现，表现就是艺术”的观点，为现代艺术中的表现主义提供了理论支撑。"}, {"id": 13, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "3.形式论", "answer": "观点：形式论主张艺术的本质不在于其所模仿的外在社会现实或者其所表现的艺术家的内在情感，而\n就在于艺术作品自身的形式。形式论将社会现实和创作者自身都看作是艺术的外部因素，只有艺术作品无\n可剥离的形式才是艺术真正拥有的，是艺术的本质。\n**发展：形式论在19世纪唯美主义者那里正式出场，随后在造型艺术领域发展为以李格尔(1858-1905)、**\n沃尔夫林(1864-1945)和格林伯格(1909-1994)等为代表的形式主义艺术史观，在语言文学领域发展为英美\n新批评、俄国形式主义和布拉格学派。\n代表人物：卡西尔、克莱夫 ·贝尔。"}, {"id": 14, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "4.艺术体制论", "answer": "**背景：艺术体制论是西方艺术理论在20世纪60年代以后对艺术实践领域出现的先锋派艺术、现成品**\n艺术、波普艺术、观念艺术等新形态进行分析与反思的成果。\n观点：艺术体制是特定时期存在的关于艺术的观念与知识系统，以及艺术品赖以存在的生产、传播、\n消费、评价的完整的社会机制。艺术体制将艺术品放置到一个动态的网络关系中，在这一场域内，不同的\n行动者(艺术家、艺术商、批评家、博物馆负责人等)携带着自己的文化资本进行权利争夺或合作，从而\n使艺术成为社会生活需要的一种文化样式。体制论的思路是将艺术放置于一个结构性的艺术体制之内，在\n一定程度上，正是某一时期的特定艺术体制决定了何为艺术，以及艺术如何被人们理解和接受。\n两个层面：艺术体制可以被分为观念和机构这样软性和硬性的两个层面来进行分析。\n### (二)简答题"}, {"id": 15, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "1.简述模仿论。", "answer": "模仿论(早期用“摹仿论”)可谓“西方第一艺术理论”,从古希腊柏拉图开始，直到卢卡奇的现实\n主义，艺术都被认为是对外部自然与社会现实的模仿、描摹、反映和再现。模仿论既是艺术发生论——艺\n术来源于对现实的模仿，也是艺术价值论——艺术的价值与意义就在于对外部现实的忠实的映照。\n(1)柏拉图\n柏拉图将世界理解为一个以“理念”为中心的三层结构：第一层是理念世界，它是世界的本原，是最\n真实的；第二层是现实世界，是对理念世界的模仿，它的真实性在理念世界之下，但在艺术世界之上；第\n三层是艺术世界，是对现实世界的模仿，它的真实性又比现实世界要差，被认为是“模仿的模仿”“影子\n的影子”。因此，艺术作为模仿，是不具有真实性的。尽管柏拉图否定艺术的价值，但他的理念说和艺术\n是对现实的模仿这一观点则长久地影响了后世的艺术观念。\n(2) 亚里士多德\n柏拉图的模仿说，被亚里士多德继承和发展。亚里士多德提出一种肯定的模仿论，他指出模仿并不是\n某物的复制或镜像反映，而是对现实的一种复杂的中介处理。这可以清晰地见于他所划分的模仿的三个方\n面：模仿的媒介、对象、方式。亚里士多德对于模仿说的完善中最为重要的一点是，他摒弃了“理念”观\n念，认识到事物的普遍与特殊的统一关系，认为“理”就在“事”中，脱离具体事物的“理”是不存在的。\n这样，他首先确认现实的真实性。现实是真实的，模仿现实的艺术也就是真实的。\n同时，更进一步，亚里士多徳指出，不仅艺术是真实的，甚至艺术可能是比现实或历史更真实。“诗\n人的职责显然不在于描述已发生的事，而在于描述可能发生的事，即按照可然律或必然律可能发生的事。”\n“写诗这种活动比写历史更富于哲学意味，更被严肃的对待；因为诗所描述的事带有普遍性，历史则叙述\n个别的事。”亚里士多德认为，历史所写的只是个别的已然的事，不一定见出必然性；而诗歌里的人物虽\n然是虚构的，但恰恰因为出于想象和理想，可以带有普遍性，合乎可然律或必然律，因而诗比历史显出更\n高的真实性，更具有哲学意味。\n(3) 黑 格尔\n后世的黑格尔继承了柏拉图的理念说，在其《美学》中提出“美是理念的感性显现”。作为理念感性\n显现的艺术是真理的承载者，并将真理以具体可感的形式呈现出来，艺术是真理与感性等各种矛盾对立面\n的辩证统一。与柏拉图不同的是，黑格尔将柏拉图那里永恒不变的“理念”发展为一个不断辩证运动、发\n展变化的历史过程，而艺术作为理念的感性显现，理念的辩证运动自然外显为艺术的发展演变。根据这个\n辩证运动原则，黑格尔把艺术类型依发展变化轨迹划分为如下三种：象征型艺术、古典型艺术和浪漫型艺\n术。\n(4)发展：现实主义艺术理论\n在文艺复兴时期，“模仿论”发展为“镜子说”。在绘画领域以达 ·芬奇为代表，在文学领域以莎士\n比亚为代表。这种认为艺术模仿、再现自然和社会的理论，在18至19世纪逐渐发展为现实主义艺术理论。\n与此前的模仿论相比，现实主义更加强调艺术对社会现实的能动反映和再现，强调艺术家的能动创造力，\n而反对艺术对自然的机械复制。这种能动性体现在艺术家并不刻板描绘看似真实的生活表面，而是抓住可\n以体现社会深层本质和内在规律的典型特征，进而由特殊来显现隐匿在其背后的普遍矛盾。\n马克思主义理论家卢卡奇用“内在总体性”来要求现实主义：“艺术作品必须准确无误和恰如其分地\n反映客观地决定着它所再现的生活领域的全部重要因素。它必须如此这般地反映这些因素，使得这一生活\n领域从里到外都是可理解的，可重新体验的，使它表现为一种总体生活。这并不意味着每部艺术作品都要\n竭力反映客观或广延的总体生活。艺术作品的总体性是内在的，从这个意义上来说， 一段最简洁的歌曲\n有 着和一部最壮阔的史诗一样的内在总体性。”这种内在总体性就是对艺术作品反映生活的内在问题、\n根本 矛盾与基本规律的要求，把握这一原则，现实主义的作品就不是单纯地模仿和复制自然和社会现实\n，而是 创造性地发现这一现实的本质。而典型人物和典型环境是达到特殊与一般的统一的有效方法。"}, {"id": 16, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "2.简述表现论。", "answer": "与模仿论相反相成的是表现论，即认为艺术的本质是人的情感、内心世界、主观精神等的表现，而非\n对自然或社会现实的模仿。这种情感表现论从古希腊的朗吉努斯就开始了，但表现论在西方古典艺术观念\n中一直未成为主流，直到19世纪前后浪漫主义思潮的兴起，情感表现才被广泛接受为一种艺术准则。\n(1)华兹华斯\n1798年，华兹华斯(1770-1850)与柯勒律治(1772-1834)这两位英国湖畔诗人共同出版了《抒情歌谣集》,\n但在当时并未获得读者的认可，并受到了当时主导诗坛的古典主义诗歌原则守持者的批判。1800年，诗集\n再版，华兹华斯写作长篇序言，为他们的写作原则和写作实践辩护，这篇序言后来被视为浪漫主义诗歌运\n动的宜言。在《序言》中，华兹华斯阐释了自己的诗歌理想，主张摒弃典雅陈腐、声律和谐的古典主义写\n作原则，强调平白新鲜的语言、自然真切的情感、平凡日常的题材和自由舒展的格律。“诗是强烈情感的\n自然流露，它起源于在平静中回忆起来的情感。”这是《序言》所点明的浪漫主义文学理想的核心原则。\n华兹华斯认为，在这些诗中，是情感给予动作和情节以重要性，而不是动作和情节给予情感以重要性。华\n兹华斯用“自然流露”来说明这种诗歌情感的状态，说明诗歌的素材既非事物也非行动，而是诗人液体般\n的情感，并且这种情感流露的原动力不是主观可控的，而是直抒胸臆、不得不发。诗歌的本质是诗人内心\n情感的外化，诗并不存在于其对象中，而是存在于诗人主体对对象的审美关照中。华兹华斯赋予诗人以某\n种可以被视为浪漫主义气质的东西，更敏锐的感受，更多的热忱和温情，更敏捷地表达自己的思想和感情\n的冲动与能力，即一种易感特性。\n(2)克罗齐\n表现论在浪漫主义之后仍有很多理论发展，比如意大利美学家克罗齐(1866-1952)提出“美就是直觉，\n直觉就是表现，表现就是艺术”的观点，为现代艺术中的表现主义提供了理论支撑。\n表现论将艺术的本源由外部世界拉回到创作者的内心情感，进而将艺术家主体推向了核心地位，这与\n西方现代哲学对人的现代主体的推崇与高扬是一致的，也为20世纪各种艺术实践和艺术理论对创作者的自\n主权力、主体意识、生命本体、自我意识等的发扬铺平了道路。"}, {"id": 17, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "3.简述形式论。", "answer": "模仿论和表现论都有一个根本的理论困境，即模仿同一个对象的所有艺术作品或者表现同一种情感的\n所有艺术作品，是不是本质上是相同的?答案当然是否定的。然而在模仿论和表现论的理论框架内都无法\n正面面对模仿和表现所使用的不同的形式、手法和语言的问题。因此，形式论在19世纪唯美主义者那里正\n式出场，随后在造型艺术领域发展为以李格尔(1858-1905)、沃尔夫林(1864-1945)和格林伯格(1909-1994)\n等为代表的形式主义艺术史观，在语言文学领域发展为英美新批评、俄国形式主义和布拉格学派。形式论\n主张艺术的本质不在于其所模仿的外在社会现实或者其所表现的艺术家的内在情感，而就在于艺术作品自\n身的形式。形式论将社会现实和创作者自身都看作是艺术的外部因素，只有艺术作品无可剥离的形式才是\n艺术真正拥有的，是艺术的本质。\n(1) 卡西尔\n德国哲学家卡西尔认为：“艺术并不是对一个现成的即予的实在的单纯复写。 ……它不是对实在的模\n仿，而是对实在的发现……艺术不追求事物的性质或原因，而是给我们以对事物形式的直观。艺术家是自\n然的各种形式的发现者。”面对清新的自然，我们感到风景宜人，但当构思一幅图画时，我们就由一个活\n生生的事物的领域，进入到了一个“活生生的形式”的领域。艺术家并不描绘或复写某一经验对象，而是\n将其转化为各种艺术形式，当形式确立，形式所联系的那个对象就可以退场了。\n(2)克莱夫 ·贝尔\n克莱夫 ·贝尔则将“有意味的形式”定义为艺术的本体：“在各个不同的作品中，线条、色彩以某种\n特殊方式组成某种形式或形式间的关系，激起我们的审美感情。这种线、色的关系和组合，这些审美的感\n人形式，我称之为有意味的形式。”贝尔反对描述性和再现性的绘画，最看重象征的、抽象的、纯粹的形\n式，他认为：“再现往往是艺术家低能的标志。 一位非常低能的艺术家创造不出哪怕是一丁点能够唤起审\n美感情的形式，就必定会求助于生活感情。”与此相应， 一个合格的欣赏者从形式之中“能够得到远比事\n实、观念的描述所能给与的感情更深刻、更崇高的感情”。\n(3)形式主义艺术史学：李格尔、沃尔夫林、格林伯格\n纯粹的形式与视觉是形式主义艺术史学认定的艺术的本质，并且他们认定从16世纪以来的西方绘画\n史正是纯粹形式和视觉越来越占据主导的历史。\n李格尔提出“艺术意志”的概念，从根本上强调的是一种艺术形式的客观的自主的属性，将古代美术\n到现代美术的发展图式概括为立体-平面、触觉-视觉、客观-主观这三种两极对立的过程。\n沃尔夫林则提出了支配艺术风格发展的普遍法则——即早期阶段、古典阶段和巴洛克阶段循环往复的\n历史规则，认为支配艺术风格变化的既非艺术家，也非其他社会因素，而是不变的法则。他甚至认为可以\n撰写一部没有艺术家名字的艺术史。\n到了格林伯格，他将绘画的本质定义为平面性，认为绘画艺术中的立体空间感和叙事性等效果也见之\n于雕塑和戏剧等艺术，只有平面性是绘画所独有的纯粹的本质。19世纪以前的画家将力图克服平面性在画\n面里塑造深度空间，而现代艺术则执着于绘画自身的平面性本质，放弃景深空间错觉的营造，而将纯粹的\n图画自身呈现出来。因此，蒙德里安等抽象主义的绘画往往被认为是理想的艺术，这也宜示出一种自我指\n涉的绘画的哲学。"}, {"id": 18, "chapter": "第一章艺术观念", "knowledge_point": "知识点2.西方艺术观念演变", "type": "(一)名词解释", "question": "4.简述艺术体制。", "answer": "艺术体制论是西方艺术理论在20世纪60年代以后对艺术实践领域出现的先锋派艺术、现成品艺术、\n波普艺术、观念艺术等新形态进行分析与反思的成果。从杜尚将小便池命名为《泉》参加纽约独立艺术家\n展览，到安迪 ·沃霍尔仿制肥皂包装的商业艺术《布里洛盒子》,当代艺术向人们重新提出了“何为艺术”\n的问题。对此我们需要将问题从“什么是艺术”转换到“是什么使某物被看作是艺术”,即从艺术的本质\n转换到艺术品的资格或身份。问题视域的转换就带出了“艺术体制” (Institutions of Art) 这一当代艺\n术社会学的核心范畴。\n艺术体制是特定时期存在的关于艺术的观念与知识系统，以及艺术品赖以存在的生产、传播、消费、\n评价的完整的社会机制。艺术体制将艺术品放置到一个动态的网络关系中，在这一场域内，不同的行动者\n(艺术家、艺术商、批评家、博物馆负责人等)携带着自己的文化资本进行权利争夺或合作，从而使艺术\n成为社会生活需要的一种文化样式。体制论的思路是将艺术放置于一个结构性的艺术体制之内，在一定程\n度上，正是某一时期的特定艺术体制决定了何为艺术，以及艺术如何被人们理解和接受。\n艺术体制可以被分为观念和机构这样软性和硬性的两个层面来进行分析。\n(1)观念\n首先是作为观念语境的艺术体制。美国分析哲学家阿瑟 ·丹托由对沃霍尔作品的讨论开启了对艺术体\n制问题的研究。丹托指出：“把某物看作是艺术，需要某种眼睛无法看到的东西种艺术理论的氛围，一种\n艺术史知识：这就是艺术界。”也就是说，一件作品成为艺术并不仅仅是因为它自身的物质属性，而是外\n在于它的一种普遍的艺术观念使其被接受为艺术。某一时期的艺术观念与知识所构成的“语境”赋予某个\n日常物品以艺术之名。\n( 2 ) 机 构\n其次是作为机构网络的艺术体制。乔治 ·迪基发展丹托的理论，强调艺术身份的获得是“代表某种社\n会制度(即艺术世界)的一个人或一些人授予它具有欣赏对象资格的地位”。这一 “制度”指的是一个广\n泛而相互联结的关系网络，在这个网络中，艺术品自身的美学属性所能发挥的作用必须被重新认识。\n布迪厄对这一建构艺术的体制结构所包括的各种要素有一个很好的概括：“作品科学不仅应考虑作品\n在物质方面的直接生产者(艺术家、作家等),还要考虑一整套因素和制度，后者通过生产对一般意义上的\n艺术品价值和艺术品之间差别价值的信仰，参加艺术品的生产，这个整体包括批评家、艺术史学家、出版\n商、画廊经理、商人、博物馆馆长、赞助人、收藏家、至尊地位的认可机构、学院、沙龙、评判委员会，\n等等。”在这里，布迪厄强调的不是艺术品自身的生产，而是艺术品价值的生产。艺术品总是被人们接受\n为有着特殊价值和意义，而要实现这一点，就需要有批评家、美术馆、学院、艺术教育等各个机构和环节\n来发挥作用。在这个过程中，艺术家所能起到的作用是有限的，主要是一套机构体制在发挥作用。"}, {"id": 19, "chapter": "第一章艺术观念", "knowledge_point": "知识点3.马克思主义艺术观念", "type": "(一)简答题", "question": "1.简述马克思所说的“人本质力量的对象化”.", "answer": "马克思主义艺术观念是在继承和发扬欧洲思想文明的基础上，针对人类艺术发展的历史过程与现实的\n创作状态而提出的，同时内在于其历史唯物主义与辩证唯物主义的哲学思想与政治经济学思想。马克思主\n义是在人的本质和价值的基础上思考艺术和美的问题的。人是西方哲学思想的根本出发点，对人的本性与\n价值的思考，形成了自文艺复兴以来的人道主义与人本主义思想传统，马克思对这一传统有批判也有继承。\n马克思认为，人不像动物那样完全依靠本能来生存，人还可以进行劳动、创造、艺术活动等，这才是\n自由自觉的活动。审美与艺术活动正是人的自由自觉的生命活动与类本质的最集中的体现。而这与“人的\n本质的对象化”这一论述有关。“正是在改造对象世界的过程中，人才真正地证明自己是类存在物。这种\n生产是人的能动的类生活。通过这种生产，自然界才表现为他的作品和他的现实。因此，劳动的对象是人\n的类生活的对象化。”人的本质力量是指人的一切潜能，即在自由自觉的活动中体现出的人的身体的和精\n神的全部力量，这种力量对象化就是人对自然、社会现实以及审美对象的改造，同时在这种对象化中，人\n的主体力量也得到丰富和发展。审美正是人的本质力量之一，在与审美对象(包括自然和艺术)的互动改\n造中，美感与美产生并发展起来。这就是马克思的实践论美学，美是在一种主客体的实践关系中产生的，\n在这种实践关系中，人及其对象得到相互的改造。\n人的本质力量是指人的一切主体能力，包括人的物质生产能力，也包括人在精神上把握对象的能力，\n其中就包括审美能力。审美力量与人的其他本质力量一样，也是人在改造自然和改造自身的过程中发展起\n来的。美和美感都是主客体在实践基础上相互建构的结果。人的美感和人的艺术创造活动根本上就是人所\n具有的本质力量对象化的实践结果。而同时，这种审美与艺术的对象实践是最属人的自由自觉本性的。正\n是在丰富的审美实践中，人的审美能力和人类的艺术精神硕果得到不断丰富和发展。"}, {"id": 20, "chapter": "第一章艺术观念", "knowledge_point": "知识点3.马克思主义艺术观念", "type": "(一)简答题", "question": "2.简述艺术作品的意识形态属性。", "answer": "在《关于费尔巴哈的提纲》中，马克思明确指出：“人的本质不是单个人所固有的抽象物，在其现实\n性上，它是一切社会关系的总和。”马克思用“一切社会关系的总和”来明确所谓“社会存在物”的内涵，\n彻底摆脱了费尔巴哈的影响，超越了类本质的判断。马克思反对一种固定的、抽象的、不变的人的本质的\n思想，而坚称人的本质是特定时代、特定社会的一切社会关系的总和，生产关系从来不是抽象的，而只能\n是具体的、历史的。同时，社会关系的核心不是别的，只能是生产关系，人的社会性根本上取决于特定的\n生产关系与生产力状况。人总是处在一定的生产力状况下，在特定的生产方式中进行活动，因而结成各种\n马克思批评费尔巴哈的唯物主义是静态的而非实践的，而社会性与实践性是马克思唯物史观的重要原则。\n这种社会的与实践的本性就从自由自觉的生命活动上升为社会活动，因此人的审美能力、美感的发生与对\n事物的美的判断，都是在社会实践过程中形成和发展的。同时，“它是一切社会关系的总和”这一判断，\n也将人的审美艺术活动与经济基础和上层建筑的问题联系起来，这就引出了艺术是“意识形态的形式”这\n个马克思主义艺术观念的另一个重要判断。\n马克思将人类社会的构成分为经济基础和上层建筑两个部分，由生产关系的总和构成的经济基础决定\n了包括政治和法律制度与社会意识形式的庞大上层建筑，在这个结构中，艺术与文学、哲学、宗教等一起\n构成了社会意识形式中具有特定阶级属性的意识形态的形式。因此，艺术具有一定的意识形态属性，是“更\n高地悬浮于空中的意识形态领域”。意识形态通常是某个特定的阶级、民族或群体所共享的一套观念系统，\n具有鲜明的阶级属性。\n艺术作为意识形态的形式之一，也具有或显或隐的阶级属性，它是统治阶级维护其统治的一种工具，\n不过反过来也可以成为被统治阶级进行革命的手段。马克思的艺术意识形态论，从根本上判定了艺术所具\n有的政治性， 揭穿了艺术超阶级超历史的幻象。\n除了艺术的阶级性与政治性，艺术的意识形态属性这一判断还指导人们在整体的社会存在、历史环境、\n经济基础的复杂系统中来辩证地思考艺术的问题。在马克思所描画的社会结构中，意识形态及上层建筑的\n发展变化是由生产力与生产关系之间的矛盾关系，即一个社会的物质生产方式所制约的。因此，当人们思\n考艺术的起源、特性、发展变化等问题时，就必须在社会结构的系统当中寻找答案，需要考察艺术与社会\n生活、艺术与社会经济基础以及艺术与其他社会意识形式之间的复杂而紧密的联系，而非就艺术而谈艺术。\n### (二)论述题"}, {"id": 21, "chapter": "第一章艺术观念", "knowledge_point": "知识点3.马克思主义艺术观念", "type": "(一)简答题", "question": "1.论述艺术内容与形式的辩证关系。", "answer": "内容与形式是人类哲学思想中用以认识和分析事物的一对重要范畴，二者的关系是东西方哲学思考对\n象物的属性、构成与运作的重要问题。马克思批判地继承西方哲学传统，在辩证唯物主义的思想原则下重\n新思考事物的内容与形式的关系，对我们正确理解艺术作品的构成问题具有重要意义。\n(1)艺术是内容与形式的辩证统一\n艺术作品包括内容与形式两个层面，内容是艺术作品所构造的事物、所讲述的故事及其所表达的思想\n感情，形式则是这一内容得以实现的方式、手法与语言符号构造系统。 一件艺术作品是内容与形式的统一\n体，内容要求形式，形式符合内容的要求，二者共同构成一件完整和谐的作品。内容与形式是相互依存、\n相互支撑、不可分割地联系在一起的。在创作伊始，内容与形式就是不可分割而有机地联系在一起的。在\n一个具体作品中，既不存在不表现为一定形式的内容，也不存在不表现一定内容的形式。同时，内容与形\n式可以相互转化。黑格尔曾说：“内容非他，即形式之转化为内容；形式非他，即内容之转化为形式。”\n在一件艺术作品中，内容一定会外显为形式，因为内容是具体的内容，其本身就是具有形式的， 一旦离开\n了形式，内容也就成了抽象的非艺术的东西。而形式“是具有内容的形式，是活生生的实在的内容的形式，\n是和内容不可分离地联系着的形式”。形式转化为内容，形式如果适合于内容，最终就会融合于内容之中，\n加强内容的表达，成为内容本身。\n(2)内容决定形式，形式服从内容\n马克思主义关于内容与形式关系的看法，根本上来自于辩证唯物主义对物质与意识、社会存在与社会\n意识关系的判断，物质决定意识，内容决定形式。对于一件艺术作品来说，是其具体内容决定了特定形式\n的选择，而不是为了形式而形式。形式归根到底是由内容派生出来，并为一定内容服务的。艺术作品的内\n容与形式都是社会生活的反映，艺术的形式也来自于创作者对于社会生活的加工和升华，创作者提炼内容\n的同时提炼出来特定的形式。这一形式服务于内容的表达，只有当形式符合内容的需要、有助于内容表达\n的时候，形式才是合格的、有意义的。\n陈逸飞的大型油画作品《蒋家王朝的覆灭》表现解放军占领南京伪总统府的伟大历史瞬间，在创作手\n记中，他这样说：“我们在思想上抛弃了陈腐的帮规束缚，较大胆地追求历史的真实性，设想将历史的面\n貌通过画笔再现在油画上。我们在创作中想努力去表现人物的个性和注意构图的形式感、画面运动感的趋\n向等等，从主题思想出发，如何有利于主题的突出就如何去画。”画作采用高度戏剧化、舞台化的造型手\n法，正是主题内容在形式上的要求和选择使然。\n(3)形式具有一定的独立性\n内容与形式的关系，是对立统一的矛盾关系。内容决定形式，但形式并非亦步亦趋地跟随内容，并非\n机械性地对应内容，而是具有一定的独立性。\n形式自身具有一定的审美价值，并可以形成相对独立的演进发展的脉络。比如电影镜头语言的发展，\n意大利电影大师安东尼奥尼的作品在空间调度、摄影、运镜方式等电影美学方面有各种开创性的贡献，在\n安东尼奥尼之后，艺术电影发展出一套与商业影片有区别的电影语言。\n此外，形式的相对独立性还体现在，艺术创作最终达到的内容与形式的和谐统一，不是形式消极适应\n内容的结果，而是形式在其积极的探索或实验中，与内容最终达成多样的对立统一，创造出含义丰富、意\n味深长的艺术效果。例如残酷沉重的故事却在一种平静的超脱的语调中被讲述出来。如日本导演是枝裕和\n的影片时常如此，叙事平和、影像清新，而蕴含的思想和情感却极为沉重，形成了独特的风格。\n(4)形式也会反作用于内容\n由于这种相对独立性，在特定的社会历史环境条件下，在内容决定形式的同时，形式也会反作用于内\n容。如前所述，形式可以转化为内容，当形式符合内容的需求，就会增强内容表达的效果，比如伦勃朗在\n画自己晚年的自画像时，采用了厚重的油画笔触，形成了粗糙的肌理效果，很好地凸显出人物老年皮肤的\n质感，更有助于传达出人物粗粝坚定的精神气质。"}, {"id": 22, "chapter": "第一章艺术观念", "knowledge_point": "知识点3.马克思主义艺术观念", "type": "(一)简答题", "question": "2.论述毛泽东文艺思想。", "answer": "毛泽东文艺思想是马克思主义文学理论中国化的结晶，是我国新民主主义革命时期至改革开放前马克\n思主义文学理论中国化的重要理论成果，是对中国优秀文化传统与新文艺经验的科学总结，对我国现代文\n艺发展产生了重大影响。\n(1)主张文艺为人民大众服务\n毛泽东《在延安文艺座谈会上的讲话》最核心的内容是“文艺为什么人服务”的问题，基于人民是历\n史创造主体的唯物史观，毛泽东明确指出，文艺要站在“无产阶级和人民大众的立场”,为最广大的人民\n群众服务、为工农兵服务。毛泽东坚持文艺的阶级性、政治性与工具性，强调文艺要为中国人民革命的伟\n大事业服务。毛泽东追求文艺的大众化，第一次使得文学艺术不再是上层贵族与知识阶层的专属品，而是\n成为广大的劳动者自己的创造活动，并为民众服务。那么如何为人民服务?文艺工作者必须深入扎根于人\n民群众，了解人民的生活，学习人民的语言，在感情上与人民群众连通在一起，这样才能创作出真正的为\n人民的艺术。\n(2)阐明文艺与社会现实之间的辩证关系\n毛泽东明确指出：“人民生活中本来存在着文学艺术的矿藏”,“是一切文学艺术的取之不尽、用之\n不竭的唯一的源泉”,艺术创作必须反映真实的社会生活。但是这种反映并不是机械的镜像复制，“文艺\n作品中反映出来的生活却可以而且应该比普通的实际生活更高，更强烈，更有集中性，更典型，更理想，\n因此就更带普遍性。革命的文艺，应当根据实际生活创造出各种各样的人物来，帮助群众推动历史的前进”。\n这就是社会主义现实主义的创作原则，以现实主义的手法表现社会主义的理想。社会主义革命文艺作品的\n主旨是以这种集中化、典型化的艺术世界来激励和教育人民群众的。\n(3)强调文艺作品的思想内容与艺术形式的统一\n毛泽东把文艺作品的思想内容与艺术形式的统一视为文艺的一条基本规律，这为文艺创作与批评奠定\n了理论基础。首先，文艺作品应当是思想内容与艺术形式的统一。“我们的要求则是政治和艺术的统一，\n内容和形式的统一，革命的政治内容和尽可能完美的艺术形式的统一。缺乏艺术性的艺术品，无论政治上\n怎样进步，也是没有力量的。因此，我们既反对政治观点错误的艺术品，也反对只有正确的政治观点而没\n有艺术力量的所谓‘标语口号式’的倾向。”其次，文艺批评应坚持政治标准与艺术标准统一的原则。“文\n艺批评有两个标准，一个是政治标准，一个是艺术标准。”文艺批评应把政治标准放在第一位而把艺术标\n准放在第二位，但不能把这两者的关系绝对化。文艺作品多种多样，不能用千篇一律的标准要求每一件作\n品，特别不能从狭隘的政治观点出发来限制艺术创作。最后，文艺批评应将作家的动机和作品的实际效果\n统一起来。对文艺作品的检验和评判，不能只看作家的动机而不看效果，也不能只看效果而不看动机，而\n是坚持动机和效果的统一。\n(4)主张中国文艺创造自己的“民族形式”\n毛泽东在抗战时期逐渐形成了关于“民族形式”问题的观点，这一观点根源于他对马克思主义与中国\n革命实践相结合的思考，提出“把国际主义的内容和民族形式”“紧密地结合起来”,创造“新鲜活泼的、\n为中国老百姓所喜闻乐见的中国作风和中国气派”。这一观点与文艺创作相结合，形成了一场参与者众的\n“民族形式”大讨论，论争中涉及了民族文化与西洋文化、民间文艺与精英文艺、普罗大众与知识分子的\n关系等重要问题。新中国成立后，毛泽东进一步指出：“艺术的基本原理有其共同性，但表现形式要多样\n化，要有民族形式和民族风格。”“而民族形式以民间的、大众的各种文艺形式为主，社会主义文艺要使\n用民间语言，并批判地吸收和继承各种民族文化遗产。\n(5)提出“百花齐放、百家争鸣”的艺术繁荣方针\n在文艺为政治服务的总原则之下，毛泽东同样尊重艺术与学术的自由的、民主的发展，提出“百花齐\n放、百家争鸣”,认为这是“促进艺术发展和科学进步的方针，是促进我国的社会主义文化繁荣的方针”。\n“双百”方针是毛泽东文艺思想的进一步发展，鼓励社会主义文艺丰富多样的发展，在这一方针指导下，\n新中国初期的文艺创作取得了丰硕的成果。"}, {"id": 23, "chapter": "第一章艺术观念", "knowledge_point": "知识点3.马克思主义艺术观念", "type": "(一)简答题", "question": "3.论述中国特色社会主义文艺理论。", "answer": "改革开放以来，中国马克思主义文艺理论持续创新发展，构成了新时期文艺思想的基本形态，可以称\n为“中国特色社会主义文艺理论”。中国特色社会主义文艺理论，集中体现在邓小平、江泽民、胡锦涛和\n习近平在新时期以来历次全国文艺工作者代表大会上的讲话以及有关重要文献中。中国特色社会主义文艺\n理论十分丰富，其基本内涵主要包括以下几个方面。\n(1)明确文艺是社会主义精神文明建设的重要内容\n改革开放以来，中国进入社会主义现代化建设的新时期，“我们要在建设高度物质文明的同时，提高\n全民族的科学文化水平，发展高尚的丰富多彩的文化生活，建设高度的社会主义精神文明”。而文学艺术\n是精神文明的重要内容，将文艺的性质定为精神文明建设的内容，意味着文艺超越了单纯作为斗争武器的\n作用，而是为社会主义现代化建设服务，这一理论定性极大地促进了新时期我国文艺创作的发展和繁荣。\n(2)确立文艺“为人民服务、为社会主义服务”的方向\n邓小平提出：“一切进步文艺工作者的艺术生命，就在于他们同人民之间的血肉联系”,必须“自觉\n地在人民的生活中汲取题材、主题、情节、语言、诗情和画意，用人民创造历史的奋发精神来哺育自己”。\n为人民服务和为社会主义服务的“二为”方向依据于时代变化，发展了毛泽东有关文艺为工农兵服务、为\n人民大众服务的思想，并将以往文艺与政治的关系的观念落实到为社会主义现代化建设服务的内涵中。\n(3)坚持“双百”方针，鼓励创作自由与艺术理论自由\n邓小平重提“双百”方针，将其与“二为”方向结合起来，视为新时期文艺发展的重要指导思想。“我\n们要继续坚持毛泽东同志提出的文艺为最广大的人民群众、首先为工农兵服务的方向，坚持百花齐放、推\n陈出新、洋为中用、古为今用的方针，在艺术创作上提倡不同形式和风格的自由发展，在艺术理论上提倡\n不同观点和学派的自由讨论。”在“双百”方针的原则下，新时期党的文艺政策鼓励艺术创作的自由发展\n和艺术理论与评论的自由争鸣。\n( 4 ) 要求文艺满足人民群众日益增长的精神文化需求\n中国特色社会主义文艺理论在改革开放和现代化建设的时代条件下，继承毛泽东关于文艺为人民大众\n服务的思想，并赋予其新的时代内涵。这首先要求突出人民在历史中的决定性作用以及在改革开放和现代\n化建设中所建立的丰功伟业，强调人民创造历史的活动是文艺创作的丰厚土壤和源头活水，人民是检验文\n艺作品的最终仲裁者。这要求文艺工作者以优秀的作品鼓舞人，满足人民群众日益增长的精神文化需求，\n为推进改革开放和现代化建设创造良好的文化环境。\n(5)倡导弘扬主旋律与提倡多样化相统一\n如果说，主旋律是指作为时代发展主流的以爱国主义为核心的民族精神和以改革创新为核心的时代精\n神，那么,多样化则是指这种时代精神的多种艺术形式、多种艺术风格等之间的相互并存和相互争鸣格局。\n中国特色社会主义文艺理论要求在弘扬主旋律的同时也要提倡多样化，为人民群众提供丰富多彩的文艺作\n品。\n(6) 在批判地继承和吸收借鉴的基础上推动文艺创新\n马克思主义文艺理论把继承与创新的统一视为文学艺术发展的基本规律之一，毛泽东文艺思想中就包\n含丰富的文艺继承与创新的辩证思想。文艺工作者要努力继承和发扬中华民族的优秀文化传统，继承和发\n扬五四运动以来形成的革命文化传统，积极学习和借鉴世界各国人民创造的一切先进文明成果，坚持古为\n今用、洋为中用，与时俱进，推陈出新，要立足自我、博采众长，以推进我国文艺形式、风格、流派的充\n分发展，实现体裁、题材、主题的极大丰富。"}, {"id": 24, "chapter": "第一章艺术观念", "knowledge_point": "知识点3.马克思主义艺术观念", "type": "(一)简答题", "question": "4.论述习近平新时代中国特色社会主义文艺表述。", "answer": "习近平新时代中国特色社会主义思想体系，是对马克思列宁主义、毛泽东思想、邓小平理论、“三个\n代表”重要思想、科学发展观的继承与发展，是马克思主义中国化的最新成果。\n(1)从新时代的新实践去定位文艺工作\n习近平在党的十九大报告中将新时代中国特色社会主义文化建设摆在了重要位置，文化建设的成功是\n夺取新时代中国特色社会主义伟大胜利的重要条件，而文学艺术又是文化建设的重要组成部分。报告对中\n国社会主义文化的性质、来源、意义与发展目标等内容做了提纲挈领的概括：“中国特色社会主义文化，\n源自中华民族五千多年文明历史所孕育的中华优秀传统文化，熔铸于党领导人民在革命、建设、改革中创\n造的革命文化和社会主义先进文化，植根于中国特色社会主义伟大实践。发展中国特色社会主义文化，就\n是以马克思主义为指导，坚守中华文化立场，立足当代中国现实，结合当今时代条件，发展面向现代化、\n面向世界、面向未来的，民族的科学的大众的社会主义文化，推动社会主义精神文明和物质文明协调发展。”\n( 2 ) 强 化文艺工作的时代使命\n习近平把文艺的地位和作用上升到新时代中国梦的高度去把握，强调“文艺是时代的号角，最能代表\n一个时代的风貌，最能引领一个时代的风气”。要求文艺要回应十八大以来的重大时代课题，紧密结合新\n的时代条件和实践要求，认识自己所承担的历史使命和责任，自觉地成为时代风气的先觉者、先行者、先\n倡者，通过更多有筋骨、有道德、有温度的文艺作品，书写和记录人民的伟大实践。\n(3)强调坚持以人民为中心\n习近平号召文艺工作要坚持“以人民为中心的创作导向”,“以人民为中心，就是要把满足人民精神\n文化需求作为文艺和文艺工作的出发点和落脚点，把人民作为文艺表现的主体，把人民作为文艺审美的鉴\n赏家和评判者，把为人民服务作为文艺工作者的天职”。\n(4)坚定文化自信，传承和弘扬中华美学精神\n在大国崛起、文化多样的新时代，“文化自信”成为我国文艺发展的重要指导思想。文化自信是继道\n路自信、理论自信和制度自信之后中国特色社会主义的“第四个自信”。“广大文艺工作者要善于从中华\n文化宝库中萃取精华、汲取能量，保持对自身文化理想、文化价值的高度信心，保持对自身文化生命力、\n创造力的高度信心，使自己的作品成为激励中国人民和中华民族不断前行的精神力量。”\n(5)坚持百花齐放、百家争鸣，坚持创造性转化、创新性发展\n习近平文艺思想是辩证的科学的体系，在坚持文化自信和中华美学精神、坚持主流文化方向和社会主\n义核心价值观的同时，也要“坚持百花齐放、百家争鸣，坚持创造性转化、创新性发展”。百花齐放、百\n家争鸣一直是党的基本文艺政策，要发扬“学术民主、艺术民主”,这是保证文艺事业开放活跃的重要条\n件。同时，习近平指出：“传承中华文化，绝不是简单复古，也不是盲目排外，而是古为今用、洋为中用，\n辩证取舍、推陈出新，摒弃消极因素，继承积极思想，‘以古人之规矩，开自己之生面’,实现中华文化\n的创造性转化和创新性发展。”“两创”强调的是在新的时代条件下对传统文化进行创造性与创新性的阐\n发、调整、转化与再造，使之更好地与当代现实相适应。\n(6)强调艺术理论及文艺评论的重要意义\n习近平要求高度重视和切实加强文艺评论工作，发挥文艺评论褒优贬劣、激浊扬清的作用，更加有效\n地引导创作、推出精品、提高审美、引领风尚。“要以马克思主义文艺理论为指导，继承创新中国古代文\n艺批评理论优秀遗产，批判借鉴现代西方文艺理论”,“运用历史的、人民的、艺术的、美学的观点评判\n和鉴赏作品，在艺术质量和水平上敢于实事求是，对各种不良文艺作品、现象、思潮敢于表明态度，在大\n是大非问题上敢于表明立场，倡导说真话、讲道理，营造开展文艺批评的良好氛围”。\n习近平对艺术理论及文艺评论工作的诸多具体阐述，如“文艺不能当市场的奴隶”“文艺批评要的就\n是批评”“文艺批评就要褒优贬劣、激浊扬清”等思想，为文艺评论工作者坚持文艺评论的精神导向和理\n性准则提出了明确要求。"}, {"id": 25, "chapter": "第一章艺术观念", "knowledge_point": "知识点4.艺术的特性", "type": "(一)简答题", "question": "1.简述四种掌握世界的方式。", "answer": "马克思将艺术与理论、宗教和实践列为四种掌握世界的不同方式，艺术可以为人们提供认识和把握世\n界的途径，是一种高级的智性活动，而非单纯娱乐。但不同于其他三种掌握世界的方式，艺术的掌握是凭\n借情感、形象、形式和直观，而非依靠概念和逻辑。艺术作为一种掌握世界的特殊方式，这一论断是马克\n思对艺术特性与价值的准确概括。\n(1)理论的方式\n第一种是理论的方式，这种方式以抽象思维和逻辑思维为方法，对感性世界进行概念化，从具体上升\n为抽象，提炼出各种科学、哲学等理论范畴和体系，以此在认识上来掌握世界。\n(2)宗教的方式\n第二种是宗教的方式，这种方式以超越的彼岸世界为对象，采用幻想的方式将世界把握为各种宗教形\n象、教义和故事。\n(3)实践精神的方式\n第三种是实践精神的方式，这种方式以现实物质世界为对象，通过种种实践活动改造客观世界，并使\n主体的精神和存在也得到改造。\n(4)艺术的方式\n第四种就是艺术的方式，不同于其他三种方式，艺术通过人的审美能力与对象世界直接沟通，而获得\n一种对世界的整体与细节、内容与形式、表象与本质、个性与共性的相统一的把握。"}, {"id": 26, "chapter": "第一章艺术观念", "knowledge_point": "知识点4.艺术的特性", "type": "(一)简答题", "question": "2.简述艺术的方式的特殊性。", "answer": "艺术之不同于理论、宗教和实践的掌握世界的方式的主要方面，在于其想象性、典型性和形式性。\n( 1 ) 想 象 性\n艺术掌握世界的方式之所以不同于理论掌握、宗教掌握和实践掌握等方式，突出地表现在它要求充分\n发挥艺术家的想象力的创造性作用。艺术活动是一种充满丰富的想象力及相应的情感色彩的积极创造，同\n时也有别于宗教中人的主体的消极状态，包含着人的主体的巨大能动作用。奥地利表现主义画家埃贡 ·席\n勒的人物画，完全不同于传统西方油画对人体形态的正确表现惯例，画家使用极具风格化的突出棱角的线\n条，对人体进行夸张和变形，呈现出画家独特的想象力、精神气质与情感态度。\n(2)典型性\n想象力作为人类用艺术掌握世界的主要能力，需要通过塑造富于典型性的艺术形象去实现。艺术作品\n及其创造的艺术形象，当其成功地在特殊的个别中真实地再现社会发展的普遍规律时，就具有了典型性。\n以具有典型性的艺术形象反映社会生活，是马克思主义艺术观的一条基本原则。恩格斯明确要求好的现实\n主义作品除了“细节的真实”外，还要真实地再现“典型环境中的典型人物”。由此他赞扬巴尔扎克的《人\n间喜剧》不仅生动描写19世纪初法国急剧变化的社会生活环境，而且还在这种“典型环境”中塑造出“贵\n妇人怎样让位给为了金钱或衣着而给自己丈夫戴绿帽子的资产阶级妇女”的典型形象，从而“给我们提供\n了一部法国社会，特别是巴黎上流社会的无比精彩的现实主义历史”。\n(3)形式性\n艺术总是通过特定的语言形式来掌握世界的。艺术掌握世界的方式，说到底需要以艺术语言形式去实\n现。艺术的形式性，是指艺术具有以语言形式去反映社会生活的特性。正是借助于特定的艺术语言形式，\n艺术品向人们展现出一个来源于现实但又高于现实的虚拟的世界。与理论的、宗教的和实践的掌握方式不\n同，艺术掌握的对象并不在对象的实体，而在于对象的语言形式。画家而对古松，观照的乃是古松的斑驳\n的树皮与曲折的形态，而非松树的实存。艺术所要掌握的是事物的形象和形式，是可见的表象，而非实在，\n并且最充分欣赏着这种外观的全部丰富性和多样性，从而创造出生动的五彩缤纷的形象。艺术掌握世界的\n独特性就在于它并不需要对事物的实存与本质负责，而就是以感性形式的对称、和谐或不规则、杂多等，\n给人以美感。"}, {"id": 27, "chapter": "第一章艺术观念", "knowledge_point": "知识点5.艺术生产与艺术消费", "type": "(一)名词解释", "question": "1.艺术生产", "answer": "**定义：“艺术生产”这个概念由马克思提出，他从生产实践活动出发，把艺术看作是一种特殊的、高**\n级的精神生产。马克思在《1844年经济学哲学手稿》中说：“宗教、家庭、国家、法律、道德、科学、艺\n术等，都不过是生产的一种特殊的方式，并且受生产的普遍规律的支配。”\n层次：马克思艺术生产理论包含两个层次，分别概括了艺术活动的前后两个阶段：第一个层次是艺术\n创作作为一种精神生产，遵循一般的物质生产规律，创作者生产出艺术作品；第二个层次是艺术作品作为\n一般的商品，进入商品流通系统，经由消费而为资本家创造利润。\n### (二)简答题"}, {"id": 28, "chapter": "第一章艺术观念", "knowledge_point": "知识点5.艺术生产与艺术消费", "type": "(一)名词解释", "question": "1.简述马克思的艺术生产理论。", "answer": "在1857年写作的《〈政治经济学批判〉导言》中，马克思明确阐发了精神和艺术所属的特殊的生产：\n“关于艺术，大家知道，它的一定的繁盛时期绝不是同社会的一般发展成比例的，因而也绝不是同仿佛是\n社会组织的骨骼的物质基础的一般发展成比例的。例如，拿希腊人或莎士比亚同现代人相比。就某些艺术\n形式，例如史诗来说，甚至谁都承认：当艺术生产一旦作为艺术生产出现，它们就再不能以那种在世界史\n上划时代的、古典的形式创造出来；因此，在艺术本身的领域内，某些有重大意义的艺术形式只有在艺术\n发展的不发达阶段上才是可能的。如果说在艺术本身的领域内部的不同艺术种类的关系中有这种情形，那\n么,在整个艺术领域同社会一般发展的关系上有这种情形，就不足为奇了。”这段话首次明确提出了“艺\n术生产”概念，并深刻阐明了艺术生产的内涵，说明了艺术的发展繁盛与社会的物质基础之间的一般发展\n关系，也提出了物质生产的发展与艺术发展的不平衡关系。\n(1)艺术生产是与一般的物质生产不同的精神生产中的一种\n马克思将人类的劳动生产分为物质生产和精神生产两类，前者以物质和经济材料为对象，生产出可以\n满足人类生存发展的物质基础和经济文明，后者则通过人类的头脑和智力对现实材料或以往精神成果进行\n加工、思考和创造，生产出可以满足人类心灵和精神需要的精神产品。艺术生产正是精神生产的一种，艺\n术家运用自己的头脑来加工生活素材，创造出艺术作品，是一种精神性的活动和劳动。但艺术生产和更广\n泛的精神生产本质上也都是生产劳动，与物质生产一样“受生产的普遍规律支配”。马克思将艺术理解为\n艺术生产的根本旨趣，就在于确认艺术及其整体活动从属于政治经济学意义上的生产劳动，这是艺术生产\n思想的核心。\n(2)资本主义条件下艺术成为商品经济的一部分的现象\n马克思还用“艺术生产”一语概括资本主义条件下艺术成为商品经济的一部分的现象。马克思指出，\n艺术家的劳动成果被资本家窃取，成为资本家榨取剩余价值的源泉。在资本主义条件下，艺术生产服从资\n本主义商品经济规律，艺术家出卖劳力，成为资本家的雇佣劳动者，其艺术产品进入市场实现其交换价值，\n为资本家换取剩余价值。比如马克思所说的被剧场老板雇佣去演唱的歌女，为书商进行写作赚取稿费的莱\n比锡的作家等，他们所从事的精神劳动成为资本主义经济生产中的一个同质部分，艺术作品也被当作商品，\n通过被消费来实现价值。文学与艺术在这一层艺术生产的意义上，由“非生产劳动”转化为“生产劳动”,\n发挥着为资本家生产利润、为社会积累财富的功能，从而变成社会生产的一个部类或行当。\n可见，马克思艺术生产理论包含两个层次，分别概括了艺术活动的前后两个阶段：第一个层次是艺术\n创作作为一种精神生产，遵循一般的物质生产规律，创作者生产出艺术作品；第二个层次是艺术作品作为\n一般的商品，进入商品流通系统，经由消费而为资本家创造利润。马克思艺术生产理论为我们正确理解艺\n术及其整体活动的性质提供了科学依据。"}, {"id": 29, "chapter": "第一章艺术观念", "knowledge_point": "知识点5.艺术生产与艺术消费", "type": "(一)名词解释", "question": "2.简述物质生产的发展与艺术发展的不平衡关系。", "answer": "在《《政治经济学批判〉导言》中，马克思提出了“物质生产的发展例如同艺术发展的不平衡关系”\n的观点，这构成了其艺术生产理论的重要内容。\n艺术作为社会意识形态的一种，由经济基础决定，受制于特定历史时代下的物质生产的水平和条件。\n这是马克思历史唯物主义艺术观的基本论断。但马克思并没有将这种关系僵化和教条化，经济基础对艺术\n的影响是要经过复杂的中介环节的，上层建筑中政治、法律制度的层面和其他社会意识形态都发挥了这种\n中介作用，这使得经济基础对艺术的决定并非是直线的，而是存在着不平衡。马克思说：“关于艺术，大\n家知道，它的一定的繁盛时期绝不是同社会的一般发展成比例的，因而也绝不是同仿佛是社会组织的骨骼\n的物质基础的一般发展成比例的。”这是关于物质生产与艺术生产发展的不平衡关系的核心论述。\n(1)不同的艺术种类的发展繁盛与经济基础的发展不平衡\n马克思主要讨论了两种不平衡的状况。首先是不同的艺术种类的发展繁盛与经济基础的发展不平衡，\n一定的艺术种类只有在特定历史阶段上才能获得充分发展，即使后世经济水平更高，这种艺术形式也无法\n再达到顶峰，如荷马史诗、古希腊悲剧、唐诗、宋词等都是当时历史条件的产物，在后世这种艺术体裁就\n基本衰落。这些艺术形式恰恰是在其繁盛的特定时代获得了最利于其发展的种种条件和环境，凝结着这一\n时代的深刻特征，反而导致其在后世其他条件下难以获得同样的发展，比如史诗想象与神话思维是很难在\n基督教世界或世俗世界中继续发展的。\n(2)艺术发展的整体水平与特定时代的经济基础水平不一致\n其次是艺术发展的整体水平与特定时代的经济基础水平不一致。比如古希腊时代尽管比19世纪在经济\n基础水平上落后，但其灿烂的艺术成果则远远超过后者；在我国的先秦时代，尽管社会动荡，礼崩乐坏，\n却产生了儒、道、法等诸子百家的伟大思想，后世几千年尽管经济发展，但也极少出现能与先秦诸子的丰\n饶思想相比的时代。这两种情况都说明了艺术发展与经济发展的不平衡关系，但根本上，艺术仍受制于经\n济基础。古希腊也好，先秦也好，作为人类的“轴心时代”,在文化艺术和思想领域取得了卓越的成就，\n仍是跟这一时代的社会环境、生活方式与经济条件相适应的，不同民族的人类在这一阶段进入文明的更高\n层级，生产方式提升，政治制度变革，思想环境开放。社会转型期尽管动荡不安，却由于其开放和变化，\n而利于孕育更丰富的精神文明。"}, {"id": 30, "chapter": "第一章艺术观念", "knowledge_point": "知识点6.艺术的审美特性", "type": "(一)论述题", "question": "1.论述艺术的审美特性。", "answer": "艺术的审美特性是人类审美意识的集中体现，包括在艺术生产和艺术消费过程中所具有的激发情感、\n创造形象与形式、获得精神的愉悦与超越的价值。\n(1)艺术审美是人类审美经验的集中表现\n在马克思看来，人的本性是自由自觉的有意识的生命活动，具有丰富的本质力量，既包括改造自然物\n质世界的体力与智慧等身体能力，也包括了种种感官能力和情感与意志能力，其中就包括审美的能力与意\n识。人可以在众多对象中发挥审美意识、进行审美活动，比如美丽的大自然、悲壮的社会事件与行为，和\n伟大的艺术作品。其中，艺术是最主要的审美对象，艺术美是美的集中体现，艺术的审美性是人类审美经\n验的集中表达。\n在艺术活动中，艺术家的创造力、想象力、对真善美的体悟和相应的艺术技巧与能力充分发挥，凝结\n于艺术作品之中；而面对这一作品的接受者，会被其中的内容、形象、思想和形式打动，激发出自身的审\n美意识，体会到精神的愉悦甚至人生的超越感。艺术是人类感受美、创造美和表现美的重要方式，由于人\n类有意识的创造，并且可以根据理想来创造，因而艺术可以超越现实的自然和社会，艺术美比自然和社会\n现实的美更纯粹、更完满。\n(2)情感性是艺术审美特性的根本\n情感性指艺术作品中饱含着创作者寄予的丰厚复杂的情感，而接受者则被激发起相应的情感体验，形\n成共鸣。审美(Aesthetics) 一 词的本意即为“感性”, 当鲍姆加登(1714-1762)创立美学这门学问时，其\n意就在为感性正名，在启蒙运动高扬的理性价值之外，增加感性的位置，美学是处理人的感性的学问，审\n美的根本是一种情感和精神上的愉悦的感觉。人们在艺术中表达情感，体验情感，创造超越于日常感情的\n更丰富、更细腻的情感。虽然各门艺术使用的语言不同，或通过音符，或通过色彩和体积，或通过表演，\n但情感的传达是共通的。情感是创作的动力，发愤著书，情感不可遏，带来表达的欲望，才会有作品产生。\n而接受者与某一艺术作品相遇，体验到其中的或强烈或复杂的情感，受到陶冶和净化，这正是艺术教育发\n生的途径。艺术是个人抒发情感的重要手段，也是人类进行情感沟通、超越自身情感而了解和同情更广泛\n的他人情感的重要途径。\n(3)形象与形式是艺术审美特性的来源\n艺术的审美特性的达成，不是依靠概念和说理，而是依赖形象的塑造和形式的构造。艺术家使用在艺\n术史发展的特定阶段形成的、并带有自己风格的形式语言，在艺术作品中塑造出形形色色的活生生的形象。\n这种形象和形式，构成了艺术作品呈现出来的基本面貌。形式处于最外层，是特定的色彩、体积、构图、\n旋律、词语、镜头、摄影、舞台、动作等，是接受者最直接接触到的层面。形象则是经由这些表层形式而\n形成的完整的鲜活的人物和自然等的形象，在作品中是比形式更内在的层次。艺术以适当的形式构筑出鲜\n活的形象，这是艺术审美性的主要来源。\n(4)超越的精神内涵是艺术审美的最高价值\n形式与形象是艺术作品的较接近外部的层面，思想与精神内涵则是一件作品更内在的层面，为人们提\n供超越的精神内涵是艺术美的最高价值。所谓超越，是指艺术可以为接受者提供高于现实生活与日常情感\n的更加理想和集中的生活体验和情感体验，提升人的精神境界。在艺术中，人超越于有限自我而达到无限\n自 由 。\n这种超越首先表现为人对艺术世界的移情，仿佛庄周梦蝶，人与艺术中的世界同一。乔治 ·桑也曾以\n自己与植物、草、飞鸟、树顶、云、流水、地平线等同化的体验为例，描述过这种超脱于有限自我而投入\n对象世界的状态。人们在艺术中突破有限的自我，体味不同的人生。除此之外，艺术的超越性更表现为人\n对各种现实关系的超越而达到的精神自由状态。波兰电影大师基耶斯洛夫斯基导演的《蓝》《白》《红》\n三部曲，是充满哲理与诗性的电影，其中《蓝》讲述女主人公在作曲家丈夫意外去世后， 一方面承受着丧\n夫之痛，另一方面却发现丈夫有一个已经怀孕的情人。影片用精湛的表演和恰切的交响乐表现出女主人公\n极度复杂、难以表达的痛苦和爱恨。结尾时，女主人公最终克服了精神上的矛盾，放下爱恨，完成了丈夫\n的遗作。影片将人类情感的复杂性充分揭示出来，并最终引导人走向精神的自由。"}, {"id": 31, "chapter": "第二章艺术的功能", "knowledge_point": "知识点1.艺术功能的理论回顾", "type": "(一)名词解释", "question": "1.兴观群怨", "answer": "【 参 考 答 案 】\n提出：孔子明确提出：“《诗》,可以兴，可以观，可以群，可以怨；迩之事父，远之事君；多识于\n鸟兽草木之名。 ”其用意就在于让艺术发挥积极的作用，让人认识社会与历史，同时增强对自然的认识。\n当然，更为根本的目的则使外在、他律的社会规范更加自然地内化为个人内心的自律的诉求，从而，社会\n与个人之间的联系就有了最为根本的契合。\n影 响 ：在儒家思想的影响下，中国古人常常崇奉“文以载道”的审美理想，非常值得注意的是，尽管\n不同的人对于何为“文”、何为“道”,以及如何“载”等，在理解上颇具差异，但是，“文以载道”始\n终关联着艺术的内容与形式、思想性与艺术性等的关系。与此同时，中国文论历来也有一种“诗言志”的\n功能论认识，这里所重视的是艺术与人的内心世界的关联。"}, {"id": 32, "chapter": "第二章艺术的功能", "knowledge_point": "知识点1.艺术功能的理论回顾", "type": "(一)名词解释", "question": "2.三重世界说", "answer": "【 参 考答 案 】\n含义：古希腊哲学家柏拉图将世界划分成三重，分别是理念、事物、表象。所谓理念，是指在某事物\n出现之前，便已经存在着的关于这个事物的决定性规则。柏拉图认为，神 (god) 创造出来理念 (idea),\n工 匠(craftsman) 按照理念(idea) 制作出事物(thing), 摹仿者(imitator) 摹仿出事物的表象(appearance)。\n这三者的关系中，理念是最高等级的，是最真实的。事物只是对理念的摹仿，是对理念的不完整的分有。\n至于画家创作出来的表象，本身就是对不完美的事物的慕仿，那就离最完美的理念更远了。所以，在柏拉\n图的观点里，艺术只是慕仿的摹仿，是最不真实的东西，它的等级也最低。\n**特点：**\n(1)柏拉图坚持了理性对感性的优势，这也表征了哲学鄙视诗的传统 。\n(2)柏拉图所谓的艺术世界模仿现实世界实际上是指的艺术只是对现象世界层面的亦步亦趋、照猫画\n虎的纯粹技术性活动，他并不承认艺术家能够对真理占有并表现真理，按照柏拉图的这种看法，艺术家的\n摹仿是格局低下的。"}, {"id": 33, "chapter": "第二章艺术的功能", "knowledge_point": "知识点1.艺术功能的理论回顾", "type": "(一)名词解释", "question": "3.净化说", "answer": "含义：净化是指欣赏者在欣赏艺术作品时，继共鸣之后而不由自主达到的调节精神、排遣情绪、去除\n杂念和人格提升的状态。\n**作用：**\n(1)暂时避世以求心灵的平衡。读者可以进入某种虚幻的艺术境界，因而暂时忘却世俗的困扰和人生\n的烦恼，维持心灵的平衡。\n(2)宜泄情绪以求人格的纯正。由于作品中某种情感力量的震撼，使读者的某种情绪得以宜泄，使畸\n变的心态得以矫正，使扭曲的人格变得纯正。\n**评价：亚里士多德把人看作是肉体与心灵、理性和非理性的结合，因而，他认为要实行和谐的结合，**\n形成幸福、完美的人格，既培养理性，又不排斥感性，而艺术可以是一种理想的手段。通过“净化说”,\n他深刻地解释了悲剧艺术何以给人带来快感的问题，从而为悲剧艺术提供了一种前所未有的价值判断。"}, {"id": 34, "chapter": "第二章艺术的功能", "knowledge_point": "知识点1.艺术功能的理论回顾", "type": "(一)名词解释", "question": "4.寓教于乐", "answer": "含义：古罗马时期，贺拉斯也是力图要将艺术中的理性与情感统一起来，尤其是提出了著名的“寓教\n于乐”的观念。他在《诗艺》中写道：“如果是一出毫无益处的戏剧，长老的‘百人连’就会把它驱下舞\n台；如果这出戏毫无趣味，高傲的青年骑士便会挥头不顾。寓教于乐，既劝喻读者，又使他喜爱，才能符\n合众望。 ”\n**评价：贺拉斯的“寓教于乐”理论揭示了文学艺术的审美作用和认识教育作用的关系，但也隐含着使**\n文学创作可能出现公式化、概念化的情况。"}, {"id": 35, "chapter": "第二章艺术的功能", "knowledge_point": "知识点1.艺术功能的理论回顾", "type": "(一)名词解释", "question": "5.崇高", "answer": "**定义：作为审美形态，它主要指对象以其粗犷、博大的感性形态，劲健的物质力量和精神力量，雄伟**\n的气势，给人以心灵的震撼，使人惊心动魄、心潮澎湃，进而受到强烈的鼓舞和激越，引起人们产生敬仰\n和赞叹的情怀，从而提升和扩大了人的精神境界。在审美意象的形式构成上，崇高往往具有粗犷博大的感\n性形态。\n崇高的对象都是以严峻冲突为特征的审美对象，它以现实客体压倒实践主体为其外表特征，而其实质\n在于受到压抑的时间主体充分激发起人的本质力量，转而征服、掌握客体。崇高不是主客体的和谐统一的\n静态美，而是双方在对立、冲突之中趋向统一的动态美。\n代表人物：朗吉弩斯、博克、康德\n观点：朗吉弩斯，西方美学史上最早提出崇高。并在《论崇高》中论及了这一美的范畴。博克最早把\n优美与崇高并立起来加以研究，认为崇高以痛感为基础，是痛感向快感的转变。康德进一步把崇高进行了\n分类，认为崇高分为数学的崇高和力学的崇高两种。\n### (二)简答题"}, {"id": 36, "chapter": "第二章艺术的功能", "knowledge_point": "知识点1.艺术功能的理论回顾", "type": "(一)名词解释", "question": "1.简述柏拉图的三重世界说。", "answer": "古希腊哲学家柏拉图将世界划分成三重，分别是理念、事物、表象。所谓理念，是指在某事物出现之\n前，便已经存在着的关于这个事物的决定性规则。柏拉图认为，神(god) 创造出来理念(idea), 工匠\n(craftsman) 按照理念(idea) 制作出事物(thing), 摹仿者(imitator) 摹仿出事物的表象(appearance)。\n这三者的关系中，理念是最高等级的，是最真实的。事物只是对理念的摹仿，是对理念的不完整的分有。\n至于画家创作出来的表象，本身就是对不完美的事物的摹仿，那就离最完美的理念更远了。所以，在柏拉\n图的观点里，艺术只是摹仿的摹仿，是最不真实的东西，它的等级也最低。\n首先，艺术有可能是虚假的，不能提供真理。作为客观唯心主义者，柏拉图认定只有超乎感性的“理\n念世界”才是绝对的和永恒的，而“现象世界”却是相对的、暂时的和不真实的。因而，只有体现着绝对\n理念的神作为世界的真正主宰，才能给人提供真理和美。现象世界只是理念世界的摹本和影子，原本已经\n是虚假和不可靠的，那么模仿现象世界的艺术则成为摹本的摹本、影子的影子，因而与最高的真理隔了三\n层，其包含的真理成分也就颇成问题了。\n其次，艺术家有可能模仿人性中的“卑劣部分”,而如果人们通过艺术作品模仿其中的人物的言行，\n就有可能产生伤风败俗、戕害心灵的严重问题。譬如，荷马史诗里描绘了从特洛伊战争中返回的奥德修斯\n将围绕其妻子珀涅罗珀周围的求婚者一一予以残酷报复的故事，显然是迎合低劣的、情欲的人性部分。他\n断言：“模仿诗人既然要讨好群众，显然就不会费心思来模仿人性中的理性部分，他的艺术也就不求满足\n这个理性的部分了；他会看重容易激动感情的和容易变动的性格，因为他们容易模仿。”鉴于以上两条罪\n状，柏拉图要求诗人只能颂扬神和赞美好人，否则，就驱逐出“理想国”。\n但是，柏拉图也并非一味地排斥艺术，而是相信艺术的美可以滋润人的心灵，要求艺术接近包含真与\n善的理想形式，从而拒斥丑恶的东西，最终为其“理想国”服务。柏拉图是明确看到艺术对于人的心灵的\n强大感染力的。甚至他还认为音乐教育的重要性超过了其他的教育形式。他的具体理由是：“节奏与乐调\n有最强烈的力量浸入心灵的最深处”,而且，“受过这种良好的音乐教育的人可以很敏捷地看出一切艺术\n作品和自然界事物的丑陋，很正确地加以厌恶；但是一看到美的东西，他就会赞赏它们，很快乐地把它们\n吸收到心灵里，作为滋养，因此自己性格也变成高尚优美”。"}, {"id": 37, "chapter": "第二章艺术的功能", "knowledge_point": "知识点2.艺术的主要功能", "type": "(一)名词解释", "question": "1.审美认识功能", "answer": "含义：艺术的审美认识功能，主要是指人们通过艺术活动可以独特而又影响至深地认知人、社会、自\n然与历史等。\n体现：\n(1)艺术引领人们感受现实。从阿尔塔米拉的洞穴壁画，人们可以感知原始人的狩猎生活；从汉代马\n王堆帛画，可以了解中国封建社会早期的文化信仰；从敦煌壁画，可以读解到从十六国到宋、元各个历史\n时期中百科全书式的状况\n(2)艺术敞开了一个与现实相关联的想象世界。艺术的审美认识并不意味着只提供现实中既有的方面。\n艺术也有可能拉开一种更为广博的认知视野。艺术一方面引领人们感受现实的方方面面，另一方面也敞开\n了一个与现实相关联的想象世界，因而有可能比现实本身更为丰富多彩。,"}, {"id": 38, "chapter": "第二章艺术的功能", "knowledge_point": "知识点2.艺术的主要功能", "type": "(一)名词解释", "question": "2.审美教育功能", "answer": "含义：审美教育功能，主要是指接受者通过艺术作品的欣赏，领略其中展示的真善美，从而潜移默化\n地接近、认同甚至激赏这种真善美所汇成的价值与力量，进而得到人生观、世界观和人文精神的提升和跃\n迁。\n**特点：**\n(1)具有由衷的和自愿的性质。在审美过程中，人所展开的心理因素往往都具有由衷的和自愿的性质，\n其中没有太多强迫和外加的力量的干扰，否则，审美活动就会名不副实或者难以实现。\n(2)不知不觉中获得人生的启迪。从艺术中领受人生的启迪，常常会有超乎寻常的效果。"}, {"id": 39, "chapter": "第二章艺术的功能", "knowledge_point": "知识点2.艺术的主要功能", "type": "(一)名词解释", "question": "3.审美娱乐功能", "answer": "【参 考答 案】\n含义：艺术的审美娱乐功能是指通过艺术欣赏活动，使人获得感官的快乐和精神的享受。人们通过视\n觉、听觉、触觉、嗅觉、味觉等感官体验获得的生理快感及相关的情感判断属于娱乐的基础层——感官娱\n乐层，这是符合人本能的，无社会内容的；人们通过理性认知获得的心理享受属于娱乐的高级层——心灵\n娱乐层，这是符合人灵魂的，有社会内容的。\n代表观点：\n先秦的音乐美学名著《乐记》就明确提出：“夫乐者，乐也，人情之所不能免也。”\n亚里士多德说：“娱乐……可以消除劳苦工作所产生的困倦……人们聚会娱乐时，总是要弄音乐，这\n是很有道理的，它的确使人心畅神怡。”\n贺拉斯说“寓教于乐”,意思是说要把教育放在娱乐中进行，教育功能虽然重要，但是也要在娱乐的\n形式中完成，这也恰恰说明了娱乐功能的重要性。\n及至19世纪，英国诗人王尔德等唯美主义者开始“为艺术而艺术”“为美而美”,强调在审美的享乐\n中体味并领悟纯粹的“美”与“艺术”,明确将“享乐”看作审美目标。"}, {"id": 40, "chapter": "第二章艺术的功能", "knowledge_point": "知识点2.艺术的主要功能", "type": "(一)名词解释", "question": "4.审美体验功能", "answer": "含义：艺术的诸种功能的实现始终是离不开审美的体验过程的。如刘勰在《文心雕龙 ·知音篇》中所\n说，“缀文者情动而辞发”,那么,“观文者披文以入情”。可见，无论是创作抑或欣赏都是与“情”维\n系在一起的，情感及其体验在艺术活动中有着举足轻重的作用。\n**意义：在展开审美认知时，常常会有相应的表象的再认与联想，但是，离开了审美的体验，这种表象**\n活动的活跃和丰富的程度就会大打折扣；审美教育如果要做到潜移默化，真正达到改变和提升人的内心世\n界的目标，那么,情含其中的感染与感化(以情动人)是题中之义。否则，艺术不可能深入到人的内心深\n处，从而完成审美教育的功能；审美娱乐功能的展开与实现，同样要呈现为一种放松的心境，而心境就是\n情感的一种形式。更为重要的是，通过体验而形成的愉悦影响是一种更为深刻而又持久的效应。\n### (二)论述题"}, {"id": 41, "chapter": "第二章艺术的功能", "knowledge_point": "知识点2.艺术的主要功能", "type": "(一)名词解释", "question": "1.论述艺术的主要功能。", "answer": "艺术作为人类审美意识的最高表现形式，其多元的功能体现乃是建立在艺术的审美特性基础上的。艺\n术的主要功能包括了审美认识功能、审美教育功能、审美娱乐功能和审美体验功能。\n(1)审美认识功能\n艺术的审美认识功能，主要是指人们通过艺术活动可以独特而又影响至深地认知人、社会、自然与历\n史等。\n首先，艺术能引领人们感受现实。从阿尔塔米拉的洞穴壁画，人们可以感知原始人的狩猎生活：从汉\n代马王堆帛画，可以了解中国封建社会早期的文化信仰；从敦煌壁画，可以读解到从十六国到宋、元各个\n历史时期中百科全书式的状况：社会生活与风土人情，尤其是信仰与文化交流方面的诸多信息。北宋张择\n端的《清明上河图》则生动地展现了12世纪中国都市生活的风貌。\n其次，艺术敞开了一个与现实相关联的想象世界。当然，艺术的审美认识并不意味着只提供现实中既\n有的方面。艺术也有可能拉开一种更为广博的认知视野。就如莎士比亚在其《仲夏夜之梦》中所描述的那\n样，艺术家的眼睛“在神奇的狂放的一转中，便能从天上看到地下，从地下看到天上。想象会把不知名的\n事物用一种形式呈现出来，诗人的笔再使它们具有如实的形象，空虚的无物也会有了居所和名字”。正是\n艺术赋予了一种来自自然而又高于自然的世界。对于艺术敞开一个更为广泛的认知世界的意义，杜威承认\n道：“我们仿佛是被领进了一个现实世界以外的世界，这个世界不过是我们以日常经验生活于其中的现实\n世界的更深的现实。我们被带到自我以外去发现自我。”确实，艺术一方面引领人们感受现实的方方面面，\n另一方面也敞开了一个与现实相关联的想象世界，因而有可能比现实本身更为丰富多彩。\n(2)审美教育功能\n审美教育功能，主要是指接受者通过艺术作品的欣赏，领略其中展示的真善美，从而潜移默化地接近、\n认同甚至激赏这种真善美所汇成的价值与力量，进而得到人生观、世界观和人文精神的提升和跃迁。\n首先，审美教育具有由衷的和自愿的性质。在审美过程中，人所展开的心理因素往往都具有由衷的和\n自愿的性质，其中没有太多强迫和外加的力量的干扰，否则，审美活动就会名不副实或者难以实现。也正\n因为如此，在这一过程中接触尤其是认同的对象就会自然而然地成为进入接受者内心的一部分。所以，《荀\n子 ·乐论》中曰：“夫声乐之入人也深，其化人也速。”有时候， 一首曲子、一部戏剧、一幅画或一部电\n影让人终生不忘，其道理在于斯。\n其次，教育功能让人在不知不觉中获得人生的启迪。从艺术中领受人生的启迪，常常会有超乎寻常的\n效果。英雄的经历、光荣的梦想、炽热的爱情、伟大的友谊、大自然的博大深邃，或者是生死的考验、艰\n辛的生存、失败的道路、沉沦的人格、被出卖的爱情、被背叛的友情乃至于平凡之极中的生活的一切闪光\n点——但凡我们生活中所缺乏、无以充分经受的人、事与物，通过艺术的欣赏，都有可能使我们的内心产\n生震动，激起深思，感怀不已。唐诗宋词、宋元山水画、元明戏剧和曹雪芹的长篇小说《红楼梦》等，以\n及荷马史诗、罗丹的巨雕《地狱之门》、海明威的小说《老人与海》和李安执导的影片《少年派的奇幻漂\n流》等，都会使人遐想不已，感悟良多，因而，可以获致难得的启示。\n(3) 审美娱乐功能\n古希腊人就认为，巨大的乐趣就来自对美的艺术品的观照。譬如，亚里士多德在谈及学习音乐的作用\n时就说过：“音乐应该学习，并不只是为着某一个目的，而是同时为着几个目的，那就是(1)教育；(2)\n净化：(3)精神享受，也就是紧张劳动后的安静和休息……某些人特别容易受某种情绪的影响，受到净化，\n因而心里感到一种轻松舒畅的快感。”亚里士多德注重让人在娱乐的情境下得到艺术的享受，是根源于他\n的一种基本思想，即“人的本性谋求的不仅是能够胜任劳作，而且是能够安然享有闲暇…… ·闲暇是全部人\n生的唯一本原”。\n同时，他将这种愉悦上升到人生的幸福高度予以肯定：消遣是为着休息，休息当然是愉快的，因为它\n可以消除劳苦工作所产生的困倦。精神方面的享受是大家公认为不仅含有美的因素，而且含有愉快的因素，\n幸福正在于这两个因素的结合，人们都承认音乐是一种最愉快的东西，无论是否伴着歌词。\n亚里士多德在《诗学》中曾经就悲剧的功能提出“卡塔西斯”(catharsis) 说，对此词的理解，向来\n研究者看法不同，比较贴切的有罗念生的“陶冶”说和朱光潜的“宜泄”说。“陶冶”说认为，悲剧通过\n怜悯和恐惧养成人的自身控制怜悯和恐惧之情的忍耐力。“宣泄”的要义在于通过音乐或其他艺术，使某\n种过分强烈的情绪因宜泄而达到平静，因此，有利于恢复和保持心理的健康。悲剧“卡塔西斯”之“宣泄”,\n从过程看，通过宜泄强烈的情感而获得随之而来的痛快感，因此悲剧是一种真正的痛快。悲剧“卡塔西斯”\n之“陶冶”,即从结果看，经过多次情感操练，最终控制怜悯与恐惧之情的忍耐力。由此可见，悲剧的功\n能是宣泄与陶冶的统一，是过程与结果的统一。\n(4)审美体验功能\n艺术的诸种功能的实现始终是离不开审美的体验过程的。如刘勰在《文心雕龙 ·知音篇》中所说，“缀\n文者情动而辞发”,那么,“观文者披文以入情”。可见，无论是创作抑或欣赏都是与“情”维系在一起\n的，情感及其体验在艺术活动中有着举足轻重的作用。\n克罗齐曾说：“要了解但丁，就要把自己提高到但丁的水平。”克罗齐所描述的当然是艺术接受中的\n一种理想的状况，即接受者完全体会到了创造者的初衷，但是，他却提示了一个非常重要的问题，也就是\n艺术接受者应当进入艺术家的语言的形式状态中，仿佛自己也经历了艺术家所体会到的那种从不确定的、\n压抑的情感再过渡到充分表达后的“轻松自如”的“解救”状态。在这里，接受者与艺术家在体验意义上\n合二为一。当然， 一般情况下，大多数艺术的接受者虽然也会有表达的诉求，但是未必有相对应的语言形\n式及其驾驭能力，因而，可能有所感，却又不可名状，无以传达，而一旦遇上艺术家的情感传达，那么,\n就会唤起接受者以往的不确定的体验，更加充实而又深刻地体会这份特殊情感的无限况味。\n在展开审美认知时，常常会有相应的表象的再认与联想，但是，离开了审美的体验，这种表象活动的\n活跃和丰富的程度就会大打折扣；审美教育如果要做到潜移默化，真正达到改变和提升人的内心世界的目\n标，那么,情含其中的感染与感化(以情动人)是题中之义。否则，艺术不可能深入到人的内心深处，从\n而完成审美教育的功能；审美娱乐功能的展开与实现，同样要呈现为一种放松的心境，而心境就是情感的\n一种形式。更为重要的是，通过体验而形成的愉悦影响是一种更为深刻而又持久的效应。"}, {"id": 42, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "1.形象思维", "answer": "含 义：所谓形象思维， 一般认为，形象思维是在对形象信息传递的客观形象体系进行感受、存储的基\n础上，结合主观的认识和情感进行识别(包括审美判断),并用一定的形式、手段或工具(包括文学语言、\n绘画线条色彩、音响节奏旋律及操作工具等)创造和描述形象(包括艺术形象和科学形象)的一种基本的\n思维形式。这也就是说，思维的各个环节——信息接受、信息存储、信息加工、信息输出等，全都离不开\n具体的形象。\n特征：具象性、情感性与主观性，是形象思维的显著特征。"}, {"id": 43, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "2.抽象思维", "answer": "含义：所谓抽象思维， 一般认为，抽象思维一般称为逻辑思维。它是人们在认识过程中借助于概念、\n判断、推理等思维形式反映客观现实的思维活动。\n**特点：人们将抽象思维的特点概括为概括性和间接性。抽象思维关乎理性、逻辑，与分析、判断、归**\n纳、整合等心理机制密不可分。许多人以为，艺术创作与抽象思维无关。这属于主观臆断，与艺术创作实\n际不符。艺术创作的许多环节，需要借助理性思维。例如，艺术家在遴选创作题材、提炼作品主题、搭建\n合理架构、组织矛盾冲突的时候，尤其是在后期修改、斟酌定稿之际，需要理性分析，需要逻辑推导，需\n要理智的抉择。"}, {"id": 44, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "3.灵感思维", "answer": "含义：所谓灵感思维， 一般认为，灵感思维是以人的直觉为接通媒介、并能获得有社会价值(包括获\n得新知识或创造性应用原有知识)的结论知识的思维活动。\n特征：灵感思维有四个主要特征：突发性、偶然性、独创性和模糊性。首先，灵感思维与顿悟、自省、\n梦境、潜意识等心理机制的关系较为密切。其次，灵感思维与艺术创作的关系非常密切，尤其是在才思干\n涸、思绪受阻、创作难以为继之时，不期而遇、突然涌现的灵感，可以让艺术家茅塞顿开、豁然开朗。"}, {"id": 45, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "4.创作个性", "answer": "含义：创作个性，是艺术家在创作实践中形成并在艺术作品中显现的相对稳定的性格特征。创作个性\n是艺术作品具有独创性的内在依据，也是不同的艺术风格得以形成的必要条件。\n条件：创作个性的形成，是以艺术家自我意识的觉醒以及个性的充分发展为前提的。石涛认为，画家\n借助笔墨，从心底流出的那“一画”是“自我立”的标志。有了“自我 立”,也即有了自我意识的觉醒，\n绘画艺术便“无法生有法”“有法贯众法”了。“亿万万笔墨”,也即众多作品、众多风格，莫不起源于\n人为的、非自然的、主体意识觉醒后的那“一画”。\n### (二)简答题"}, {"id": 46, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "1.简述艺术家的社会角色。", "answer": "艺术家是最专业、最典型、最具代表性的艺术创作主体。在艺术学理论的话语体系中，艺术创作的主\n体，常常特指艺术家。\n(1)艺术家是优秀作品的创造者\n艺术家是社会分工不断细化的产物，是生产力水平发展到一定程度逐步形成的特殊群体。凭借艺术才\n华，通过创造性劳动，创作、生产优秀的艺术作品，以满足人们日益增长的精神需求与审美需要，是艺术\n家的天职，也是社会对于艺术家这一社会角色的期待与定位。\n艺术的繁荣、创新需要艺术家；人民的精神需求、审美需要呼唤艺术家。德艺双馨的艺术家，应该成\n为时代风气的先觉者、先行者、先倡者，应该不断超越前人、超越自己、超越同时代的人，应该创造出更\n多有筋骨、有道德、有温度的艺术作品来奉献给人民，应该主动适应社会对于艺术家这一社会角色的期待\n与定位。\n(2)艺术家是人类灵魂的工程师\n艺术诉诸人类情感，直通人类心灵；艺术具有怡情养心、铸造灵魂的功能。如孔子就认为，“兴于《诗》,\n立于礼，成于乐”,是人类心智发育的一般规律。柏拉图也认为，艺术具有养心育德的功能，进而提出了\n“对于身体用体育，对于心灵用音乐”的主张。席勒撰写的《审美教育书简》,系统阐述了借助艺术开展\n审美教育的重要性。蔡元培大力倡导“以美育代宗教”,并且身体力行，其理论依据就在于，在塑造人类\n灵魂的问题上，艺术具有不可替代性。优秀的艺术作品能够启迪思想、温润心灵、陶冶人生，能够扫除颓\n废萎靡之风。因此，长期以来，人们一直把艺术家称为“人类灵魂的工程师”。\n(3)艺术家是先进文化的传承者、开创者\n每一次成功的、精彩的艺术创作，既是对艺术经典的继承，也是对前人作品的超越；既是对先进文化\n的传承，也是一个不断求新、求变、求突破、求发展的过程。作为艺术创作主体的艺术家，应该有担当，\n不仅要做精神家园的守望者，还要做时代精神的传播者。有责任心、使命感的中国艺术家，应当自觉承担\n弘扬中华优秀传统文化、投身社会主义精神文明建设的历史使命。"}, {"id": 47, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "2.简述艺术家的人文修养。", "answer": "修养者，即经修习、修炼而获得的学养、素养。作为精神产品创造者的艺术家，必须具有较高的人文\n修养。诗人陆游晚年曾言：“汝果欲学诗，工夫在诗外。”揭示了艺术创作的一个普遍规律：厚积方能薄\n发，厚德方能习艺，艺术家应在提高自身的人文修养上多下工夫、下足工夫。艺术家的人文修养，内涵虽\n然复杂，但人文知识、人文精神和人文情怀一定是其核心。\n(1)人文知识是人文修养的基础\n古今中外的文学知识、历史知识、哲学知识，以及现代政治学、伦理学、社会学、宗教学、语言学、\n心理学、法学、美学知识等，是人文知识的主要构成。尽可能多地接触、了解、学习、掌握人文知识，是\n艺术家修炼自身、提高人文修养的基础性工程。\n(2)人文精神是人文修养的核心\n狭义的人文精神，指文艺复兴时期出现的一种思潮，其核心主张是：第一，关心人，关注人，重视人\n的价值，反对神学对于人性的压迫。第二，爱理性，爱智慧，高扬理性的大旗，反对神学对于理性的贬抑。\n第三，立足尘世生活，倡导身心和谐，反对神学灵肉对立、用天国生活否定现世生活的说教。\n广义的人文精神，指人类各民族普遍坚持的以人为本的文化传统。其主要内涵是：高度关注人的尊严、\n人的价值、人的命运、人的追求、人的创造；高度珍视人类历史上精神的、自然的、物质的、非物质的文\n化遗产；高度重视人与自然的和谐、人与他人的和谐、人与内心的和谐；反对专制、独裁、迷信、谬误、\n强权、压迫，维护与捍卫每一个人所拥有的生存权、发展权以及追求幸福的权利。\n人文精神是人类文明、先进文化的精髓所在。虽然，随着时代的进步、社会的发展，人文精神的具体\n内涵呈现出与时俱进的态势，但是，以人为本的内核不会变。有责任、有抱负的艺术家，只有把握了人文\n精神，才能坚守、营造和传播正能量，才能创造出无愧于时代与民族的精品力作。莎士比亚的《哈姆雷特》、\n毕加索的《格尔尼卡》、贝多芬的《命运交响曲》(《C小调第五交响曲》)等经典作品得以出现并世代\n流传的奥秘之一，都在于艺术家精准地把握了生生不息的人文精神。\n(3)人文情怀是人文修养在创作中的具体显现\n艺术创作离不开情感、情怀。以什么样的情感、情怀去从事艺术创作，直接关系到艺术作品的品位、\n品质、品格。在中华民族的优秀传统文化中，有许多概念与范畴，如仁爱、重生、爱人、惜时、慈悲、怜\n悯、尚理、崇慧、贵和、忍让、宽容、诚信等，指称的都是人文情怀的重要构成。\n人文情怀是人文知识内化为素质后形成的一种特殊情感与胸怀，人文情怀也是对于人文精神的固守与\n坚持。“安得广厦千万间，大庇天下寒士俱欢颜。”杜甫的千古名句，出自他的人文情怀。“先天下之忧\n而忧，后天下之乐而乐。”范仲淹的《岳阳楼记》,同样植根于人文情怀。如果没有博大的人文情怀，巴\n金无法写出《家》《春》《秋》,老舍也无法写出《茶馆》《龙须沟》等一批有温度、有深度的艺术精品。\n### (三)论述题"}, {"id": 48, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "1.论述艺术创作过程中的三种思维。", "answer": "艺术创作的心理机制，既复杂又特殊。其复杂性与特殊性，集中体现在三种思维方式、多种心理机制\n交替使用、互为补充、综合运用上。依据思维的特征，学界通常将人类的思维分为三种方式：形象思维、\n抽象思维和灵感思维。每一种思维方式，与分析、归纳、整合、感知、联想、想象、顿悟、直觉、默会等\n心理机制又有必然的联系。\n(1 ) 形 象思 维\n所谓形象思维， 一般认为，形象思维是在对形象信息传递的客观形象体系进行感受、存储的基础上，\n结合主观的认识和情感进行识别(包括审美判断),并用一定的形式、手段或工具(包括文学语言、绘画\n线条色彩、音响节奏旋律及操作工具等)创造和描述形象(包括艺术形象和科学形象)的一种基本的思维\n形式。这也就是说，思维的各个环节——信息接受、信息存储、信息加工、信息输出等，全都离不开具体\n的形象。\n具象性、情感性与主观性，是形象思维的显著特征。艺术创作中运用的思维方式，主要是形象思维。\n形象思维，贯穿于艺术创作的全过程，也即感知、构思和物化三个阶段。与形象思维关系最为密切的心理\n机制是想象。黑格尔说过：“如果谈到本领，最杰出的艺术本领就是想象。”艺术家的想象力，是一种超\n越常规、建立联系的能力；也是一种补遗弥缺、移花接木的能力；还是一种恣意生发、无中生有的能力。\n此外，感知、移情、投射、格式塔等心理机制，与形象思维也有联系。\n(2 ) 抽 象思 维\n所谓抽象思维， 一般认为，抽象思维一般称为逻辑思维。它是人们在认识过程中借助于概念、判断、\n推理等思维形式反映客观现实的思维活动。\n人们将抽象思维的特点概括为概括性和间接性。抽象思维关乎理性、逻辑，与分析、判断、归纳、整\n合等心理机制密不可分。许多人以为，艺术创作与抽象思维无关。这属于主观臆断，与艺术创作实际不符。\n艺术创作的许多环节，需要借助理性思维。例如，艺术家在遴选创作题材、提炼作品主题、搭建合理架构、\n组织矛盾冲突的时候，尤其是在后期修改、斟酌定稿之际，需要理性分析，需要逻辑推导，需要理智的抉\n择。\n(3)灵感思维\n所谓灵感思维， 一般认为，灵感思维是以人的直觉为接通媒介、并能获得有社会价值(包括获得新知\n识或创造性应用原有知识)的结论知识的思维活动。灵感思维有四个主要特征：突发性、偶然性、独创性\n和模糊性。\n灵感思维与顿悟、自省、梦境、潜意识等心理机制的关系较为密切。许多人相信，古希腊的阿基米德\n在泡澡时灵感突现，发现了“浮力原理”。牛顿看到苹果落地后茅塞顿开，发现了“万有引力定律”。瓦\n特从水蒸气顶起壶盖的现象中获得了灵感，发明了蒸汽机。魏根纳在查阅世界地图时偶然发现大西洋两岸\n的轮廓极为相似，从而提出了“大陆漂移说”。钱学森认为：“创造思维中的’灵感’,是一种不同于形象\n思维和抽象思维的思维形式”,“凡是有创造经验的同志都知道光靠形象思维和抽象思维不能创造，不能\n突破；要创造要突破得有灵感”。\n灵感思维与艺术创作的关系非常密切，尤其是在才思干涸、思绪受阻、创作难以为继之时，不期而遇、\n突然涌现的灵感，可以让艺术家茅塞顿开、豁然开朗。“踏破铁鞋无觅处，得来全不费工夫。”“众里寻\n他千百度，蓦然回首，那人却在，灯火阑珊处。”对于灵感的确凿存在以及获得灵感的意外惊喜，古代文\n人早有描述。透过这些描述可以发现，不费工夫的“得来”,其前提是“踏破铁鞋”;“蓦然回首”的发\n现，其前提是“众里寻他千百度”。看来，对于艺术家来说，只有呕心沥血、锲而不舍、孜孜不倦的追寻\n探索、苦思冥想，才能激活灵感思维，才能获得默会与顿悟。"}, {"id": 49, "chapter": "第三章艺术创作", "knowledge_point": "知识点1.艺术创作主体", "type": "(一)名词解释", "question": "2.论述艺术创作个性。", "answer": "创作个性，是艺术家在创作实践中形成并在艺术作品中显现的相对稳定的性格特征。创作个性是艺术\n作品具有独创性的内在依据，也是不同的艺术风格得以形成的必要条件。\n(1)创作个性的形成\n创作个性的形成，是以艺术家自我意识的觉醒以及个性的充分发展为前提的。关于这一点，清代画家\n石涛在《苦瓜和尚画语录》中论述得非常精彩：法于何立?立于一画。一画者，众有之本，万相之根。见\n用于神，藏用于人，而世人不知所以一画之法，乃自我立。立一画之法者，盖以无法生有法，以有法贯众\n法也。夫画者，从于心者也。 ……此一画收尽鸿蒙之外，即亿万万笔墨未有不始于此而终于此，惟听人之\n握取之耳。人能以一画具体而微，意明笔透。 ……盖自太朴散而一画之法立矣， 一画之法立而万物著矣。\n故曰：吾道一以贯之。”石涛认为，画家借助笔墨，从心底流出的那“一画”是“自我立”的标志。有了\n“自我立”,也即有了自我意识的觉醒，绘画艺术便“无法生有法”“有法贯众法”了。“亿万万笔墨”,\n也即众多作品、众多风格，莫不起源于人为的、非自然的、主体意识觉醒后的那“一画”。由此看来，艺\n术家在创作的过程中，不能丧失自我，不能放弃个性，不能人云亦云。社会也应给艺术家提供自由、开阔、\n有助于形成创作个性的空间。\n(2)创作个性与作品\n艺术家的创作个性，必然会在作品中留下痕迹、印记，甚至会影响作品的风格、风貌。创作个性与作\n品的关系，古人早已有所关注。魏晋时期的曹丕在《典论 ·论文》中提出的“文以气为主”的观点，所揭\n示的就是艺术家的个性、气质会主导作品的风格、风貌。刘勰在《文心雕龙 ·体性篇》中揭示得更为清晰，\n论述得更加具体：“是以贾生俊发，故文洁而体清；长卿傲诞，故理侈而辞溢；子云沉寂，故志隐而味深；\n子政简易，故趣昭而事博；孟坚雅懿，故裁密而思靡；平子淹通，故虑周而藻密；仲宜躁锐，故颖出而才\n果；公幹气褊，故言壮而情骇；嗣宗俶傥，故响逸而调远；叔夜俊侠，故兴高而采烈；安仁轻敏，故锋发\n而韵流；士衡矜重，故情繁而辞隐。触类以推，表里必符，岂非自然之恒资，才气之大略哉!”所谓“表里\n必符”,是指作品的风格、风貌与艺术家的个性、气质一定是吻合的。因为刘勰相信，“各师成心”的结\n果，必然是“其异如面”。所谓“文如其人”“字如其人”“艺如其人”,说的也是这个道理。\n(3)创作个性与社会责任\n大多数艺术家，尤其是艺术大家，都有创作个性，但这并不意味艺术家不必承担应尽的社会责任。艺\n术家是要对自己个性化的作品负责，但同时也要承担“公共的职责”。艺术家张扬创作个性的目的，不是\n标新立异、哗众取宠，而是为了创作出更精彩、更优秀的艺术作品，以满足社会对于精神文化产品日益增\n长的需要。从这个意义上说，艺术家需要承担的“双重职责”具有同一性。\n艺术作品也可以具有一些商品性，但是，作为精神产品的艺术作品，绝非一般意义上的商品。作品的\n价格不能简单地等于价值，票房、收视率、“粉丝”的数量级也不是衡量作品质量的唯一标准。较之于经\n济效益，艺术作品的社会效益永远是第一位的。有担当的艺术家，应自觉承担“为天地立心，为生民立命，\n为往圣继绝学，为万世开太平”等应尽的社会责任。"}, {"id": 50, "chapter": "第三章艺术创作", "knowledge_point": "知识点2.艺术创作方式的特点", "type": "(一)简答题", "question": "1.简述艺术创作的特点。", "answer": "艺术创作是个形式多样、种类繁多、程序复杂的创造性工程。较之于艺术制作活动，艺术创作呈现出\n三个特点：\n(1)原创性\n所谓“原创”,指世间本无这件精神产品，甚至连这件艺术作品的构成要素(如人物、形象、题旨、\n故事等)也都是全新的。 一般说来，在综合性较强的艺术作品的创作团队中，编剧、作曲、设计的工作更\n具原创性，因为他们从事的工作，大多是无中生有、从无到有的。\n原创性的艺术创作，需要完成两次飞跃：从客观世界到主观世界，从主观世界到艺术世界。艺术作品\n的原创，两次飞跃都需亲历。\n原创性的艺术创作，需要实现两个转变：将生活物象转变为主体心象；将主体心象转变成艺术形象。\n艺术作品的原创，两个转变都需完成。\n(2)基础性\n相对于后期制作，前期的艺术创作更具基础性。许多艺术作品的原创，完成的均为基础性的创作任务。\n如圈定创作题材，恰如建筑初期的“划红线”;确定作品题旨，好似建筑上的“打地基”;设定故事走向，\n类似于为建筑物“定朝向”;建构作品框架，也像建宅工师“架梁栋”。在综合性艺术品的创作过程中，\n前期创作的成果， 一定是后期制作的依据与“蓝图”。\n(3)纯粹性\n原创性、基础性的创作，主体性更强，自由度更高，选择性更多，因此也更具有艺术上的纯粹性。所\n谓“纯粹性”,指不计时间成本、不图经济回报、不考虑功利得失。贾岛作诗喜苦吟，毕生偏爱炼字琢句，\n自谓“两句三年得， 一吟双泪流”。杜甫自谓“为人性僻耽佳句，语不惊人死不休”。卢延让在创作上也\n是如此，“吟安一个字，捻断数茎须”。曹雪芹写《红楼梦》,“披阅十载，增删五次”,十年辛苦不寻\n常。"}, {"id": 51, "chapter": "第三章艺术创作", "knowledge_point": "知识点2.艺术创作方式的特点", "type": "(一)简答题", "question": "2.简述个体创作的特点。", "answer": "个体创作与集体创作，是艺术创作中普遍存在的两种不同的方式。前一种创作方式，适合于传统的艺\n术门类以及中小型艺术作品的创作；而后一种创作方式，则更适合于现代艺术门类以及大型、超大型艺术\n作品的创作。个体创作具有以下特点：\n(1)更加个性化\n所谓“个性化”,是指艺术家的审美追求、艺术观念、个人气质等在个体创作中得到充分地发挥与彰\n显 。\n艺术创作的个性化，首先体现在“创作什么”上。艺术家的社会阅历、生活积淀、个人命运、兴趣爱\n好等，对于“创作什么”影响很大。老舍就曾经说过：“我就写不出斗争比较强烈的戏，因为天性不是爱\n打架的人，又没有参加革命斗争，所以写起逗笑、凑趣的东西就比较方便一些。我喜欢欢笑，写悲剧就不\n适合。”同理，汉高祖刘邦不会写“问君能有几多愁，恰似一江春水向东流”那样让人愁肠寸断的诗篇，\n南唐后主李煜也写不出“大风起兮云飞扬，威加海内兮归故乡，安得猛士兮守四方”的句子来。\n艺术创作的个性化，还体现在“如何创作”上。面对同一个表现对象，选择同一个创作母题，不同的\n艺术家，在创作的过程中因个性有别也会显现出明显的差异来。例如，俞平伯与朱自清面对的是秦淮河上\n同样的景色，俞平伯在散文《桨声灯影里的秦淮河》的创作中，巧用、活用古典文学中的词句、典故，以\n一种冷静、理智的创作手法，营造了一种朦胧、空灵的审美意境，流露出了学者个性。而朱自清在创作同\n名散文时，则以简练、朴素的笔法，借景抒情，表述了炽热、丰富的情感，显现了诗人情怀。\n( 2 ) 更 加 风 格 化\n艺术风格，是指艺术家的创作个性、艺术特色、审美理想等在艺术作品中的总体表现。艺术家与作品\n风格之间，存在一种相对稳定的联系。而在个体创作中，这种联系显现得更加充分。\n早在西汉时期，扬雄就提出一个观点：“言，心声也；书，心画也。声画形，君子小人见矣。”这就\n是说，有什么样的艺术家，就会有什么风格的作品。后人将这一观点凝练为“心声心画”说。文如其人、\n字如其人、艺如其人的说法，与“心声心画”说在本质上一脉相承。18世纪的法国作家布封提出过“风格\n即人”说，其内涵与扬雄的“心声心画”说也是大同小异。\n王羲之的《兰亭集序》自由洒脱，颜真卿的《多宝塔感应碑》工整厚重，米芾的《蜀素贴》率真自然，\n欧阳询的《九成宫醴泉铭》规范有度。李白的诗歌飘逸洒脱，杜甫的作品沉郁悲怆。这些风格化的艺术经\n典的出现，固然与艺术家的个性、才艺有关，与艺术创作方式的个人化，自然也有密切关系。\n(3)更具独创性\n个体创作的方式，需要面对的制约因素相对较少。在更加自由的条件下实施的个体创作，通常更具独\n创性。个体创作虽然拥有较高的自由度，但每一个创作个体在每一部作品上需要花费的时间、精力及必须\n克服的困难也是巨大的。王国维在《人间词话》中说：“古今之成大事业、大学问者，必经过三种之境界：\n‘昨夜西风凋碧树。独上楼，望尽天涯路。’此第一境也。‘衣带渐宽终不悔，为伊消得人憔悴。’此第\n二境也。‘众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。’此第三境也。”王国维描述的“三种\n之境界”,同样也是艺术家追求独创、最终获得独创性的三个阶段。因为这三个行动、行为的主体都是个\n体的人。\n董其昌笔下的山水，笔墨韵致清润灵秀，独步明代画坛。朱耷的花鸟，冷峻孤愤、傲视群芳，有开宗\n立派之誉。石涛笔下的传世画作，恣肆奔放、凝重饱满，独领一代画风。许多艺术大家取得成功的奥秘都\n与坚持独创性有关。"}, {"id": 52, "chapter": "第三章艺术创作", "knowledge_point": "知识点2.艺术创作方式的特点", "type": "(一)简答题", "question": "3.简述集体创作的特点。", "answer": "个体创作与集体创作，是艺术创作中普遍存在的两种不同的方式。前一种创作方式，适合于传统的艺\n术门类以及中小型艺术作品的创作；而后一种创作方式，则更适合于现代艺术门类以及大型、超大型艺术\n作品的创作。集体创作具有以下特点：\n(1)智力上的众筹性\n随着新的艺术门类或艺术样式的陆续出现，随着社会对于篇幅超长、投入巨大、综合性显著的艺术品\n的需求日益增长，组建创作团队，实施集体创作，已成为一种司空见惯的创作方式。强强联合是组建创作\n团队的基本原则。这里所说的强，特指创意、筹划、思维、判断能力的强健。因此，智力上的众筹性，是\n集体创作的第一个特点。\n(2)才艺上的互补性\n多元整合是组建创作团队的又一条原则。创作团队的成员，大多来自不同的艺术岗位。如电影创作的\n团队，就需要聚集编剧、导演、演员、摄影、录音、灯光、美术、化妆、服装、道具、焰火、剪辑、特技\n等十多个类别的专家、艺术家。因此，才艺上的互补性，是集体创作的又一个特点。将各类专家、艺术家\n整合在一起，既有分工又有合作，使其各显其能、相互帮衬，进而实现优势互补，确实可以提高艺术创作\n的效率与水平。\n(3)追求上的磨合性\n在任何一个创作团队中，都会出现从审美理想到艺术细节的摩擦与碰撞。经过协调、磨合达成共识，\n继而协力同心、共同打造，是经常发生的事。因此，体现在艺术追求上的磨合性，也是集体创作的一个特\n点。在一个创作团队中，众多艺术家不同的想法、不同的意志，都会对作品的结构、叙事等产生影响。这\n样一来，就有了许多互相交错的力量和多个力的平行四边形。磨合会使各种力量发生或妥协、或让步、或\n坚持、或调整的变化，进而产生出合力来。艺术作品的最终走向， 一定是在磨合之后形成的合力的作用下\n产生的结果。每位艺术家的意志，都对合力有责献：每位合作者的追求，都融会在合力里。"}, {"id": 53, "chapter": "第三章艺术创作", "knowledge_point": "知识点2.艺术创作方式的特点", "type": "(一)简答题", "question": "4.简述二度创作的特点。", "answer": "二度创作，是一种虽然常见但也具有特殊性的艺术创造活动，其特点主要体现在以下三个方面：\n(1)呈现性\n一度创作的作品，专业性往往很强。例如，编剧撰写的剧本，作曲家创作的曲谱，未受过专业训练的\n普通人一般看不懂，或者不能完全看懂。那些定格在纸张上的戏剧与音乐，那些凝固在文本中的人物与故\n事、旋律与和声，必须经过演员或演奏员依据剧本或曲谱的呈现，才能传达给面广量大的观众与听众。因\n此，呈现性是二度创作的基本特点。\n(2)再创性\n演员或演奏员的呈现，虽然是依据剧本、曲谱进行的。但人们之所以把这一行为称为“二度创作”,\n是因为其中蕴含着丰富的创造性，或者说，个中预留了开阔的创造空间。 一部剧本，经过演员尤其是表演\n艺术家的舞台呈现，剧中的台词更加上口了，剧中的人物更有个性了，剧中的细节更为精彩了，剧中的意\n蕴格外丰富了，这都是常见的现象。音乐表演、舞蹈表演等，莫不如是。许多音乐大家的表演，不仅呈现\n了一度创作的“原义”,甚至会在原有的基础上，实现具有超越性的再创造。因此，依据原创的再创性，\n是二度创作的又一个特点。\n( 3 ) 多 样 性\n依据同一个剧本、同一首曲谱，不同的演员、演奏员、歌唱家的处理往往是不一样的，甚至会出现很\n大的差别。高水平的艺术表演， 一定会体现艺术家对于文本的独特理解， 一定会融入艺术家自身鲜明的艺\n术个性。因此，二度创作的又一个特点就是多样性。“一千个演员有一千个哈姆雷特”“一千个演奏家有\n一千首《二泉映月》”,艺术界流传的这些说法，道出了二度创作多样性的特点。也正因为有了这样的特\n点，二度创作成了一项常创常新、魅力无穷的艺术创造活动。"}, {"id": 54, "chapter": "第三章艺术创作", "knowledge_point": "知识点3.艺术创作过程", "type": "(一)名词解释", "question": "1.动 因", "answer": "含义：动因，即动机与原因。艺术创作的动因，指艺术家的创作内驱力。没有动因便没有创作。动因\n匮乏或不足，也出不了好作品。\n条件：创作动因来源于社会生活。艺术家对于社会生活的体验与积累，是创作动因形成的基础。创作\n动因的萌发，是指创作激情忽然涌动、创作欲望突然升腾的一种心理状态，其内在机制，大致可以归纳为\n以下三种情况：\n(1)一个发现， 一个捕获 ，常常会触发 创作激情、创作欲望 ；\n(2)一次感动，一次顿悟，往往会引发创作激情、创作欲望。艺术创作固然需要积累，但同样也需要\n用智慧之光去照亮这些积累；\n(3)一种需求、 一种外力，也会激发创作激情、创作欲望。"}, {"id": 55, "chapter": "第三章艺术创作", "knowledge_point": "知识点3.艺术创作过程", "type": "(一)名词解释", "question": "2.艺术构思", "answer": "含义：艺术构思，指艺术家在创作动因的驱使下，依据自我秉承的创作观念，运用不同艺术类别各自\n拥有的创作方法、技法，营造审美意象，酝酿、谋划新作品的思维过程。\n任务：构思谋划，作为艺术创作的重要阶段，自古受到艺术家的重视。在构思谋划阶段，艺术家要解\n决的主要问题是“创作什么”和“创作成什么”,具体说来，需要完成三项任务：即圈定题材、确定话题、\n完成定位。"}, {"id": 56, "chapter": "第三章艺术创作", "knowledge_point": "知识点3.艺术创作过程", "type": "(一)名词解释", "question": "3.物 化", "answer": "含义：所谓“物化”,指艺术家借助选定的物质材料、艺术媒介，运用艺术技巧、创作手法，将构思\n谋划阶段形成的审美意象、艺术构想物态化，使之成为可供欣赏的艺术品。物化属于艺术传达活动，是把\n“胸中之竹”转化为“手中之竹”的阶段，也是在“袖手于前”的基础上“拈毫疾书”的阶段，对于艺术\n的创造者来说，这个阶段既要动脑又要动手，非常关键，至关重要。\n任务：在物化传达阶段，艺术家的关注点主要集中在以下几个方面： 一是深入认知艺术媒介，二是熟\n练驾驭语言系统，三是灵活运用表达规范。\n### (二)论述题"}, {"id": 57, "chapter": "第三章艺术创作", "knowledge_point": "知识点3.艺术创作过程", "type": "(一)名词解释", "question": "1.论述郑板桥的“眼中之竹”“胸中之竹”和“手中之竹”。/论述艺术创作过程。", "answer": "清代书画家郑燮就曾作过这样的描述：“江馆清秋，晨起看竹，烟光、日影、雾气，皆浮动于疏枝密\n叶之间。胸中勃勃，遂有画意。其实，胸中之竹，并不是眼中之竹也。因而磨墨展纸，落笔倏作变相，手\n中之竹，又不是胸中之竹也。总之，意在笔先者，定则也。趣在法外者，化机也。独画云乎哉!”据此，后\n人将艺术创作的过程描述为三个阶段：首先是动因萌发、艺术体验的“眼中之竹”阶段，其次是将“眼中\n之竹”化为“胸中之竹”,最后把“胸中之竹”变成“手中之竹”。 一般说来，艺术创作的过程都要经历\n动因萌发、构思谋划、物化传达这样三个主要的阶段。\n(1)动因萌发\n动因，即动机与原因。艺术创作的动因，指艺术家的创作内驱力。没有动因便没有创作。动因匮乏或\n不足，也出不了好作品。创作动因来源于社会生活。艺术家对于社会生活的体验与积累，是创作动因形成\n的基础。对于多姿多彩的大千世界，对于不同阶层的社会生活，艺术家如果没有充分的体验与丰厚的积累，\n不可能形成创作动因。坎坷的生活道路，艰难的生活经历，之所以被许多艺术家视为宝贵财富，就是因为\n可以从中获得切身的体验与珍贵的积累，进而形成强大、持久的内驱力。\n创作动因的萌发，是指创作激情忽然涌动、创作欲望突然升腾的一种心理状态。创作动因的萌发，常\n常因人、因时、因地而异，其内在机制，大致可以归纳为以下三种情况：\n首先，一个发现，一个捕获，常常会触发创作激情、创作欲望。艺术家对于创作素材的积累，常被喻\n为给船舶添加燃料。一个偶然的发现、精彩的捕获，则是启动船舶远航的火花。日积月累的燃料，虽然有\n了足够的量，但如果没有火花的激发，航船是不能驶向彼岸的。\n其次，一次感动，一次顿悟，往往会引发创作激情、创作欲望。艺术创作固然需要积累，但同样也需\n要用智慧之光去照亮这些积累。一次感动，一次顿悟，会使创作者对素材的价值、意义等产生新的认知\n从而引发创作激情、创作欲望。由光未然作词、冼星海作曲的《黄河大合唱》是在艰苦的条件下、很短的\n时间里创作而成的。两位主创之所以能够一气呵成、一挥而就地完成这部杰作，既与长期积累有关，也离\n不开突然获得的感动与顿悟。据相关资料记载，1938年10月30日，光未然率抗敌演剧队从陕西宜川东渡\n黄河来到了壶口瀑布旁。黄河之水从天而降、奔流不息、咆哮而去的壮丽景观深深地感动了青年诗人光未\n然，并使他获得了一个顿悟：吟诵母亲河黄河，不就是讴歌抗战、讴歌中华民族吗?于是他很快写出了长\n诗《黄河吟》。\n最后，一种需求、一种外力，也会激发创作激情、创作欲望。创作激情与创作欲望的萌发，有时还是\n需求和外力激活的。这种需求与外力，有时来自社会，有时来自家庭。当一个社会、一个时代特别需要某\n种形态、某种样式、某种价值取向的艺术作品时，就会形成一种呼唤，甚至是全民族的期盼。而聆听到、\n接受到这种呼唤的艺术家，常常会心潮澎湃，萌发创作的激情与欲望。\n(2) 构思谋划\n艺术构思，指艺术家在创作动因的驱使下，依据自我秉承的创作观念，运用不同艺术类别各自拥有的\n创作方法、技法，营造审美意象，酝酿、谋划新作品的思维过程。构思谋划，作为艺术创作的重要阶段，\n自古受到艺术家的重视。在构思谋划阶段，艺术家要解决的主要问题是“创作什么”和“创作成什么”,\n具体说来，需要完成三项任务：\n首先，圈定题材。题材是依据一定的标准对社会生活的领域加以分类。创作题材一旦圈定，标志着艺\n术家对纷繁杂乱的社会生活已经实现聚焦。此举，为后续的艺术构思圈定了范围、奠定了基础。\n其次，确定话题。从某个角度出发，艺术创作的本质，就是换一种方式说话。因此，艺术家在构思阶\n段需要确定一部作品的话题。话题是艺术的胚胎，是艺术品(尤其是叙事类作品)的最初形态。\n最后，完成定位。随着新的艺术门类、艺术样式的陆续出现，随着形制巨大、篇幅超长、综合性显著、\n资金众筹的艺术作品的不断面世，自娱自乐、即兴发挥几近没有空间。因此，在构思谋划阶段，艺术家还\n需完成一系列的定位：如主要受众的定位，作品类型的定位，创作风格的定位，价值取向的定位，等等。\n在某些情况下，还需要考虑投资规模和资金来源的定位。\n(3)物化传达\n所谓“物化”,指艺术家借助选定的物质材料、艺术媒介，运用艺术技巧、创作手法，将构思谋划阶\n段形成的审美意象、艺术构想物态化，使之成为可供欣赏的艺术品。物化属于艺术传达活动，是把“胸中\n之竹”转化为“手中之竹”的阶段，也是在“袖手于前”的基础上“拈毫疾书”的阶段，对于艺术的创造\n者来说，这个阶段既要动脑又要动手，非常关键，至关重要。在物化传达阶段，艺术家的关注点主要集中\n在以下几个方面：\n首先，深入认知艺术媒介。艺术传达必须借助艺术媒介。艺术媒介是把艺术构思落到实处进而形成艺\n术作品的物质基础，为了实现顺畅的、出色的艺术表达，艺术家必须对自己所使用的媒介拥有深入的认知。\n例如，作曲家必须对所有乐器的音域、音色、性能甚至演奏技法了然于心；雕塑家必须对石头、木料、黏\n土等各种材料的特性、特征、习性等了如指掌；舞蹈家必须对作为艺术媒介的人的身体的各个部分以及运\n动极限拥有充分的认知。\n其次，熟练驾驭语言系统。不同门类的艺术家，使用的大多为不同类别的语言系统。如舞蹈家使用的\n是肢体语言系统，电影家使用的是音像语言系统，书法家使用的是笔墨语言系统，小说家使用的是文字语\n言系统。对于品种繁多的艺术语言系统，艺术作品的创造者，不仅要有全面的认知，而且要能熟练掌控、\n自如驾驭。\n最后，灵活运用表达规范。长期的艺术实践，使得艺术表达形成了许多规范。如叙事艺术讲究文字的\n起、承、转、合， 一气呵成；戏曲艺术讲究演员的唱、念、做、打，搭配有序；电影艺术讲究镜头的推、\n拉、摇、移，有机结合。对于不同门类、不同种属以及不同时期、不同民族的艺术表达规范，艺术的创造\n者应该熟悉、必须知晓。特别是对于自己所从事的那门艺术或那种艺术的表达规范、表达程式，必须首先\n掌 握 。"}, {"id": 58, "chapter": "第四章艺术作品", "knowledge_point": "知识点1.艺术作品的媒介", "type": "(一)名词解释", "question": "1.艺术媒介", "answer": "含义： 艺术媒介，是指在艺术活动的总体过程中，艺术家将内在艺术构思外化为艺术作品并对其进行\n展示、传播的具有独特性的承载物质、材料以及符号体系。\n分类：如果从艺术学的角度进行划分，艺术作品的媒介又可分为物质材料媒介与艺术语言媒介。\n**作用：**\n(1)艺术媒介在艺术作品的类型区分方面具有明确的物质表征作用；\n(2)艺术媒介在艺术作品的形式建构方面具有显著的物质依托作用；\n(3)艺术媒介在艺术作品的内容生成方面具有重要的物质载体作用。\n### (二)简答题"}, {"id": 59, "chapter": "第四章艺术作品", "knowledge_point": "知识点1.艺术作品的媒介", "type": "(一)名词解释", "question": "1.简述艺术媒介的作用。", "answer": "艺术媒介，是指在艺术活动的总体过程中，艺术家将内在艺术构思外化为艺术作品并对其进行展示、\n传播的具有独特性的承载物质、材料以及符号体系。艺术作品的媒介在艺术创作、传播与接受的总体过程\n中，处于相对基础却又必须存在的一个环节。可以说，艺术媒介在区分艺术作品的类型、建构艺术作品的\n形式与生成艺术作品的内容方面都起到了十分重要的作用。\n(1)艺术媒介与艺术作品的类型区分\n艺术媒介在艺术作品的类型区分方面具有明确的物质表征作用。如中、西方绘画所应用的物质材料媒\n介就不尽相同，比如，同是以动物毛制作的笔，中国绘画的笔多按动物毛的长短不一排列为“尖头”,而\n西方绘画的笔则将动物毛取齐排列为“平头”,并且，因为笔的形制不同，也使得中国绘画更注重线条的\n质量，而西方绘画则更偏重于在块状面积中表现出变化，形成了中、西方绘画从物质材料到审美追求上的\n差异。\n18世纪德国文艺理论家莱辛(1729-1781)曾在其著作《拉奥孔》中探讨过“诗与画的界限”,并通过\n对反映古希腊神话故事拉奥孔的两部作品——群雕《拉奥孔》与史诗《伊利亚特》的比较，提出了造型艺\n术和叙事艺术的区别，认为绘画使用的是“空间中的形体和颜色”,而诗歌使用的是“时间中发出的声音”,\n并从而区分了绘画与诗歌之间的差异。莱辛认为：“既然符号无可争辩地应该和符号所代表的事物互相协\n调；那么,在空间中并列的符号就只宜于表现那些全体或部分本来也是在空间中并列的事物，而在时间中\n先后承续的符号也就只宜于表现那些全体或部分本来也是在时间中先后承续的事物。”可见，在莱辛看来，\n雕塑和诗歌虽在物质材料媒介上有明显差异，但区分二者的标准主要还在于艺术语言媒介不同，因此，作\n为空间中并列的符号，如绘画、雕塑等更适于表现发生在空间中的静态事物，而作为时间中承续的符号，\n如诗歌、文学等则更适于表现发生在时间中的动态事物。\n(2)艺术媒介与艺术作品的形式建构\n艺术媒介在艺术作品的形式建构方面具有显著的物质依托作用。正如德国哲学家卡西尔所说：“艺术\n确实是表现的，但是如果没有构型(formative) 它就不可能表现。而这种构型过程是在某种感性媒介物中\n进行的……对一个伟大的画家， 一个伟大的音乐家，或一个伟大的诗人来说，色彩、线条、韵律和语词不\n只是他技术手段的一个部分，它们是创造过程本身的必要要素。”可见，艺术的表现离不开艺术的构型，\n而艺术的构型又需要通过艺术媒介来实现。换言之，则艺术媒介在某种意义上决定着艺术作品的形式与建\n构方式。\n此外，艺术媒介还具有一定的时代特色，并由此影响了艺术形式，同一时代的艺术作品往往具有某些\n共同的形式特征，体现出这个时代占据主导地位的审美理想和审美追求。如北京的故宫与人民大会堂就具\n有各自鲜明的时代特色。如果从建筑的艺术风貌来看，故宫作为封建时代的建筑，处处体现出“天子至尊”\n“皇权至上”的封建宗法礼制特点；人民大会堂作为社会主义时代的建筑，既崇高、壮丽，又亲切、开朗，\n尤其是人民大会堂前的巨大石柱，犹如一根根擎天柱，能够给人一种雄伟坚实、挺拔有力的感受，展现出\n不同时代特色的物质材料与艺术语言媒介应用在艺术形式中产生出的不同的艺术效果。\n(3)艺术媒介与艺术作品的内容生成\n艺术媒介在艺术作品的内容生成方面具有重要的物质载体作用。从古至今，艺术媒介始终影响着艺术\n作品的内容生成，尤其是21世纪数字技术的迅猛发展，正在给电影、电视、动漫、游戏业等多个领域带来\n十分巨大而深刻的影响。\n以电影为例，电影从诞生到发展一直都不曾离开现代科学技术，艺术媒介的变化与革新，带来的是电\n影艺术作品内容范围的不断扩展。例如，正是因为光学、电学、声学、化学、机械学等各门科学技术的迅\n速发展，才使电影得以在1895年诞生。此后电影发展史上的三次重大变革，也均与科学技术有着密不可分\n的联系：第一次重大变革是电影从无声到有声，代表作品是1927年的美国影片《爵士歌王》;第二次重大\n变革是电影从黑白到彩色，代表作品是1935年的美国影片《浮华世界》;第三次重大变革是目前正方兴未\n艾的计算机多媒体技术与数码影像，这些技术正使得电影艺术大踏步地进入计算机与数码时代。美国影片\n《指环王》《阿凡达》等，就都是运用数字技术合成的代表作品。"}, {"id": 60, "chapter": "第四章艺术作品", "knowledge_point": "知识点2.艺术作品的形式", "type": "(一)名词解释", "question": "1.艺术语言", "answer": "含义：所谓艺术语言，是指在艺术作品中起到类似语言表情达意作用的一种艺术媒介。任何一门艺术\n都有自己独特的表现方式和手段，运用独特的物质媒介来进行艺术创作，从而使得这门艺术具有自己独具\n的美学特征和艺术特征，而这种独特的表现方式或表现手段，被称为“艺术语言”。\n分类：每个类型的艺术都有自己独特的艺术语言，如美术语言包括体积、面积、色彩、线条、笔触、\n构图等；音乐语言包括旋律、和声、节奏、复调、配器、曲式等；电影语言包括画面、声音、蒙太奇等。\n又如，舞蹈语言是规范化了的具有韵律和节奏的人体动作，文学语言则是由经过加工提炼之后的口头语言\n和文字语言组合而成。"}, {"id": 61, "chapter": "第四章艺术作品", "knowledge_point": "知识点2.艺术作品的形式", "type": "(一)名词解释", "question": "2.艺术作品的形式", "answer": "含义：艺术作品的形式，即是艺术作品内容的具体存在形式。艺术作品的形式千变万化，每一类型的\n艺术都有自己特殊的形式建构方式。而且，这些形式的法则又并非一成不变，艺术贵在创新，随着艺术实\n践的不断拓展，形式的法则也在不断变化和发展。\n分类：概括来说，艺术作品的形式可以看作是由艺术语言组合与结构两种形式所构成的，通常又称艺\n术语言的组合为“外部形式”,而称艺术作品的结构为“内部形式”。\n(1)艺术语言组合。单一或孤立形态的艺术语言，在未进入艺术作品之前，首先应被视为艺术媒介的\n一种类别，而在具体的艺术作品中，当艺术语言被整合起来，按照一定的方式进行组合或运动时，则成了\n艺术作品的外部形式。\n(2)结构。一部完整的艺术作品，在具有适当的艺术语言组合或艺术符号之外，还需要遵循一定的结\n构法则。艺术作品的结构，指的是作品中各个布局之间、各个因素之间的内在关联与组织样式。\n### (二)简答题"}, {"id": 62, "chapter": "第四章艺术作品", "knowledge_point": "知识点2.艺术作品的形式", "type": "(一)名词解释", "question": "1.简述艺术形式的特征。", "answer": "形式是艺术中的一个基本的因素。无论是中国传统文艺理论中的“形”“神”命题，还是西方文艺理\n论中的“形式”概念，都同样古老。然而，正如黑格尔所说：“内容非他，即形式回转到内容。形式非他，\n即内容回转到形式。”艺术作品的形式又始终与艺术作品的内容紧密相连。对于艺术作品形式的讨论应该\n在内容中完成，而对于内容的分析也不应脱离形式，形式与内容之间是互相包容、互相转化的关系。所以，\n概括来说，艺术作品的形式，即是艺术作品内容的具体存在形式，而艺术形式的特征，则也在形式与内容\n的对立统一中体现。\n(1)相对独立性\n从形式本体论出发，艺术作品的形式往往呈现
