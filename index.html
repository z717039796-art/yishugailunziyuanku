相对独立性的特征。早在古希腊时代，具有朴素唯物主\n义倾向的毕达哥拉斯学派就把形式看作自然存在物之“数理的形式”,认为事物某部分的安排与比例的和\n谐就是最高的形式。柏拉图也认为理念或理式就是形式本体，是感性客观世界的根源。近代以来，被誉为\n“西方形式美学奠基人”的康德，则更倾向于把形式看作一种先于客观物质世界而存在的“先验形式”,\n并认为这一先验形式甚至决定着审美判断之所以可能。1914年，英国艺术理论家克莱夫 ·贝尔在《艺术》\n一书中，进而提出“艺术乃是有意味的形式”的论点，成了世界各国美学界最为流行的口头禅。在贝尔看\n来：“艺术品中必定存在着某种特性：离开它，艺术品就不能作为艺术品而存在；有了它，任何作品至少\n不会一点价值也没有。这是一种什么性质呢?……可做解释的回答只有一个，那就是‘有意味的形式’。”\n贝尔强调，这种“形式”是指艺术品内在的各个部分和质素构成的关系，这种“意味”则是一种极为特殊、\n难以言传的审美感情。换言之，“有意味的形式”是指用色彩、线条、造型、图案等形式，能够传达和表\n现出一定的情绪、气氛、格调。在某种意义上，艺术作品的形式跨越了内容而具有独立的审美意味。艺术\n的形式确实具有相对的独立性，只不过应当摒弃它的神秘外壳，看到这种“有意味的形式”是人类社会实\n践的结晶，以及形式与内容实质上不可分割的共生关系。\n(2)必然共生性\n形式与内容相统一，艺术作品的形式又具有与内容共生性的特征。虽然艺术作品的形式与内容可以作\n为两种概念分开来思考，艺术的形式也被认为具有相对的独立性，甚至被称为“有意味的形式”,但事实\n上，在具体的艺术作品中，形式与内容皆是艺术作品不可分割的两个方面，内容是形式的内容，形式是内\n容的形式，形式与内容二者都以对方的存在而存在，是相互依附、并存共生的关系。\n一部优秀的艺术作品，必然是完美艺术形式和深刻思想内容的结合，二者的有机统一，才能使艺术作\n品具有令人惊叹的感人魅力。例如，19世纪末叶，法国文学会为纪念大文豪巴尔扎克，曾委托雕塑家罗丹\n为巴尔扎克创作雕像。为此，罗丹不但阅读了大量相关资料，亲自到巴尔扎克的故乡寻访，而且还专程找\n到当年为巴尔扎克制衣的老裁缝，从那里获得了巴尔扎克准确的身材尺寸作为参考。经过多方面的努力，\n罗丹逐渐找到创作的灵感，并最终选择巴尔扎克在深夜写作时穿着睡袍漫步构思的形象作为雕像的外形轮\n廓。罗丹的《巴尔扎克像》摒弃了几乎一切细枝末节，这位大文豪的手和脚都被掩盖在长袍之中，观众的\n注意力则全部集中到头部，尤其是那双炯炯有神、气宇不凡的双眼，更是突出了这位伟大的批判现实主义\n作家与众不同的气质。显然，正是因为罗丹的《巴尔扎克像》以如此朴实、简练的艺术手法，来突出这位\n伟大作家内在的精神气质，以形式最大限度的简化，来达到形式与内容的完美统一，所以才使得这座雕像\n取得了巨大的成功。"}, {"id": 63, "chapter": "第四章艺术作品", "knowledge_point": "知识点2.艺术作品的形式", "type": "(一)名词解释", "question": "2.简述艺术形式的多样化。", "answer": "艺术作品的形式千变万化，每一类型的艺术都有自己特殊的形式建构方式。而且，这些形式的法则又\n并非一成不变，艺术贵在创新，随着艺术实践的不断拓展，形式的法则也在不断变化和发展。概括来说，\n艺术作品的形式可以看作是由艺术语言组合与结构两种形式所构成的，通常又称艺术语言的组合为“外部\n形式”,而称艺术作品的结构为“内部形式”。\n(1)艺术语言组合\n单一或孤立形态的艺术语言，在未进入艺术作品之前，首先应被视为艺术媒介的一种类别，而在具体\n的艺术作品中，当艺术语言被整合起来，按照一定的方式进行组合或运动时，则成了艺术作品的外部形式。\n如南齐谢赫在《画品录》(又称《古画品录》)中曾提出“绘画六法”:“一气韵生动是也，二骨法用笔\n是也，三应物象形是也，四随类赋彩是也，五经营位置是也，六传移慕写是也。”其中，除“气韵生动”\n是对绘画作品的总体要求之外，其他几条都涉及绘画艺术语言的问题，绘画作品作为一个有机整体，这些\n艺术语言正是在相互的组合中体现着形式的美感。\n再以电影为例，曾获戛纳电影节金棕桐大奖的美国影片《现代启示录》,是由科波拉执导的一部反思\n越南战争的巨片，影片运用大量综合运动镜头、变焦距镜头等电影语言组合来展现美军飞机进攻的场面。\n尤其是有一些综合运动镜头，更使观众观看影片时如临其境，心灵受到极大的冲击和震颤。\n(2)结构\n一部完整的艺术作品，在具有适当的艺术语言组合或艺术符号之外，还需要遵循一定的结构法则。艺\n术作品的结构，指的是作品中各个布局之间、各个因素之间的内在关联与组织样式。在具体的作品中，这\n个“结构”与艺术语言组合的形式一起体现艺术作品的内容。结构的目的性与功能性，即在于把作品中的\n各个分散的部分组织成一个既和谐统一，又多样变化的有机体。可以说，结构在一部艺术作品中是处于统\n摄地位的重要形式，如果一部作品结构欠佳，就将一损俱损，即使具有完美无缺的艺术语言组合或艺术符\n号，也难于传达出艺术作品真正的思想与情感内涵。\n从艺术作品的角度来看，艺术语言组合与结构可以形成多种多样的形式，如美术既有线条、色彩、构\n图，亦有取舍、虚实、疏密、主次、斜正、撑持，艺术家在自己的创作中，不断寻找具有美感的艺术存在\n形式，并在与内容的相互生发中不断探索更恰当的艺术表现形式，从而使得艺术作品的形式日益丰富和发\n展。在具体的艺术作品中，艺术语言组合与结构两种形式紧密相关，通过不同的排列组合关系，使得艺术\n作品的形式呈现多样化的形态。"}, {"id": 64, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "1.题材", "answer": "含义：艺术作品的题材，广义上是指艺术作品中所描绘与展现的客观事物或主观情感， 一般也被称为\n“取材范围”;狭义来看，艺术的题材则是指作品中具体的生活与情感形态，即绘画、戏剧与影视艺术作\n品中所叙述与描绘的具体事件和景物等。以电影为例，广义的艺术作品题材大致可分为“历史题材”“战\n争题材”“神话题材”“爱情题材”“儿童题材”等，而狭义的题材则是指这些影片当中全部的故事情节\n和人物活动所组成的画面。在针对具体作品进行评述时，人们通常会在不同层面上对艺术作品题材的广义\n与狭义概念加以使用。\n**作用：虽然题材不是制约艺术作品价值的唯一因素，但题材的选取却是真正进入艺术创作过程的第一**\n步。可以说，艺术题材在某种意义上，决定了艺术作品的形成方向，是艺术作品能否取得成功的关键因素。\n鲁迅所言：“选材要严，开掘要深，不可将一点琐屑的没有意思的故事，便填成一篇，以创作丰富自乐。”\n即是对艺术作品题材重要意义的说明。"}, {"id": 65, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "2.主 题", "answer": "含义：艺术作品的主题，是透过题材所体现出来的思想内涵，是艺术家的主观情思与题材的客观价值\n相碰撞所生发出的具有某种社会、历史意义的思想概括。\n**作用：主题是建立在艺术家对题材不断深入认识、理解与分析的基础之上，是从题材中再度提炼与升**\n华出来的， 一部作品如果缺乏主题的统帅与灵魂作用，即便拥有丰富而精彩的题材，也有可能形成由材料\n凌乱堆砌的效果，因而导致其思想内容和艺术价值降低。\n**特点：在具体的艺术作品中，主题思想往往还具有不确定性和多义性的特点。**"}, {"id": 66, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "3.艺术形象", "answer": "含义：艺术形象指的是在艺术语言层基础上，由语言构成的整体的艺术形象。形象是从艺术构思中的\n意象经过加工、提炼、总结出来的物态化的结果。\n分类：从艺术作品的角度来看，艺术形象则可以分为视觉形象、听觉形象、文学形象与综合形象。它\n们既有共性，又有各自的特性。\n特征：艺术形象不仅具体可感，而且具有很强的概括性，它能够把广泛的生活内容概括并提炼成具体\n的形象；艺术形象又具有情感性和思想性，艺术形象往往融入了艺术家的爱憎悲欢，处处渗透着创作者对\n生活的思考和评价；艺术形象还具有审美意义，它凝聚着艺术家的审美理想和审美情趣，闪耀着艺术创造\n的光辉，能给受众带来审美的享受。\n**作用：艺术反映生活，艺术形象是艺术作品的核心内容。从这种意义上讲，没有艺术形象也就没有艺**\n术作品。"}, {"id": 67, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "4.典型", "answer": "含义：典型，又称“典型人物”“典型性格”或“典型形象”,狭义来说，是指艺术作品中所塑造出\n的成功人物形象，而广义来说，典型又被认为应包括典型人物、典型事件、典型环境等。但无论如何界定，\n可以说，典型的核心是在特定的情境中塑造出鲜明生动的人物形象，这一点是为大多数人所公认的。\n**特点：艺术典型既是特殊性与普遍性的有机统一，又是偶然性与必然性的有机统一。任何艺术作品中**\n的典型，都是在鲜明生动的个性中体现出广泛普遍的共性，并将独一无二的个别形象置于具有普遍性的某\n些情境之中。"}, {"id": 68, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "5.意境", "answer": "含义：意境，是中国古典美学传统中的一个重要范畴。中国古典诗词曲赋、书画、乐舞、建筑、戏曲\n等艺术类型都十分重视意境。简言之，意境就是艺术中一种情景交融的境界，是艺术中主客观因素的有机\n统一。意境中既有来自艺术家主观的“情”,又有来自客观现实升华的“境”,“情”和“境”是有机地\n融合在 一起的，境中有情，情中有境。\n发展历程：意境，是中华民族在长期艺术实践中所形成的一种审美上的理想情境。作为美学范畴的意\n境，孕育于先秦至魏晋南北朝时期，并于唐代正式诞生。\n**特点：除了情景交融以外，意境至少还具有以下三个方面的特点：**\n(1) 意境是一种若有若无的朦胧美；\n(2)意境是一种由有限到无限的超越美；\n(3) 意境是一种不设不施的自然美。"}, {"id": 69, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "6.意蕴", "answer": "含义：所谓艺术作品的意蕴，是指深藏在艺术品中的内在意味或含义，具有多义性、模糊性和朦胧性\n的特点，大多时候体现为一种诗情、神韵或哲理，往往只可意会，不可言传，需要接受者用全部心灵去探\n究和领悟。可以说，意蕴正是文艺作品具有不朽魅力的根本原因所在。\n**特点：**\n(1)蕴藏文化含义和人文精神。艺术的意蕴从一定意义上来讲，就是艺术作品中所蕴藏的文化含义和\n人文精神。\n(2)具有多义性和模糊性。艺术作品中的这种深层意蕴，由于具有多义性和模糊性，不但欣赏者意见\n纷纭、解读不一，有时甚至创作者自己也难于说明。\n(3)富含哲理或诗情。艺术的意蕴，并不能简单等同于艺术作品的题材或主题。比起艺术作品的题材\n与主题来，艺术意蕴是一种更加形而上的内容。它是一种哲理或诗情的感性表现，只可意会，难以言传。\n### (二)简答题"}, {"id": 70, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "1.简述素材与题材的区别。", "answer": "【 参 考 答 案 】\n艺术作品的题材，广义上是指艺术作品中所描绘与展现的客观事物或主观情感， 一般也被称为“取材\n范围”;狭义来看，艺术的题材则是指作品中具体的生活与情感形态，即绘画、戏剧与影视艺术作品中所\n叙述与描绘的具体事件和景物等。\n艺术作品的题材与一般生活中的素材又存在着一定的差别，素材可被视为题材的原料，丰富多彩的社\n会生活、姿态万千的自然景观，都能够成为艺术家的创作素材，但这些素材唯有与艺术家的主观思想和情\n感相互契合时，才能够进入艺术创作的视野，也才能成为艺术作品的题材。如北宋郭熙在《林泉高致》中\n反复强调将自然素材加工、提炼成作品题材内容的重要性。在郭熙看来，山水画创作不可能脱离对自然山\n水的体验。艺术题材的形成是一个长期积累的过程，正所谓“搜尽奇峰打草稿”,如果画家没有对自然山\n水素材长期的积累和不断思考，没有对自然山水的丰富细腻的感受，山水画中的题材是不可能被建立起来\n的。\n值得注意的是，从对素材的积累，到对素材的加工、提炼，再到最终对素材进行取舍形成艺术作品的\n题材，自始至终都体现着艺术家的审美情趣、艺术视野和艺术功力。虽然题材不是制约艺术作品价值的唯\n一因素，但题材的选取却是真正进入艺术创作过程的第一步。可以说，艺术题材在某种意义上，决定了艺\n术作品的形成方向，是艺术作品能否取得成功的关键因素。鲁迅所言：“选材要严，开掘要深，不可将一\n点琐屑的没有意思的故事，便填成一篇，以创作丰富自乐。”即是对艺术作品题材重要意义的说明。"}, {"id": 71, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "2. 简述题材与主题的区别。", "answer": "艺术作品的题材，广义上是指艺术作品中所描绘与展现的客观事物或主观情感， 一般也被称为“取材\n范围”;狭义来看，艺术的题材则是指作品中具体的生活与情感形态，即绘画、戏剧与影视艺术作品中所\n叙述与描绘的具体事件和景物等。\n艺术作品的主题，是透过题材所体现出来的思想内涵，是艺术家的主观情思与题材的客观价值相碰撞\n所生发出的具有某种社会、历史意义的思想概括。\n艺术作品的内容首先由题材与主题两种因素构成，二者既有联系，又存在着一定的差别。如在描写和\n表现自然现象或自然事物的作品中，题材往往是自然现象与自然事物本身，而主题则是这些自然现象与自\n然事物所传达出来的某种含义；艺术作品的题材来源于创作者对于日常生活素材与生活经验的加工、提炼，\n而主题则是对题材的进一步升华，源于生活，更高于生活：此外，在欣赏一部作品的过程中，题材一般是\n显而易见的，因为题材属于艺术作品形式的外部内容，而主题则常常比较含蓄隐蔽，需要反复回味、琢磨，\n才能真正把握一部作品的深层主题。\n主题是建立在艺术家对题材不断深入认识、理解与分析的基础之上，是从题材中再度提炼与升华出来\n的，一部作品如果缺乏主题的统帅与灵魂作用，即便拥有丰富而精彩的题材，也有可能形成由材料凌乱堆\n砌的效果，因而导致其思想内容和艺术价值降低。相反， 一部优秀的艺术作品，正是因为其具有鲜明而深\n刻的主题思想，并以这样的主题思想有效地影响题材的取舍，才有可能成为传世名作。如19世纪挪威戏剧\n家易卜生所创作的批判现实主义话剧《玩偶之家》,即以当时资本主义的社会现状为背景，反映了在男权\n社会法制的制约下，资产阶级家庭中男女的不平等关系以及女性自我意识的觉醒。这一主题既是从剧中的\n题材提炼出来的，也是易卜生对当时社会问题深入思考的结果，可以说，易卜生正是用这一鲜明的主题引\n导全剧，因而才获得了艺术上的巨大成功。"}, {"id": 72, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "3.简述艺术典型。", "answer": "典型，又称“典型人物”“典型性格”或“典型形象”,狭义来说，是指艺术作品中所塑造出的成功\n人物形象，而广义来说，典型又被认为应包括典型人物、典型事件、典型环境等。但无论如何界定，可以\n说，典型的核心是在特定的情境中塑造出鲜明生动的人物形象，这一点是为大多数人所公认的。\n在西方文艺理论的著作中，对于典型有大量的论述。如黑格尔曾说：“在荷马的作品里，第一英雄都\n是许多性格特征的充满生气的总和。”他强调，艺术作品中的人物形象应当是个性十分鲜明，且富于代表\n性的：“每个人都是一个整体，本身就是一个世界，每个人都是一个完满的有生气的人，而不是某种孤立\n的性格特征的寓言式的抽象品。”别林斯基也曾指出：“创作本身的显著标志之一，就是这典型性——如\n果可以这样说的话——这就是作者的文章印记。在一位真正有才能的人写来，每一个人物都是典型，每一\n个典型对于读者都是似曾相识的不相识者。”别林斯基认为，奥赛罗就是嫉妒褊狭的典型人物，而哈姆雷\n特则是优柔寡断的典型人物等。在此，别林斯基已经开始注意到典型人物不仅应当具有个性特征，而且还\n应具有时代特征，在体现出特殊性的同时，还应体现出普遍性。正如恩格斯指出，优秀的艺术作品中，典\n型应当是个别性与普遍性高度有机的统一体：“每个人都是典型，但同时又是一定的单个人，正如老黑格\n尔所说的，是一个‘这个’。”为了真正地塑造好典型人物，就需要“真实地再现典型环境中的典型人物”,\n换言之，即实现人物形象与艺术情境的和谐统一。\n艺术典型既是特殊性与普遍性的有机统一，又是偶然性与必然性的有机统一。任何艺术作品中的典型，\n都是在鲜明生动的个性中体现出广泛普遍的共性，并将独一无二的个别形象置于具有普遍性的某些情境之\n中。在这里，艺术典型的个性，是指作品中的人物形象不仅具有独特的外表、独特的行为、独特的生活习\n惯，而且具有独特的性格、独特的感情、独特的内心世界。正如列宁在评价俄国19世纪批判现实主义作家\n冈察洛夫所塑造的“多余人”形象——奥勃洛摩夫的典型个性时所说：“在俄国生活中曾有过这样的典型，\n这就是奥勃洛摩夫。他总是躺在床上，制定各种计划。从那时起，已经过去很长一段时间了。俄国完成了\n三次革命，但奥勃洛摩夫们仍然存在，因为奥勃洛摩夫不仅是地主，而且是农民，不仅是农民，而且是知\n识分子，不仅是知识分子，而且是工人和共产党员。只要看一下我们如何开会，如何在各个委员会里工作，\n就可以说老奥勃洛摩夫仍然存在。”奥勃洛摩夫这个人物，他主要的个性特征就是懒惰，他年轻，又颇有\n教养，却整天穿着睡衣，把大好时光都消磨在睡眠上，甚至在做梦时也梦见睡觉。“奥勃洛摩夫个性”实\n际上是那个时代的标志，象征着必将走向灭亡的旧俄国腐朽寄生的生活方式，从这个意义上讲，这个独一\n无二的个性就体现出了某种时代和阶级的共性。"}, {"id": 73, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "4.简述典型与意境的区别。", "answer": "对艺术形象的理解需置于一定的情境之中，才能实现总体上的把握。对于艺术活动来讲，情境指的是\n一种审美化的情景与境界，既存在于艺术作品之中，又存在于艺术接受之中，鲜活的艺术形象往往需与恰\n当的艺术情境相互配合、融为一体，才能实现完整的审美体验。而在具体的艺术作品中，典型和意境即可\n看作与艺术形象相结合的两种理想的情境范畴。\n典型，又称“典型人物”“典型性格”或“典型形象”,狭义来说，是指艺术作品中所塑造出的成功\n人物形象，而广义来说，典型又被认为应包括典型人物、典型事件、典型环境等。但无论如何界定，可以\n说，典型的核心是在特定的情境中塑造出鲜明生动的人物形象，这一点是为大多数人所公认的。\n意境，是中国古典美学传统中的一个重要范畴。中国古典诗词曲赋、书画、乐舞、建筑、戏曲等艺术\n类型都十分重视意境。简言之，意境就是艺术中一种情景交融的境界，是艺术中主客观因素的有机统一。\n意境中既有来自艺术家主观的“情”,又有来自客观现实升华的“境”,“情”和“境”是有机地融合在\n一起的，境中有情，情中有境。意境是一种若有若无的朦胧美，是一种由有限到无限的超越美，意境是一\n种不设不施的自然美。\n典型和意境对各种类型的艺术都具有普遍意义，二者既有联系，又存在区别。 一般来讲，典型重写实，\n意境重抒情；典型倾向再现，意境倾向表现；典型侧重于情境对鲜明人物形象的烘托， 意境侧重于形象对\n艺术家内心情境的抒发。以再现为主的各类型艺术，如戏剧、电影、电视剧、小说等，常常更注重在作品\n中塑造典型；而以表现为主的各门艺术，如抒情诗、书法、绘画、音乐、建筑等，往往更侧重于在作品中\n渲染意境。典型论在西方文艺理论中占有极为重要的地位，意境论则在中国古代文艺理论中占有十分重要\n的地位。\n### (三)论述题"}, {"id": 74, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "1.论述意境美学。", "answer": "意境，是中国古典美学传统中的一个重要范畴。中国古典诗词曲赋、书画、乐舞、建筑、戏曲等艺术\n类型都十分重视意境。简言之，意境就是艺术中一种情景交融的境界，是艺术中主客观因素的有机统一。\n意境中既有来自艺术家主观的“情”,又有来自客观现实升华的“境”,“情”和“境”是有机地融合在\n一起的，境中有情，情中有境。\n意境，是中华民族在长期艺术实践中所形成的一种审美上的理想情境。作为美学范畴的意境，孕育于\n先秦至魏晋南北朝时期，并于唐代正式诞生。需要指出的是，意境范畴的生成，直接受到了佛教思想的影\n响。佛教自两汉之际传入中国以后，在魏晋南北朝时开始与玄学结合，到唐代进一步发展并逐渐趋于中国\n化。从一定意义上讲，中国禅宗的思维对于意境范畴的形成产生了直接且重大的影响，但探讨意境范畴的\n思想源头却可追溯到先秦的老庄哲学与魏晋玄学。\n除了情景交融以外，意境至少还具有以下三个方面的特点：\n(1)意境是一种若有若无的朦胧美\n在中国传统艺术境界里，更多地将其分为虚与实两个部分。虚与实可以说是中国传统美学对构成审美\n对象的两大要素的区分，意与象、神与形、心与物、情与景等，大体上讲，前者为虚，后者为实。由此可\n以看出，意境的实的部分存在于画面、文字、乐曲及想象的意象之中；而虚的部分，即意境之重要或本质\n的部分存在于想象和感悟之中。中国传统艺术的最高范畴“意境”即是人通过艺术对世界本体的体悟。而\n世界本体在中国传统思想中是非虚非实、即虚即实的存在，只有这样去理解把握意境这一范畴，我们才能\n将中国哲学与中国艺术作一以贯之的理解，才能对中国古代艺术两千年的追求作贯通的把握。\n中国传统艺术十分讲究虚实结合。如中国的书画艺术即讲究虚实结合，注重留白对于画面总体意境的\n渲染，画面中的空白绝不是多余的部分，相反，这种空白恰恰是书画中最有味道的地方。例如，南宋马远\n的画惯取一角之景，并善用空白，因此常被戏称为“马一角”,他的《寒汇独钓图》,更是运用大片空白\n突出了“寒”与“独”的意境。正如清代笪重光在《画笙》中所说：“虚实相生，无画处皆成妙境。”而\n中国书法则强调“计白当黑”,甚至把书法中字的结构就称为“布白”。中国戏曲的舞台艺术更是虚实结\n合的，演员手上的一根马鞭和几个动作，就可以让观众感觉他骑在马上跑过了几百里路程。其至作为现代\n艺术的中国电影，也继承和发扬了中国传统美学思想中的虚实意境，尤其在某些空镜头中创造出了令人难\n以忘怀的情景交融的画面。\n(2) 意境是一种由有限到无限的超越美\n中国传统艺术作品，从来就是追求一种“韵外之致”或“味外之旨”。早在魏晋时期，玄学家王弼就\n曾提出“得象忘言，得意忘象”的命题，力求突破言、象的有限性，追求意的无限性，以有限表现无限，\n从而达到“言有尽而意无穷”的境界。从刹那见永恒，以咫尺见千里，是中国艺术家创构艺术意境的切入\n点。在富于历史感的中国人心中，时间的观念相当之强。人事沧桑、家国兴衰、年华消逝、际遇沉浮，都\n通过时间的流转而万象纷呈。\n相传宋徽宗时，北宋画院多以命题画方式来招考画师，主要意图就是考察画师运用绘画意境来表达诗\n意的能力。例如，人们熟悉的“野水无人渡，孤舟尽日横”,画师就仅画一舟人卧于船头，手横一支竹笛，\n而诗意全出。“深山藏古寺”,则根本看不见崇山峻岭之中的庙宇，只画一个小和尚在山下的小溪边舀水\n足矣。还有“踏花归去马蹄香”,这一诗意本来是很难用绘画形象来表现的，结果中选的画以奔驰的马蹄\n后，一群蝴蝶正翻飞追逐的画面，唤起了观众的联想和想象。可见，在意境中，境是基础，如果没有境，\n就无法塑造丰满鲜活的艺术形象，这样一来，情与意也就无从产生，更无所寄托。\n(3) 意境是一种不设不施的自然美\n中国美学史上，历来存在着两种不同的美学理想， 一种是“错采镂金，雕绩满眼”,另一种则是“初\n发芙蓉，自然可爱”:“上述两种美感，两种美的理想，在中国历史上一直贯穿下来。”代表着各自不同\n的艺术风格和审美追求。在具体的艺术作品中，如商周的青铜器、楚辞、汉赋，明清的瓷器(永乐釉里红、\n康熙五彩、雍正粉彩等),以及戏曲舞台上绚丽多彩的服装，为数众多的民间刺绣、年画、剪纸等，就都\n以富丽的色彩与精细的制作堪称“错采镂金，雕绩满眼”之美。而与此相反，王羲之的书法、顾恺之的画、\n陶渊明的诗，以及宋代定窑的白瓷和龙泉窑的青瓷，以及“元四家”“明四家”和清代“扬州八怪”的绘\n画作品等，则应属“初发芙蓉，自然可爱”的美。\n宗白华指出；“魏晋六朝是一个转变的关键，划分了两个阶段。从这个时候起，中国人的美感走到了\n一个新的方面，表现出一种新的美的理想。那就是认为‘初发芙蓉’比之于‘错采镂金’是一种更高的美\n的境界……这是美学思想上的一个大的解放。诗、书、画开始成为活泼泼的生活的表现，独立的自我表现。”\n而这种自我表现，正是中国古典美学传统十分重视的一种风格，一般被称为“天趣”“天然”或“天真”。\n如唐代诗人李白和杜甫就都曾大力倡导过这种风格，李白认为诗贵“自然”“清真”,提倡“清水出芙蓉，\n天然去雕饰”;杜甫则强调作诗应当“直取性情真”。又如宋代苏轼更是要求诗文应当“绚烂之极归于平\n淡”,认为这种自然无华的美才是最高境界的美。总而言之，意境追求天然之美，追求纯真之美，追求素\n朴之美，归结为一种自然天真的审美趣味，对中国传统美学产生了巨大的影响。"}, {"id": 75, "chapter": "第四章艺术作品", "knowledge_point": "知识点3.艺术作品的内容", "type": "(一)名词解释", "question": "2.论述艺术作品的意蕴。", "answer": "所谓艺术作品的意蕴，是指深藏在艺术品中的内在意味或含义，具有多义性、模糊性和朦胧性的特点，\n大多时候体现为一种诗情、神韵或哲理，往往只可意会，不可言传，需要接受者用全部心灵去探究和领悟。\n可以说，意蕴正是文艺作品具有不朽魅力的根本原因所在。\n关于艺术作品的意蕴问题，在西方美学与文艺理论史中曾有过许多明确的论述。如黑格尔曾讲过：“意\n蕴总是比直接显现的形象更为深远的一种东西。艺术作品应该具有意蕴。”他又说：“遇到一件艺术作品，\n我们首先见到的是它直接呈现给我们的东西，然后再追究它的意蕴或内容。前一个因素——即外在的因素\n——对于我们之所以有价值，并非由于它所直接呈现的；我们假定它里面还有一种内在的东西，即一种意\n蕴，一种灌注生气于外在形状的意蕴。”黑格尔认为，意蕴就像一个人的眼睛、面孔、皮肤、肌肉，乃至\n于整个形状，都显现出这个人的灵魂和心胸一样，艺术作品也是通过线条、色彩、音响、文字和其他媒介，\n来“显现出一种内在的生气，情感，灵魂，风骨和精神，这就是我们所说的艺术作品的意蕴”。\n中国美学与文艺理论史上尽管没有明确提出意蕴这一概念，但历代美学家、艺术家们对这一问题却有\n过大量的精辟论述。例如，中国古代的书论、画论就都对艺术作品中“形”与“神”的关系问题进行过大\n量的论述。东晋画家顾恺之重要的画论观点之一就是“以形写神”,与他同时代的宗炳，以及南齐的谢赫，\n也都对绘画的“形神”问题发表过很有见地的看法。南齐书法家王僧虔更提出“书之妙道，神采为上，形\n质次之”的观点。又如，中国古代的诗论、文论对这一问题也有许多论述，唐代诗论家司空图认为，诗歌\n应具有“象外之象”“景外之景”“韵外之致”“味外之旨”,其后，宋代严羽的“妙悟说”,清代王士\n祯的“神韵说”等，也都可看作是对司空图这一美学观念的继承与发展。\n(1)意蕴蕴藏文化含义和人文精神\n艺术的意蕴从一定意义上来讲，就是艺术作品中所蕴藏的文化含义和人文精神。古今中外优秀的艺术\n作品，正是因为具有深刻的艺术意蕴，所以才能够经久不衰，体现出各不相同的文化品格和艺术价值。如\n原籍德国的美国艺术史学者潘洛夫斯基即主张艺术史研究应充分利用与艺术作品相关的政治、宗教、哲学、\n社会、历史、心理等多方面的文献，从而才能真正理解和认识艺术作品的内在意义。潘洛夫斯基认为，可\n以从以下三个方面来把握艺术图像的意义：首先是“自然的意义”,主要是指通过常识就能认识的人物、\n事物、对象和母题等，例如图像中的山、水、树、石等；其次是“习俗的意义”,主要指约定俗成的或者\n具有象征意义的内容，例如中国传统绘画中的龙凤图案，或者西方绘画中的蛇和苹果等；最后则是“内在\n的意义”,从某种意义上，更可以称之为一种综合内涵。由于图像的“内在的意义”是一种象征的、形式\n化的价值，它凝聚了作品问世时特定时代的历史、政治、科学、宗教等诸方面的征兆，因而相应的阐释就\n难度尤加。阐释者不仅要熟知图像标志的意义及其文本的依据，而且还要了解特定的观念史、社会和宗教\n的体制特点、时代的理性态度，以及广博的外语知识，总之，必须是一个文化史学者乃至人文主义学者。\n不难看出，潘洛夫斯基所概括的后两层含义，即“习俗的意义”和“内在的意义”,就都属于文化的范畴，\n并具有文化的意义。艺术意蕴作为民族文化审美心理的积淀，凝聚着民族特色与时代特色的文化内涵。\n(2) 意蕴具有多义性和模糊性\n艺术作品中的这种深层意蕴，由于具有多义性和模糊性，不但欣赏者意见纷纭、解读不一，有时甚至\n创作者自己也难于说明。例如俄国著名文艺理论家杜勃罗留波夫曾经为俄国作家冈察洛夫的长篇小说《奥\n勃洛摩夫》写过一篇评论文章《什么是奥勃洛摩夫性格?》,在这篇文章中，杜勃罗留波夫深刻分析了奥勃\n洛摩夫性格及其形成的社会环境，鲜明地揭示了奥勃洛摩夫身上“彻头彻尾的惰性”产生的社会根源，就\n是腐朽的俄国农奴制度本身。应当指出，杜勃罗留波夫这些精辟的分析，其实是作者冈察洛夫本人都没有\n意识到的，所以冈察洛夫才深有体会地说：“艺术家常常要借助细致的批评家，例如别林斯基和杜勃罗留\n波夫，才看出其意义来。”\n(3) 意蕴富含哲理或诗情\n艺术的意蕴，并不能简单等同于艺术作品的题材或主题。比起艺术作品的题材与主题来，艺术意蕴是\n一种更加形而上的内容。它是一种哲理或诗情的感性表现，只可意会，难以言传。正如陶渊明在《饮酒》\n诗中所说：“此中有真意，欲辨已忘言。”许多情况下，对于艺术作品意蕴的阐释，都只能接近它，而无\n法穷尽。\n如德国文学最杰出的作品之歌德的诗剧《浮士德》,就具有非常复杂的思想内涵和艺术意蕴，自作品\n问世以来，世界各国的专家、学者曾经从作者论、结构主义、时代特征、哲学思想等角度出发，对它进行\n过多方面的研究，写出了上百部专著和无数篇论文，不断地探索和发现深藏在这部作品中的艺术意蕴。可\n见，从《浮士德》这个例子来看，艺术意蕴往往会对作品自身特定的历史内容有所超越，激发欣赏者产生\n具有更加普遍和深刻的思想共鸣。而且，由于家庭、亲情、友谊、爱情等是属于全人类的共通情感；生命、\n死亡、存在、毁灭、宇宙、时空等也是全人类共同思考的问题：真、善、美更是全人类共同珍惜的价值，\n所以优秀艺术作品的意蕴，常常或多或少、或隐或显地体现出这些深刻的内涵，并通过艺术的方式加以体\n现。\n此外，还有一点需要指出，在艺术作品的内容构成中，大部分作品一般都能够具有主题、题材以及形\n象、情境，但并不是每一个艺术作品都能够具有艺术的意蕴。某些偏重于娱乐性、功利性或纪实性的作品，\n往往就不存在意蕴层次的内容。但是，从总体上讲，以物质材料与艺术语言作为媒介，由艺术语言组合和\n作品内在结构作为形式，所展现出的从题材、主题到形象、情境，再到意蕴的艺术作品的全部内容，应呈\n现为一个完美的整体，才有可能真正形成流传后世的优秀艺术作品。"}, {"id": 76, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "1.艺术素养", "answer": "含义：所谓艺术素养，是指人们对艺术的认知和修养，特别是对具体艺术门类的认知和修养。\n**作用：艺术素养的深浅决定着艺术创作水平的高低，也决定了艺术接受的层次和质量。**\n**表现：艺术素养以艺术感受力为前提，以艺术知识为内容，以艺术判断力为旨归，是在长期的艺术实**\n践的基础上，依靠艺术经验的积累和对艺术知识的吸收、学习而综合形成的主体能力。艺术感受力主要表\n现为艺术形式的感受力，艺术知识包括具体艺术门类的基本知识、艺术理论和艺术史知识。其中，艺术感\n受力是感性的部分，艺术知识是理性的部分，而艺术判断力是直觉的部分。从艺术感受力上升为艺术判断\n力，中间须经历艺术知识的洗礼，包含了从感性上升为理性，再从理性回归感性的过程。"}, {"id": 77, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "2.文化修养", "answer": "含义：所谓文化修养，是指人们基于对某些学科知识体系的了解、研究和掌握而提炼出的见识和升华\n出的智慧，是在学习人文、社会和自然知识的基础上，通过独立思考而形成自己的世界观、价值观的一种\n能力。\n**作用：文化修养包括艺术素养，但不限于艺术素养。对艺术接受主体来说， 一般需不同程度地具备文**\n学、哲学、历史学、心理学、社会学、伦理学、政治学、人类学、民俗学乃至经济学等学科的知识，虽然\n不必面面俱到。由于艺术作品是一个复杂的综合体，只有具备一定的文化修养，才能较深刻地把握艺术作\n品的时代精神，理解其内涵。"}, {"id": 78, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "3.审美无利害", "answer": "提出：在经验派影响下， 康 德提出并系统阐释了“审美无利害”的思想，并将其确立为一种审美原则。\n直至叔本华提出“审美静观”说，最终形成了审美态度理论。\n内涵：康德首先区分了感官的、道德的和美的三种快感。认为感官的快感与生理欲求相联系，道德的\n快感与善的目的相联系，前者追求直接的满足，后者涉及目的的概念，但两者都与对象的存在相关，而美\n的快感是一种主观的快感，仅与对象的形式相关，而无关对象本身的存在。因此，康德为美下定义说：“美\n是无一切利害关系的愉快的对象。”在康德的思想里，审美对象能否成为审美对象，关键在于主体能否将\n对象从主体的功利欲求与现实的利害关系中解脱出来。\n**意义：“审美无利害”说，是康德美学的基石，也被认为是近代美学之有别于传统美学的标志。自康**\n德以来，“审美无利害”便成为一条无可争辩的原则，被用以确立审美与非审美的界限。"}, {"id": 79, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "4. “心理距离”说", "answer": "提出：瑞士心理学家布洛从心理学角度，为“审美无利害”说提供了新的论证。1912年，布洛提出了\n“心理距离”说。\n内涵：该学说认为， 审美快感的产生，有赖于主体与对象之间保持一种情感上或心理上适当的距离，\n这种距离由于消除了主体对客体的实用态度而使快感呈现为美感，因而使主体对眼前的事物产生崭新的体\n验。心理距离是艺术创作、艺术欣赏及一般审美活动共有的主体特征。不过，布洛认为，恰当的心理距离\n依靠一种“距离的自我矛盾”而存在，即在主体与客体之间，必须是“切身又带有距离”,不可太近，也\n不可太远。太近容易引动实用的欲念，太远则无法引起心理的触动。布洛把前者叫做“差距”,把后者叫\n做“超距”,其实，两者都可谓“失距”。可见，布洛把美感产生的条件仍然放在了审美主体一边，他的\n“心理距离”说实为从心理学角度提出的关于审美态度的阐释。"}, {"id": 80, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "5.想象力", "answer": "含义：想象力，是指人在已有形象的基础上，在头脑中创造出新形象的能力。想象，指的是在人脑中\n对已有的表象进行加工改造而创造出新形象的心理活动。\n理论：在中国古典美学中，想象力被贴切地命名为“神思”。南朝文论家刘勰云：“形在江海之上，\n心存魏阙之下，神思之谓也。文之思也，其神远矣，故寂然凝虑，思接千载；悄焉动容，视通万里。”刘\n勰指出，想象力的发挥是一种“神与物游”的状态。东晋顾恺之说：“凡画，人最难，次山水，次狗马，\n台榭一定器耳，难成而易好，不待迁想妙得也。”所谓“迁想妙得”,讲的也是艺术想象。这意味着，艺\n术想象是人的心灵运用感性材料建构审美意象的过程，来源于想象力的发挥。在艺术创作中，想象力意味\n着在现实生活所提供材料的基础上生成审美意象的能力；而在艺术鉴赏中，想象力意味着在艺术作品所提\n供形象的基础上重构审美意象的能力。"}, {"id": 81, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "6.文学四要素", "answer": "提出：美国文学理论家艾布拉姆斯在其《镜与灯——浪漫主义文论及批评传统》 一书中，提出了著名\n的“文学四要素”论。\n内涵：艾布拉姆斯指出，文学是由“作品、作家、世界、读者”四个要素组成的结构系统。依此系统，\n文学阅读就不再只针对作品，而是针对作品、作家、世界的关系网络，因此变成了读者与作品、作家、世\n界之间交织展开的一场复合型对话，读者的地位由此被突出，这预告了后来的接受美学及读者反映理论的\n兴起。"}, {"id": 82, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "7.俄国形式主义", "answer": "**定义：俄国形式主义是1914年到1930年期间出现的一个文艺批评流派。他们反对只根据作家生平、**\n社会环境、哲学、心理学等外部因素去研究作品，认为作品研究的对象就是作品本身，艺术评论者要去探\n寻艺术自身的特性和规律，即作品的语言、风格和结构等形式上的特点和功能。\n主要观点：\n(1)艺术作品是“意识之外的现实”。形式主义认为，艺术作品任何时候都只是一种构造和游戏。\n(2)艺术创作的根本艺术宗旨不在于审美目的，而在于审美过程。形式主义认为，需要采取“陌生化”\n(使现实中的事物变形)手段，让人们重新审美地感知原来的事物。\n(3)文学批评的任务是要研究文学之所以成为文学的内部规律，即文学性，即着重研究艺术形式，要\n深入艺术系统内部去研究艺术的形式和结构。\n(4)文艺创作的本质是一种表现形式。欣赏文艺能直接得到的首先是一种审美感受和审美体验。"}, {"id": 83, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "8.期待视野", "answer": "**定义：接受美学的代表人物姚斯提出了这一概念，所谓“期待视野”是一个接受美学的概念，指接受**\n者在进入接受过程之前业已具备的一套具有定向性的心理结构图式，是接受者对艺术作品的预先估盼。\n来源：期待视野来源于接受者个人的审美趣味、接受经验等，其中既有个人经验因素，又有社会影响\n因素，是历史形成的一套个人思维定向与观念结构，它决定了审美期待的广度与深度。\n层次：期待视野大体可分为三个层次：文体期待、意象期待、意蕴期待。它们分别对应于艺术作品的\n三个层次。姚斯认为，艺术作品的特性和价值是由接受主体赋予的，而不是由艺术作品自动给予的。"}, {"id": 84, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "9.前理解", "answer": "内涵：海德格尔认为，“前理解”是一个人的认知结构，是现象学中“意向性”范畴的表现。按照他\n的意思，“理解”总是从人的既有之此——人生存的时间性和历史处境——出发，于是，“理解”就不可\n避免地存在着一个先决条件，那就是“前理解”。这与伽达默尔所说的“成见”是同一个意思。\n层次：海德格尔认为，前理解由三个层次构成——先行具有、先行见到、先行掌握。由先行具有、先\n行见到、先行掌握所组成的前理解结构，指的是艺术接受者在与作品发生关系之前既已具备的较稳定的意\n识结构，来源于个人的综合素养，由各种知识构成。海德格尔称之为“前结构”。它为接受者的期待视野\n提供了基础，影响了接受者对艺术作品的解读，也由此强化了接受者在艺术接受活动中的主导性。"}, {"id": 85, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "10.召唤结构", "answer": "**定义：这个概念是由德国接受美学家伊塞尔提出的。召唤结构，是指由众多空白构成的文本体系，期**\n间的空白由读者运用自己独特的体验和想象去填充。召唤结构是艺术作品因空白和否定所导致的不确定性，\n呈现为一种开放性的结构，这种结构本身随时召唤着接受者能动的参与进来，通过想象以再创造的方式接\n受。\n**作用：伊塞尔认为艺术作品自身只是一个不确定的召唤结构，它由很多“空白”所组成，当读者讲自**\n己独特的体验和想象置入文本，将作品中的这些空白填充起来时，作品才真正成了读者的作品，作品的艺\n术世界才真正成为读者的世界，作品中的未定性才得以确定，艺术作品的审美价值才得以实现。优秀的作\n品中，欣赏者借助自己的想象和体味，可以在有限的文字中得到无限丰富的意蕴和旨趣。"}, {"id": 86, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "11.隐含的读者", "answer": "**定义：由德国接受美学家伊塞尔提出，所谓“隐含的接受者”,指的是艺术家在创作时对接受群体的**\n考虑，艺术家得考虑自己的作品将为哪一个社会群体和社会阶层所接受。接受者的身份和立场、他们的品\n位和需求等，统统成为艺术家创作时考虑的因素。纯粹为自己创作的艺术家是不存在的，艺术创作根本上\n是一种为“他者”而进行的活动。\n决定因素：\n(1)作家创作的动机会决定作品中隐含的读者的存在；\n(2)作家的选材及文体特点也会决定隐含的读者的存在；\n(3)作品的思想内涵也会决定隐含的读者的存在。\n### (二)简答题"}, {"id": 87, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "1.简述接受主体之主观条件的构成因素。", "answer": "接受主体的主观条件是由接受主体的审美鉴赏力、艺术素养、文化修养和人生阅历等因素综合构成的。\n(1)审美鉴赏力\n所谓审美鉴赏力，是指人们认识美、评价美的能力，包括审美感知力、判断力、想象力、创造力等。\n审美鉴赏力是艺术鉴赏主体顺利开展艺术鉴赏活动的首要条件，据此构成艺术接受主体的基本主观条件。\n缺乏了审美鉴赏力，艺术鉴赏就无法展开，艺术接受的进程就丧失了起点。\n(2)艺术素养\n所谓艺术素养，是指人们对艺术的认知和修养，特别是对具体艺术门类的认知和修养。艺术素养的深\n浅决定着艺术创作水平的高低，也决定了艺术接受的层次和质量。艺术素养以艺术感受力为前提，以艺术\n知识为内容，以艺术判断力为旨归，是在长期的艺术实践的基础上，依靠艺术经验的积累和对艺术知识的\n吸收、学习而综合形成的主体能力。艺术感受力主要表现为艺术形式的感受力，艺术知识包括具体艺术门\n类的基本知识、艺术理论和艺术史知识。其中，艺术感受力是感性的部分，艺术知识是理性的部分，而艺\n术判断力是直觉的部分。从艺术感受力上升为艺术判断力，中间须经历艺术知识的洗礼，包含了从感性上\n升为理性，再从理性回归感性的过程。\n(3 ) 文 化 修 养\n所谓文化修养，是指人们基于对某些学科知识体系的了解、研究和掌握而提炼出的见识和升华出的智\n慧，是在学习人文、社会和自然知识的基础上，通过独立思考而形成自己的世界观、价值观的一种能力。\n文化修养包括艺术素养，但不限于艺术素养。对艺术接受主体来说， 一般须不同程度地具备文学、哲学、\n历史学、心理学、社会学、伦理学、政治学、人类学、民俗学乃至经济学等学科的知识，虽然不必面面俱\n到。由于艺术作品是一个复杂的综合体，只有具备一定的文化修养，才能较深刻地把握艺术作品的时代精\n神，理解其内涵。\n(4)人生阅历\n所谓人生阅历，是人在既有生命历程中获得的见闻、经验及价值判断力。人生阅历与人的年龄、所接\n触的人群以及所涉足过的地域都有密切联系。人生阅历的深浅将影响接受主体对某些艺术作品的理解。子\n曰“五十以学易”,谈的就是这个道理。鲁迅也说：“但看别人的作品，也很有难处，就是经验不同，即\n不能心心相印。所以常有极要紧，极精彩处，而读者不能感到，后来自己经验了类似的事，这才了然起来。”\n无论是读《红楼梦》、看莎士比亚悲剧还是听贝多芬交响乐， 一个人在十多岁时和四五十岁时的体验必将\n大大不同。"}, {"id": 88, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "2.简述接受美学的观点。", "answer": "接受美学产生于20世纪60年代中期，其倡导读者在艺术接受的过程中是主动的，是推动文学创作的\n动力；认为文学的接受活动，不仅受作品的性质制约，也受读者制约。接受美学的代表人物包括姚斯、伊\n塞尔。\n(1 ) 期 待 视 野\n接受主体对艺术接受活动的主导性，主要是通过“期待视野”发挥影响的。所谓“期待视野”是一个\n接受美学的概念，指接受者在进入接受过程之前业已具备的一套具有定向性的心理结构图式，是接受者对\n艺术作品的预先估盼。期待视野来源于接受者个人的审美趣味、接受经验等，其中既有个人经验因素，又\n有社会影响因素，是历史形成的一套个人思维定向与观念结构，它决定了审美期待的广度与深度。接受美\n学的代表人物姚斯提出了这一概念。据其分析，期待视野大体可分为三个层次：文体期待、意象期待、意\n蕴期待。它们分别对应于艺术作品的三个层次。姚斯认为，艺术作品的特性和价值是由接受主体赋予的，\n而不是由艺术作品自动给予的。\n(2)文本与作品\n接受美学区分了“文本”与“作品”的概念。简而言之，文本就是艺术家生产的产品，是与接受者发\n生关系之前的由物质所承载的符号；而作品是与接受者发生了关系的对象，是接受者参与创造的审美存在。\n萨特说：“文学是一只奇怪的陀螺，只有在运动中才能显示其本色。为了使文学出现，必须具有一种具体\n的行为。它就叫做阅读。而且文学只能随着这种阅读的延续而延续。除去这一条，纸上就只留着黑色的污\n迹。”萨特的话事实上说明了文本到作品的演化。接受美学的另一位创立者伊塞尔用“艺术——审美”两\n极论来解释了这种区别，他把文学作品视为由艺术和审美两极构成的交流形式，艺术极由作者的文本提供，\n审美极由读者的阅读来具体实现。于是，文学作品就是艺术和审美两极交流互动的结果。总之，没有接受\n主体的介入，文本就不会变成作品。文本向作品的转变过程，正是接受主体显示其地位、发挥其作用的过\n程。\n(3)隐含的读者\n艺术家以这种方式而不是那种方式来构成自己的作品，先就为心目中的接受者有了设身处地的考虑，\n并希望接受者来达成理解。这样，艺术作品便成为伊塞尔所说的“召唤结构”,召唤着接受者把审美的潜\n在性转化为现实性。\n艺术史告诉我们，即便是那些生前寂寞的艺术大师，在从事创作活动时，心中也存在着潜在的观众或\n听众。中国古人写作，当他们不为同代人所理解的时候，每以“藏之名山，传之后世”而聊以自慰，就很\n能说明这个道理。伊塞尔认为，文学作品中存在着一个“隐含的读者”。如果超越艺术门类，就该称为“隐\n含的接受者”——美术作品中存在着“隐含的观众”,音乐作品中存在着“隐含的听众”——他们统统来\n源于艺术家的预设，那就是“为谁创作”。在这个问句之下，接受者的身份和立场、他们的品位和需求等，\n统统成为艺术家创作时考虑的因素。艺术家作为生产者，是不可能不考虑消费者的趣味的。这样，艺术作\n品就可被看成艺术家与受众趣味妥协的结果。这就是说，纯粹为自己创作的艺术家是不存在的，艺术创作\n根本上是一种为“他者”而进行的活动。\n### (三)论述题"}, {"id": 89, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "1.论述接受主体的地位和作用。", "answer": "艺术接受主体的地位和作用，是通过接受主体在艺术接受活动中发挥其主观能动性而得到体现的。20\n世纪的艺术学理论有一个普遍的特点，就是把艺术接受从过去的以作品为中心转移到了以接受者为中心，\n重在探讨接受者对艺术作品的欣赏、理解和阐释，以及这些活动对艺术创作、艺术史建构发生的反作用。\n这为我们提供了新的视野。艺术接受主体的地位和作用，它们分别表现为：接受主体对艺术接受的主导性、\n接受主体对艺术创作的反作用、接受主体对艺术史建构的参与性。\n(1)接受主体对艺术接受的主导性\n艺术接受是接受主体调动其生理和心理因素进行的审美实践活动，因此，在艺术接受活动中，接受主\n体始终占据主体地位，发挥着主导作用。\n美国文学理论家艾布拉姆斯在其《镜与灯——浪漫主义文论及批评传统》 一书中，提出了著名的“文\n学四要素”论，认为文学是由“作品、作家、世界、读者”四个要素组成的结构系统。依此系统，文学阅\n读就不再只针对作品，而是针对作品、作家、世界的关系网络，因此变成了读者与作品、作家、世界之间\n交织展开的一场复合型对话，读者的地位由此被突出，这预告了后来的接受美学及读者反映理论的兴起。\n到了现象学和阐释学那里，“文本 — —读者”的关系更是被纳入艺术本体论范畴，成为人们阐释艺术\n作品、理解艺术活动的核心关注。\n接受主体对艺术接受活动的主导性，主要是通过“期待视野”发挥影响的。所谓“期待视野”是一个\n接受美学的概念，指接受者在进入接受过程之前业已具备的一套具有定向性的心理结构图式，是接受者对\n艺术作品的预先估盼。接受美学区分了“文本”与“作品”的概念。简而言之，文本就是艺术家生产的产\n品，是与接受者发生关系之前的由物质所承载的符号；而作品是与接受者发生了关系的对象，是接受者参\n与创造的审美存在。没有接受主体的介入，文本就不会变成作品。文本向作品的转变过程，正是接受主体\n显示其地位、发挥其作用的过程。\n(2)接受主体对艺术创作的反作用\n自我表现论者认为，艺术创作是情感宜泄的活动，原因是心有郁结而不得通其道。情感宜泄当然是艺\n术创作的重要动机，但不是唯一的动机，艺术创作还起于交流的愿望。即便宜泄，也需要一个想象中的宜\n泄对象。艺术家以这种方式而不是那种方式来构成自己的作品，先就为心目中的接受者有了设身处地的考\n虑，并希望接受者来达成理解。这样，艺术作品便成为伊瑟尔所说的“召唤结构”,召唤着接受者把审美\n的潜在性转化为现实性。\n伊瑟尔认为，文学作品中存在着一个“隐含的读者”。如果超越艺术门类，就该称为“隐含的接受者”\n——美术作品中存在着“隐含的观众”,音乐作品中存在着“隐含的听众”——他们统统来源于艺术家的\n预设，那就是“为谁创作”。在这个问句之下，接受者的身份和立场、他们的品位和需求等，统统成为艺\n术家创作时考虑的因素。艺术家作为生产者，是不可能不考虑消费者的趣味的。这样，艺术作品就可被看\n成艺术家与受众趣味妥协的结果。这就是说，纯粹为自己创作的艺术家是不存在的，艺术创作根本上是一\n种为“他者”而进行的活动。\n(3)接受主体对艺术史建构的参与性\n20世纪的阐释学、社会批判理论、接受美学、读者反应理论等，都主张把人们对艺术作品的接受效果\n纳入艺术史的考察中，从而引发了一种趋势，即把艺术史书写的重点从艺术家和作品转移到接受者和接受\n发生的条件。此种艺术史书写方法或可被称为“效果史”。伽达默尔提出了“效果历史”的概念，他认为：\n“真正的历史对象不是客体，而是自身和他者的统一物，是一种关系。在此关系中同时存在着历史的真实\n和历史理解的真实。 一种正当的阐释学必须在理解本身中显示历史的真实。因此，我就把所需要的这样一\n种历史叫作‘效果历史’。”\n“接受美学”从作家、作品与读者的关系出发，将文学效果和读者接受引入了文学史书写。1967年，\n姚斯在德国康斯坦茨大学就任教授时发表演说，题为《文学史作为文学理论的挑战》,就把不同时代的读\n者对同一作品的不同理解、解释及评价作为文学史书写的依据之一，目的是为了建立一种宏观的文学史观，\n从而能够将文学效果史、作家、作品与读者的关系史以及作品为读者接受的历史囊括其中。艺术史也是这\n样被不断向前推进的。\n其后，在美国发展起来的“读者反应理论”,更进一步将读者在阅读文学作品时的感受加以绝对化，\n并据此对文学做出新的界定。针对新批评派对“感受谬见”的驳斥，读者反应批评家针锋相对地提出了“感\n受派文体学”。斯坦利 ·费希认为，文学并非文本，而是读者的体验，意义也并不来自于文学文本，而来\n自于读者对文本的释读，而且由于读者不同、阅读时间有异，所获得的意义也是漂浮不定的。这样，文本\n和读者的界限被模糊化了，读者的主观反应取代了文本的客体性。"}, {"id": 90, "chapter": "第五章艺术接受", "knowledge_point": "知识点1.艺术接受的主体", "type": "(一)名词解释", "question": "2.论述艺术接受过程中接受主体审美鉴赏力的能动转化。", "answer": "在接受主体所应具备的主观条件中，审美鉴赏力是最具有能动性的因素，艺术素养、文化修养和人生\n阅历只有朝着审美鉴赏力转化，才能释放出能动性，对艺术接受产生积极影响。\n(1)审美态度\n发挥审美鉴赏力的前提，是形成审美态度。所谓审美态度，是指在审美活动中，主体对客体所持有的\n一种“超功利”“无利害”的心理态度。它要求审美主体首先从日常生活、现实情境中脱离出来，以非实\n用、超功利的态度来看待对象，也包括超越智性的、信仰的和道德的需求。艺术鉴赏中的审美态度，就是\n要求鉴赏者与艺术作品之间保持一种超越现实的态度。这种态度有别于理论精神的(哲学或科学的)、宗\n教精神的 (宗教或巫术的)、实践精神的(伦理道德的)的态度，更有别于实用的态度。这意味着，在艺\n术鉴赏活动中，鉴赏过程本身就是目的，鉴赏主体并不为其他目的而进行下一步的行动，因而不会将鉴赏\n过程视为实现他种目的的手段。\n审美态度有一个基本的特征，便是对现实的超越，其中包括对实用功利的超越，对智力判断的超越\n对宗教情感的超越和对道德满足的超越。只有以审美态度去面对艺术作品，鉴赏者才不会把雕塑认作石头，\n把绘画认成画布和颜料。而一旦形成了审美态度，鉴赏者就不会把雕塑或绘画作品中的形象当作宗教的对\n象去顶礼膜拜，或者把它们视为求知的对象而判断其真伪，把它们当作道德的对象而评价其是非。不过，\n审美态度作为对鉴赏主体的基本要求，主要还是针对超越实用功利而言的，它要求人们面对艺术作品时，\n能空、能静，闲得下身，静得下心。\n(2) 审美感知力和审美判断力\n在形成审美态度的前提下，进一步，便需要审美鉴赏力在审美感知力和审美判断力的两个维度上发挥\n作用。所谓审美感知力，简而言之，指人们发现美、感受美的能力，而在艺术鉴赏过程中的审美感知力，\n当然是指鉴赏主体在艺术作品中发现美和感受美的能力。而所谓“审美判断力”,原为康德提出的一个概\n念。在《判断力批判》中，康德提出了“美的分析”。他按照形式逻辑的质、量、关系、样式这四个维度\n来考察美的定义，分别论述了美的非利害性、美的普遍性、美的(无目的的)合目的性、美的非概念性。\n这四个方面，都是对审美主客体关系的考量，其中又以审美主体为决定因素。所以，审美判断力是一种非\n关利害、不涉概念，仅凭对象的表象形式就能获得愉快，并从知性上判断其美丑的能力。在艺术鉴赏活动\n中，审美判断力就是人们在鉴赏艺术作品的过程中获得审美愉悦、感悟其审美价值的能力。\n审美判断力重在感觉力与知解力的协调，这也就是感性认识与理性认识的协调，表现为一种包含了理\n性认知的感性能力，它所依附的心理形式是直觉。那么从心理学的角度看，审美判断力实际上就等同于审\n美直觉。这样我们就可以下定义了：所谓审美直觉——在艺术创作和艺术鉴赏活动中也称为“艺术直觉”\n——是指在审美或艺术活动中，审美主体不假思索而能即刻把握和领悟审美对象或艺术作品的能力。这样，\n艺术鉴赏活动中的审美直觉，就可被表述为鉴赏主体不经推理过程便对艺术作品的内在联系作出当下即得\n的综合判断、产生本质直观的能力。这就是夏夫兹博理所说的“内在感觉力”或“内在节拍感”,也正是\n夏夫兹博理、哈奇生等英国经验主义者所认为的产生美感和道德感的源泉所在。\n(3)想象力\n随着审美感知力、判断力通过艺术直觉得到发挥，艺术鉴赏还需要插上想象力的翅膀。想象力，是指\n人在已有形象的基础上，在头脑中创造出新形象的能力。想象，指的是在人脑中对已有的表象进行加工改\n造而创造出新形象的心理活动。在艺术创作和艺术鉴赏活动中，想象力都是必不可少的主体条件。\n在中国古典美学中，想象力被贴切地命名为“神思”。南朝文论家刘勰云：“形在江海之上，心存魏\n阙之下，神思之谓也。文之思也，其神远矣，故寂然凝虑，思接千载；悄焉动容，视通万里。”刘勰指出，\n想象力的发挥是一种“神与物游”的状态。东晋顾恺之说：“凡画，人最难，次山水，次狗马，台榭一定\n器耳，难成而易好，不待迁想妙得也。”所谓“迁想妙得”,讲的也是艺术想象。这意味着，艺术想象是\n人的心灵运用感性材料建构审美意象的过程，来源于想象力的发挥。在艺术创作中，想象力意味着在现实\n生活所提供材料的基础上生成审美意象的能力；而在艺术鉴赏中，想象力意味着在艺术作品所提供形象的\n基础上重构审美意象的能力。"}, {"id": 91, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "1.移情说", "answer": "提出：19世纪下半叶，由德国心理学家、美学家立普斯在《空间美学和几何学 ·视觉的错误》一书中\n提出了“审美移情论”。\n内涵：立普斯认为，人们产生美感的根本原因在于“移情”的心理错觉，即人把自己的感觉、情感、\n意志“外射”于对象事物，使感情变成事物的属性，从而消除主客体的界限，达到物我同一。这样，人对\n事物的欣赏就成了对自我的欣赏。\n**评价：该学说侧重于对主体心理功能的体验，把主体的感觉、情感等提到了审美对象的地位，虽然有**\n忽视事物客体属性的倾向，但对审美心理学产生了重大影响。"}, {"id": 92, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "2.联 想", "answer": "含义：联想是指由一事物想到另一事物的心理过程。\n分类：按照它所反映事物间的关系不同，可分为接近联想、类比联想和对比联想。\n举例：在日常生活中，睹物思人、爱屋及乌，就是接近联想；看到春光，想到青春朝气；看到暴风雨，\n想起革命斗争，这是类比联想；而由夏日炎炎想起天寒地冻，这就是对比联想。在鉴赏活动中，通过联想，\n能使艺术形象更加鲜明生动，艺术内容更加丰富深刻。在中国文化语境中，人们看到国画中的梅、兰、竹、\n菊“四君子”还会想起人的高尚品格等。"}, {"id": 93, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "3.审美注意", "answer": "内涵：注意包括两个心理特点： 一是指向性，二是集中性，其功能是把主体的全部心理要素都集中到\n所指向事物身上，给予其定向的观照。所以，注意是指人在一段时间内撇开面前的其他事物而集中地、清\n晰地反映对某个特定事物的感知。\n条件：就心理学的角度看，注意的产生有客观和主观两方面的条件。客观条件是指刺激物的特点，如\n突出、鲜明、新颖、别致等，艺术作品就显然具备这样的特点；引起注意的主观条件，则是主体的经验、\n兴趣、心境、态度等，这也必然参与跟艺术作品的相会。当人们开始鉴赏艺术作品时，是离不开“注意”\n的心理功能的。当这种心理功能开始发挥作用时，审美注意就产生了。\n**作用：审美注意一是能够把鉴赏主体从日常生活中的意识状态带领到艺术鉴赏的心理状态之中；二是**\n能够把感知、想象、联想、情感、理解等各种心理因素定向和集中于某一特定的艺术作品中，并保持长时\n间注意的稳定性，使鉴赏者得以在相对稳定的审美注意中，保持各种心理活动的积极运转，使艺术鉴赏过\n程不失其持续性。"}, {"id": 94, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "4.审美理解", "answer": "内涵：艺术作品不仅是感知的对象，也是理解的对象。其实，在艺术鉴赏中，审美理解早在感知阶段，\n便依靠审美直觉开始进行了。因为审美直觉——或者说审美判断力——是一种感觉力与知解力协调的活动。\n以此为起点，审美理解广泛地伴随着想象、联想、情感等心理活动，渗透于艺术鉴赏的所有活动环节，就\n正如情感始终渗透于艺术鉴赏的全部进程一样。一边是感受， 一边是理解，才是艺术鉴赏的真实状态。\n**特点：作为艺术鉴赏高级阶段的审美理解，却具有一定程度的反思性和间接性，表现为一种理性的直**\n觉，并导向哲理的领悟。音乐、美术、戏剧、舞蹈，其意义都不仅仅在于愉悦我们的视听知觉，还启迪人\n生的价值。在鉴赏过程中，只有当知觉形态转化为反思材料、直接性转化为间接性、感官的快感转化为反\n思性的理解愉悦时，鉴赏者才有可能真正达到对艺术作品的深度把握。"}, {"id": 95, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "5.艺术接受的体验性", "answer": "含义：艺术接受的体验性，指艺术接受是一种审美体验活动。所谓体验，顾名思义，就是亲身经历、\n实地领会。具体指人们通过自己的感官，对人或事物进行直接感受、了解和把握的图景化的思维活动。体\n验是一种具有在场性和情境性的生命历程，既能回味，又有所预感。\n**特点：审美体验，就是能够导向美的领悟的体验活动。它兼具一般体验活动的在场性、直接性、情境**\n性、情感性、领悟性、可回味性等特点，也独具审美性的特点。但是，情感性在其中占了特殊的位置。可\n以说，体验的世界就是情感的世界。\n**作用：审美体验是艺术鉴赏过程的中心环节。在审美体验中，鉴赏者始终处于一种主动积极的再创造**\n状态，并在这一状态中不断推进与作品中情感的交流、意义的对话，洞察作品的深层意蕴，最终达到如马\n斯洛所说的“高峰体验”,产生审美共鸣，获得极致体验。"}, {"id": 96, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "6.艺术接受的差异性", "answer": "含义：艺术接受的差异性是指因主体、对象和主客观条件的变化，艺术接受呈现出差异性。\n**表现：**\n(1)相异个体的接受差异性；\n(2)相异群体的接受差异性；\n(3)同一主体的接受变化性；\n(4)不同作品的接受差异性。"}, {"id": 97, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "7.艺术接受的再创造性", "answer": "含义：艺术接受具有再创造性，表明艺术接受不是一种被动的、消极的接受活动，而是一种积极主动、\n具有能动性的再创造活动。所谓再创造，是指艺术接受者在艺术作品所提供的信息的基础上，结合自身的\n艺术修养、审美经验、生活阅历等，发挥想象，丰富或提炼艺术形象、生成艺术意义的创造性活动。\n**意义：艺术再创造是一种二度创作，它一方面是对艺术作品本身价值的超越，另一方面又受到艺术作**\n品的限定。"}, {"id": 98, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "8.格式塔", "answer": "**定义：格式塔(Gestalt), 是西方的心理学流派之一，在此基础上发展起来了格式塔心理学美学。最**\n主要的代表人物及理论著作有考夫卡的《艺术心理学问题》,阿恩海姆的《艺术与视知觉》、《视觉思维》,\n迈耶的《音乐中的感情和意义》、《音乐、各种艺术和观念》等。\n观点：\n(1)同形同构论。格式塔心理学美学最著名的就是“同形同构”论，他们认为，艺术作品有自己独有\n的物理场，人的心理有心理场，两个场相互作用，形成“心理——物理”场，即心物之间有着相似的动力\n结构，人对事物能作出整体性的心理反应并获得顿悟。比如，人看到柳条摆动而感到忧伤，并非因为柳条\n象征忧伤，而是因为柳条随风摆动的运动节奏和人内心忧伤的心理运动节奏是一致的。\n(2)完形论。格式塔心理学美学还强调艺术作品的整体性和人的心理对对象的组织构造和整体化作用，\n即“完形”作用。考夫卡从“完形”论出发，认为艺术作品各部分相互依存组成一个有结构的统一整体，\n这种整体结构对人发出要求，使人受到感染。\n### (二)简答题"}, {"id": 99, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "1.简述“审美移情论”。", "answer": "19世纪下半叶，由德国心理学家、美学家立普斯在《空间美学和几何学 ·视觉的错误》 一书中提出了\n该学说。立普斯认为，人们产生美感的根本原因在于“移情”的心理错觉，即人把自己的感觉、情感、意\n志“外射”于对象事物，使感情变成事物的属性，从而消除主客体的界限，达到物我同一。这样，人对事\n物的欣赏就成了对自我的欣赏。该学说侧重于对主体心理功能的体验，把主体的感觉、情感等提到了审美\n对象的地位，虽然有忽视事物客体属性的倾向，但对审美心理学产生了重大影响。\n按照立普斯的思想，我们可以归纳出移情的三种方式：\n一是物质的拟人化，如说风在细语、树在低吟、高山无言、流水欢快等。\n二是情感向外物的投注，即把自己心中的情感看成是对象所具有的情感。如自己高兴时，大地山河都\n在扬眉带笑；自己悲伤时，风花雪月都在叹气凝愁。蜡烛惜时而垂泪，青山兴到亦点头。杜甫的诗句“感\n时花溅泪，恨别鸟惊心”,用的就是这种投射移情的修辞。\n三是情绪化的态度反射，如情人眼里出西施，仇人眼里出妖魔等。事实上，无论哪种移情方式，其中\n介都是由于同情感(sympathy) 的作用，其机制表现为主体按自身的情感逻辑改变和重构对象。在主客体\n关系中，人是主动的因素。\n立普斯区别了“实用的移情”和“审美的移情”两种性质的移情。前者基于生活的同情，后者摆脱了\n实际的利害。不过，审美共鸣中的移情，却体现了万事万物相互作用的辩证法，是移情的高级状态。在这\n种状态中，主体对客体的改变与重构变成了一种非表层化的活动，而是有了更深的层次，以至于看起来似\n乎显得不动声色。其结果呈现为一种非对立、非强迫的主客体关系，二者保持了高度的平等性和独立性，\n但与此同时，对象与自我却泯灭了界限，显得对象仿佛就是自我，自我仿佛就是对象。其效果有似于伽达\n默尔所说的“视界融合”的境界。按照他的意思，在接受者与艺术作品双方带着各自的视界进行的那一场\n对话中，到了某种境界上：“谈话双方都受到对象的真理性的影响而进入一次成功的谈话，彼此结合而进\n入一个新的共同体之中。”\n苏轼赞扬文与可画竹：“与可画竹时，见竹不见人。岂独不见人，嗒然忘其身。其身与竹化，无穷出\n清新。庄周世无有，谁知此凝神。”所谓“其身与竹化”,正是物我同一的审美共鸣的境界。值得注意的\n是，苏轼敏锐地觉察到艺术家在达到艺术体验的最高状态时，对审美对象所怀有的尊重—— “见竹不见人”\n这就是说，真正的移情并不是一种武断的行动；主体固然把情感注入了对象，但并不显得有意识地、刻意\n地这样去做，而是在与对象无言的交流中，在悉心的理解和关注的情感中，将自己的情感以至生命托付于\n对象。这就是“爱”的状态，也是设身处地的、同情的状态。主体无欲无求，对象不被干扰，但又息息地\n牵动着彼此的神经，激荡着心灵的热流；甚至不必将这样的感情宣示于人，因为他们已经有了一个自足的\n世界，这个世界是如此的充实，无须任何外来力量来加以肯否毁誉。在这种状态中，艺术家、艺术作品和\n艺术鉴赏者发生了真正的共鸣。"}, {"id": 100, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "2.简述艺术接受的再创造性。", "answer": "艺术接受具有再创造性，表明艺术接受不是一种被动的、消极的接受活动，而是一种积极主动、具有\n能动性的再创造活动。所谓再创造，是指艺术接受者在艺术作品所提供的信息的基础上，结合自身的艺术\n修养、审美经验、生活阅历等，发挥想象，丰富或提炼艺术形象、生成艺术意义的创造性活动。艺术再创\n造是一种二度创作，它一方面是对艺术作品本身价值的超越，另一方面又受到艺术作品的限定。艺术接受\n的再创造性具有主客体两方面的原因，即客体上是艺术作品的多义性，主体上是接受主体的差异性。\n(1)艺术作品的多义性\n首先，艺术语言具有表达的模糊性。艺术语言是形象的语言，而非逻辑的语言；是情感的语言，而非\n陈述的语言。故其语言表达是模糊的，不能表达确切的含义。这种模糊性是艺术语言的共性，并不因门类\n而异。文学语言通过文字符号塑造艺术形象，具有感知的间接性，必须经过读者的转译才能转变为艺术形\n象；美术语言和音乐语言能够直接作用于感官，有着感性的直接性和生动性，却不具备表义功能，其含义\n有待于接受者的领会和生发。\n其次，艺术语言具有表达的有限性。艺术语言与其所表现的对象比较起来，又总是有限的。艺术家在\n创作具体艺术作品的过程中，只能在艺术语言的各种可能性中进行有限的选择，不得不进行时空的省略。\n最后，艺术家为了追求含蓄的效果，还常常有意对艺术语言进行简化和省略，强化了艺术语言的能指\n与所指的矛盾。艺术作品的“言有尽而意无穷”的效果就是这样产生的。由于这三大原因，艺术作品中才\n留下了那些不确定性和空白，但与此同时，也给接受主体留下了想象的空间。\n(2) 接受主体的差异性\n从主体方面看，艺术接受的再创造性是由接受主体的个体差异性引起的。艺术接受的再创造性的发挥，\n与接受主体的审美趣味、接受经验、艺术素养、文化修养等前理解结构有密切的关系。如果接受者自身的\n前理解结构很强大，能量很充分，那他就可能获得比他人更为深刻、更为独创的艺术体悟和审美享受，甚\n至升华出审美共鸣或“视界融合”的境界。 一般来说，接受者的审美经验越深厚、艺术素养和文化修养越\n高，其审美再创造的力度就越大；反之就越小。所以，艺术接受者应该努力提高自身的素质和修养，才能\n为获得再创造的乐趣争取到机会。\n### (三)论述题"}, {"id": 101, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "1.论述艺术鉴赏的过程/如何理解艺术接受的过程性。", "answer": "艺术接受的过程性，是指艺术接受活动是一个循序渐进的过程。不必说从艺术鉴赏到艺术批评、艺术\n研究，是一个逐渐深化的过程，仅就艺术鉴赏而言，也并非一蹴而就，而是经历了由浅入深、由外而内、\n由低级到高级的层层推进的过程。最终生发出意义，达到对艺术作品的理解。\n(1)审美注意\n在日常生活中，人们总是受自己的兴趣、愿望以及特定需要的指引，去注意某些事物而忽略其他，这\n种心理状态就是注意。注意有两个心理特点： 一是指向性，二是集中性，其功能是把主体的全部心理要素\n都集中到所指向事物身上，给予其定向的观照。所以，注意能够使人在一段时间内撇开面前的其他事物而\n集中地、清晰地反映对某个特定事物的感知。就心理学的角度看，注意的产生有客观和主观两方面的条件。\n客观条件是指刺激物的特点，如突出、鲜明、新颖、别致等，艺术作品就显然具备这样的特点；引起注意\n的主观条件，则是主体的经验、兴趣、心境、态度等，这也必然参与跟艺术作品的相会。当人们开始鉴赏\n艺术作品时，是离不开“注意”的心理功能的。当这种心理功能开始发挥作用时，审美注意就产生了。它\n能够把鉴赏主体从日常生活中的意识状态带领到艺术鉴赏的心理状态之中。艺术鉴赏中的审美注意还有一\n个作用，就是把感知、想象、联想、情感、理解等各种心理因素定向和集中于某一特定的艺术作品中，并\n保持长时间注意的稳定性，使鉴赏者得以在相对稳定的审美注意中， 保持各种心理活动的积极运转，使艺\n术鉴赏过程不失其持续性。\n(2)审美期待\n当鉴赏者通过审美注意有了相应的心理定向时，他对艺术作品就会产生相应的审美期待。审美期待是\n比审美注意更进一步的鉴赏心理状态，可以说是艺术鉴赏的驱动力。没有审美期待，艺术鉴赏活动就无法\n真正地启动：如果审美期待不强烈，鉴赏活动就难以圆满。在艺术鉴赏活动中，审美期待的深度、广度和\n水平的高低，是由鉴赏者的综合素质或者说“前理解”所决定的，其结果便形成了“期待视野”。每个鉴\n赏者总是从自己特定的“前理解”和期待视野出发，进入鉴赏过程的。期待视野不同，可以形成不同的鉴\n赏角度，形成不同的理解，赋予作品不同的意义。\n(3 ) 审 美 感 知\n有了审美期待，艺术鉴赏过程便可谓准备就绪，接受活动就要进入审美感知阶段，开始其初步的历程\n了。审美感知是以直觉的方式进行的，而直觉是作为艺术接受主体的审美判断力而发挥作用的。艺术直觉\n能使人刹那间暂时忘却一切，聚精会神地观赏艺术对象，全身心地沉浸审美愉悦。我们都有这样的经验，\n有时，当听到一首音乐或走到一幅画跟前时，立刻就会感到它美与不美，无须过多思索，这就是艺术直觉。\n艺术直觉有两个活动特点： 一是直观性，二是直接性。直观性要求人们必须亲自面对艺术作品，不能只靠\n他人转述来了解作品；只有亲自面对，才能感到艺术作品的魅力。直接性体现为不假思索地直接把握和领\n悟，而且常常在瞬间完成，无须逻辑判断或推理思维，就如南禅所追求的“顿悟”一般。\n(4) 审美体验\n艺术鉴赏中的审美体验首先是一种情感活动，但也需要想象和联想的参与。\n借助于想象，艺术鉴赏者才能进入质的欣赏境界，才能发挥出再创造性，充实作品的形象，生发作品\n的意义。想象有创造性想象，有再造性想象。创造性想象是不依据现成的描述而独立地创造出新形象的过\n程，尤为艺术创作所必需。艺术接受则以再造性想象为主。所谓再造性想象，就是根据语言的描述或图形、\n音响的指示，在头脑中再造出相应的新形象的过程。这是由于接受者的想象是在艺术作品所提供的审美信\n息的基础上进行的，要受作品形式和内容的制约，他只能在艺术作品所规定的范围和情境中驰骋想象。再\n造性想象的成果与作品所给出的形象有联系，但又不是这些形象本身，体现出一定的超越性。\n在艺术鉴赏中，还需要联想参与艺术体验。联想是指由一事物想到另一事物的心理过程。按照它所反\n映事物间的关系不同，可分为接近联想、类比联想和对比联想。在日常生活中，睹物思人、爱屋及鸟，就\n是接近联想；看到春光，想到青春朝气：看到暴风雨，想起革命斗争，这是类比联想；而由夏日炎炎想起\n天寒地冻，这就是对比联想。在鉴赏活动中，通过联想，能使艺术形象更加鲜明生动，艺术内容更加丰富\n深刻。在中国文化语境中，人们看到国画中的梅、兰、竹、菊“四君子”还会想起人的高尚品格等。\n(5) 审美理解\n艺术作品不仅是感知的对象，也是理解的对象。其实，在艺术鉴赏中，审美理解早在感知阶段，便依\n靠审美直觉开始进行了。因为审美直觉——或者说审美判断力——是一种感觉力与知解力协调的活动。以\n此为起点，审美理解广泛地伴随着想象、联想、情感等心理活动，渗透于艺术鉴赏的所有活动环节，就正\n如情感始终渗透于艺术鉴赏的全部进程一样。一边是感受， 一边是理解，才是艺术鉴赏的真实状态。\n可是，审美知觉阶段上的理解具有直接性，而作为艺术鉴赏高级阶段的审美理解，却具有一定程度的\n反思性和间接性，表现为一种理性的直觉，并导向哲理的领悟。音乐、美术、戏剧、舞蹈，其意义都不仅\n仅在于愉悦我们的视听知觉，还启迪人生的价值。在鉴赏过程中，只有当知觉形态转化为反思材料、直接\n性转化为间接性、感官的快感转化为反思性的理解愉悦时，鉴赏者才有可能真正达到对艺术作品的深度把\n握。\n总而言之，在以“审美注意——审美期待——审美感知——审美体验——审美理解”为内容而展开的\n艺术鉴赏过程中，五个阶段是彼此联系、相互渗透的整体，在它们之间，并没有不可逾越的界限。"}, {"id": 102, "chapter": "第五章艺术接受", "knowledge_point": "知识点2.艺术接受的特征", "type": "(一)名词解释", "question": "2.论述艺术接受的差异性。", "answer": "艺术接受的差异性是指因主体、对象和主客观条件的变化，艺术接受呈现出差异性。艺术接受的差异\n性主要表现为：其一，相异个体的接受差异性；其二，相异群体的接受差异性；其三，同一主体的接受变\n化性；其四，不同作品的接受差异性。\n(1)相异个体的接受差异性\n相异个体的接受差异性，是指不同个体在接受同一艺术作品时呈现的差异性，这是艺术接受差异性的\n主要表现。 一部《红楼梦》,“经学家看见《易》,道学家看见淫，才子看见缠绵，革命家看见排满，流\n言家看见宫闱秘事”,这种情况来源于接受者期待视野的差异。由于怀有的期待不同，所以在阅读同一部\n文学作品时，读者就见到了不同的东西，这说明他们对作品的意义产生了各自不同的理解。\n(2)相异群体的接受差异性\n群体差异性包括时代差异性、民族差异性、社会差异性、阶级和阶层差异性等。群体差异性又分为群\n体接受的选择性和群体在面对同一艺术作品时所表现出的接受差异性。不同时代的人们可能爱好不同的艺\n术作品，这就是艺术接受的时代选择性；而不同时代的人们在面对同一件艺术作品时产生的不同体验和评\n价，这就是艺术接受的时代差异性。民族差异性、社会差异性、阶级和阶层差异性也有这两个方面的表现\n可依此类推。例如，今天人们观看凡 ·高的作品和凡 ·高在世时所得到的评判就很不一样；油画刚刚进入\n中国时，人们在看一幅油画作品时，可能觉得它“笔法全无，虽工亦匠”,与我们今天的感觉迥异其趣。\n再如，毕加索的立体主义绘画、勋伯格的无调音乐、乔伊斯的意识流小说、杜尚的达达艺术、沃霍尔的波\n普艺术等，在过去和今天的接受者那里，都会有不同的接受反应。\n至于民族差异性，中西方艺术在东方人和西方人的眼中就有着截然不同的印象，这就充分体现出了艺\n术接受的民族差异。\n社会差异性是一个更复杂的现象，包括社会制度的差异、社会发展水平的差异和社会经济、文化以及\n生态环境的差异。它有时与民族差异性重合，但更多时候有自己的特点。相对来说，在古代世界，由于信\n息交流的封闭，艺术接受的社会差异性较大；而在现代世界，尤其是在全球化的今天，由于资讯传播的发\n达和信息交流的广泛，艺术接受的社会差异性就被弱化了。\n至于阶级差异性，是在阶级社会中必然存在的现象。马克思主义认为，文学艺术是有阶级性的，其中\n就包含有艺术接受的阶级性。鲁迅说：“穷人决无开交易所折本的懊恼，煤油大王那会知道北京检煤渣老\n婆子身受的酸辛，饥区的灾民，大约总不去种兰花，像阔人的老太爷一样，贾府上的焦大，也不爱林妹妹\n的。”讲的就是艺术的阶级性。当然，艺术接受的阶级差异性是在阶级社会中存在历史现象。今天，社会\n主义的中国已经消灭了剥削阶级，艺术接受的阶级差异性就显得不那么突出了，而是让位于阶层差异性。\n这主要表现为接受选择性的差异，原因是不同社会阶层的人们可能艺术趣味不同。不过，在所有艺术接受\n的群体差异性中，阶层差异性是最模糊、最难以分辨的，因为我们难以在一个人所处社会阶层与其艺术趣\n味之间找到固定的联系。\n(3)同一主体的接受变化性\n同一主体在对待同一件艺术作品时，也可能因时间、地点和前理解结构的变化而表现出差异性，这就\n是同一主体的接受变化性。因为人是一种历史性存在，不可能一成不变。按照姚斯的看法，期待视野既源\n于个人审美经验，那么就会始终处在个人审美的制约与修正之中。每一次艺术接受实践，都意味着对原有\n期待视野的一次扩展和修正，并因此诞生新的期待视野。艺术接受的时代差异就是这样形成的。时代差异\n如此，个体差异也是如此。随着期待视野的不断扩大，接受者必然会对艺术作品产生新的领悟，于是，就\n出现了同一主体在面对同一件艺术作品时其接受反应此一时彼一时的情况。\n郭沫若讲到他读《离骚》的体会时说，他在童年时代就曾经接触过这部作品，但当时“不曾感得什么”,\n随着年龄渐长，再读《离骚》,就慨然有感，感到了它的伟大。初唐阎立本初看南朝张僧繇的画时，觉得\n张僧繇“虚得其名”;第二天再看，发现张僧繇竟是“近代佳手”;第三天又看，“坐卧观之”,竟然“朝\n夕揣摩十余日，不忍离去”。这些例子表明了艺术接受的因时而异。\n(4)不同作品的接受差异性\n同一接受主体在面对不同种类、不同风格的艺术作品时，也会表现出接受的差异性。因为对象不同，\n关系就会发生变化，活动性质也会发生变化，最终，活动效果呈现出差异，就是自然的了。我们难以设想\n一个人在聆听音乐作品、观看美术作品和阅读文学作品时，能够采用同样的方式去对待。在这种情况下，\n有关特定门类的艺术知识和艺术素养就在其前理解结构中显示出重要的地位。另一个方面关乎艺术作品的\n风格问题，例如，接受主体在面对传统艺术、现代艺术和当代艺术作品时，其接受方式常常表现出较大的\n差异性。"}, {"id": 103, "chapter": "第六章艺术类型", "knowledge_point": "知识点1.艺术分类的历史演变", "type": "(一)简答题", "question": "1.简述艺术类型的划分原则。", "answer": "艺术类型的划分原则主要有以下五种：\n(1)以艺术形象的存在方式为原则\n这种艺术的分类原则将艺术区分为时间艺术(音乐、文学)、空间艺术(雕塑、绘画)和时空艺术(戏\n剧、影视)。\n(2)以艺术形象的审美方式为原则\n这种艺术的分类原则将艺术区分为听觉艺术(如音乐)、视觉艺术(如绘画)和视听艺术(如戏剧)。\n(3)以艺术作品的物化形式为原则\n这种艺术的分类原则将艺术区分为动态艺术(音乐、舞蹈、戏剧、影视等)和静态艺术(绘画、雕塑、\n建筑、实用工艺等)。\n(4)欧美新兴分类原则\n近年来在欧美一些发达国家刚刚兴起的一种最新分类原则，则把艺术直接划分为：视觉艺术 (Visual\nArts), 包括绘画、雕塑、摄影、建筑、工艺，以及现代艺术设计、广告艺术、电影艺术、计算机三维动画、\n动漫、游戏软件等；表演艺术 (Performing Arts),包括音乐、舞蹈、戏剧，以及在发达国家近年来广受\n欢迎的音乐剧等。这种分类原则的优点是适应现代艺术的发展趋势，及时容纳了最新出现并广受欢迎的新\n兴艺术门类或样式。但是，这种分类原则毕竟刚刚出现，尚未经过时间的检验，尤其是在目前尚未得到世\n界各国艺术界、学术界、教育界的普遍认可，即使在发达国家内，也并没有得到普遍的认同。\n(5) 根据艺术的美学原则\n这种艺术的分类原则将整个艺术区分为五大类别，即实用艺术(建筑、园林、工艺美术与现代设计)、\n造型艺术(绘画、雕塑、摄影、书法)、表情艺术(音乐、舞蹈)、综合艺术(戏剧、戏曲、电影艺术、\n电视艺术)和语言艺术(诗歌、散文、小说)等。"}, {"id": 104, "chapter": "第六章艺术类型", "knowledge_point": "知识点1.艺术分类的历史演变", "type": "(一)简答题", "question": "2.简述历史上的艺术分类方式。", "answer": "对于艺术分类的讨论自古有之，古代与近现代的艺术分类方式不尽相同。\n(1 ) 古 代 的 划 分\n关于艺术类型的分类方式，古已有之。例如，中国古代文论《毛诗序》中所讲的：“情动于中而形于\n言，言之不足故嗟叹之，嗟叹之不足故咏歌之，咏歌之不足，不知手之舞之，足之蹈之也。”就分析了诗、\n歌、舞三种不同艺术的联系和区别。战国时编纂的《吕氏春秋 ·古乐篇》中也有关于远古乐舞的相关记载：\n“昔葛天氏之乐，三人操牛尾，投足以歌八阕： 一曰载民，二曰玄鸟，三曰遂草木，四曰奋五谷，五曰敬\n天常，六曰达帝功，七曰依地德，八曰总禽兽之极。”又如，西方美学史上，亚里士多德根据模仿的媒介、\n对象和方式的不同，也区分了艺术类型的绘画与音乐、悲剧与喜剧、史诗与戏剧等。\n(2)近现代的划分\n到了近现代，科学技术的进步更加速了艺术类型的增变、创新和分化。如19世纪中叶，摄影术的发明\n就带来了新兴的摄影艺术，而电影自1895年诞生以来，如今已成为风靡世界，对大众文化产生最重要影响\n的“第七艺术”。随着科技的发展，特别是数字媒体技术的不断创新，而电视艺术、数字媒体艺术等成为\n具有广泛影响力的艺术门类，并形成了独特的艺术特征与审美价值，逐渐显现与建构着自己的类型范式。\n当然，任何艺术分类的方式都只具有相对的意义。各门艺术之间存在着内在的联系性和一致性，具有\n某些彼此相通的共同规律。中外许多美学家都曾经指出过“诗”与“画”之间的密切联系，有的还把音乐\n称为“流动的建筑”,把建筑称为“凝固的音乐”等，充分反映出某些艺术门类之间存在着极为密切的联\n系。"}, {"id": 105, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "1.音乐艺术", "answer": "**定义：音乐艺术，指的是在时间上通过有组织的乐音流动来诉诸听觉、传达思想感情、表现生活感受**\n的一种表现性艺术。它是人类社会历史上产生最早的艺术种类之一。从艺术类型的划分来看，音乐是听觉\n的艺术、时间的艺术，也是表现的艺术、传达情感的艺术。\n分类：音乐的类型，可细分为多种多样的乐种、体裁和样式，但一般而言，音乐通常可划分为声乐和\n器乐两大类。声乐是指用人声歌唱为主的音乐，器乐则是指用乐器来演奏的音乐。\n特征：节奏性、表现性。"}, {"id": 106, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "2.舞蹈艺术", "answer": "**定义：舞蹈是以有韵律的人体动作为主要表现手段，运用舞蹈语言、表情和构图等多种要素，塑造出**\n具有直观性和动态性的舞蹈形象，并从而表达人们思想情感的一种艺术类型。\n分类：从总体上讲，舞蹈可以分为生活舞蹈与艺术舞蹈两大类别。\n特征：表演性、形象性。"}, {"id": 107, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "3.戏剧艺术", "answer": "**定义：戏剧艺术，指的是在舞台上由演员扮演角色，以对话和动作为主，运用多种艺术手段，为观众**\n当场表演故事情节的一门综合艺术。戏剧艺术是二度创作的艺术，因而，作为舞台演出基础的戏剧文学和\n导演、演员创造舞台形象的表演艺术，就成为构成戏剧艺术的两个重要的组成部分，剧本又是戏剧表演的\n基础。戏剧艺术历史悠久、种类繁多、特征鲜明，每一类戏剧艺术又都具有相对独立的审美特征。\n分类：戏剧艺术，从狭义上讲，主要是指话剧。而从广义上讲，戏剧则包括戏曲、话剧、歌剧、舞剧，\n乃至欧美各国目前影响广泛的音乐剧等。\n特征：戏剧性、剧场性。"}, {"id": 108, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "4.影视艺术", "answer": "**定义：影视艺术，是指通过画面、声音和蒙太奇等影视语言，在银幕或荧屏上创造出感性直观的形象，**\n再现和表现生活的艺术。\n分类：影视艺术最主要的分类即为电影艺术与电视艺术。\n特征：\n(1)蒙太奇思维，主要体现在运动着的画面、声音以及完成画面、声音组合的蒙太奇之中；\n(2)具有鲜明的民族性与时代性；\n(3) 兼具艺术性与娱乐性、商品性与文化性等审美特征。"}, {"id": 109, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "5.书法艺术", "answer": "**定义：书法是书写的艺术，更是中华民族一种独特的传统艺术类型。书法艺术主要通过汉字书写过程**\n中的笔墨、点画和章法等造型美，来构成美学境界，并从而表现出人的精神、气质和品格。书法艺术运用\n抽象的“点、线、笔、画”,将本来只有实用价值的文字书写，升华到艺术的境界。\n分类：书法根据字体的不同，分为篆、隶、楷、行、草五个基本类型。\n特征：法既有语言文字所具有的实用价值，也具有其欣赏性的艺术价值。书法艺术蕴含着博大精深的\n传统艺术思想，在体现书法家品格、心性的同时，更将艺术家的精神气质外化到作品中，使艺术接近了自\n然生命的律动，人们常说的“字如其人”,即是对书法这一独特艺术表现力的概括。"}, {"id": 110, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "6.绘画艺术", "answer": "**定义：绘画是美术中最主要的一种艺术形式，绘画艺术指的是以线条、色彩和形体等造型手段，在平**\n面空间里塑造出艺术形象的静态视觉艺术。\n分类：绘画种类繁多，范围广泛。从体系来划分，分为东方绘画、西方绘画；从使用的材料、工具和\n技法来划分，分为中国画、油画、版画、水彩画、水粉画、粉笔画等；从题材内容来划分，分为肖像画、\n风景画、风俗画、静物画、历史画、宗教画、动物画等；从作品的形式来划分，分为壁画、年画、连环画、\n宣传画、漫画等。"}, {"id": 111, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "7.雕塑艺术", "answer": "**定义：雕塑是立体(三度空间)的空间艺术和视觉艺术，因运用一定的物质材料制作出具有实体形象**\n的艺术品，且制作方法主要是雕刻和塑造两大类，故被称为“雕塑”。值得注意的是，雕塑不仅诉诸视觉，\n而且是可以触摸的，雕塑是在三度空间里用物质材料创造出实体形象，所以，雕塑作品往往可以使观赏者\n唤起更多的艺术想象，产生独特的审美效果。\n分类：从制作工艺来看，可以分为雕和塑两大类。\n特征：比起其他艺术类型，雕塑艺术更加注重形式，也特别强调作品对形式美规律的服从。"}, {"id": 112, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "8.工艺美术", "answer": "**定义：工艺美术，又可称为“实用工艺”,一般是指在造型和外观上具有审美价值，与人类的日常生**\n活相关的一类美术品的总称。\n分类：工艺美术是美术所属艺术之中品种繁多的一类，如传统的工艺美术包括景泰蓝器皿、象牙雕刻、\n瓷器、玉雕、竹编器件、草编器件、蜡染织物、泥塑、木雕、剪纸等。而且，工艺美术还涉及日常用品的\n许多方面，对美化生活起着重要的作用，如茶具、餐具、文具、家具以及服饰、器皿以及室内陈设等，就\n都具有工艺美术的性质，有些还具有较高的艺术价值。随着新材料、新技术的涌现，工艺美术的分类也在\n不断地拓展。\n特征：(1)造型性和视觉性；(2)瞬间性与永固性。"}, {"id": 113, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "9.设计艺术", "answer": "**定义：现代设计，是20世纪中叶发展起来的一个新兴的艺术类型。“它是工业革命后，从包豪斯到现**\n在国际上广泛兴起的一门交叉性应用学科，既区别于手工业品制作也不同于纯艺术品创作，它是在现代大\n工业生产基础上产生的工业产品创新的社会实践形态。”现代设计几乎包括一切与人们生活紧密相关的造\n型设计，涉及范围十分广泛。\n分类：从总体上讲，现代设计艺术， 一般又被称为“现代设计”或“工业设计”,大致可包括了视觉\n设计、产品设计、环境设计三个方面的内容。\n特征：(1)实用性与审美性相结合： (2)时代性。"}, {"id": 114, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "10.园林艺术", "answer": "**定义：所谓“园林”,是指“在一定的地域运用工程技术和艺术手段，通过改造地形(或进一步筑山、**\n叠石、理水)、种植花草、营造建筑和布置园路等途径创作而成的美的自然环境和游憩境域”。\n分类：世界三大园林体系，包括东方园林(以中国园林为代表)、欧洲园林(以法国园林为代表)以\n及阿拉伯式园林(以埃及园林为代表)。\n特征：形式美、时代性、民族性。"}, {"id": 115, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "11.建筑艺术", "answer": "**定义：建筑，是建筑物和构筑物的通称，是人类用物质材料修建或构筑的居住和活动的场所。**\n**原则：早在两千多年前，古罗马建筑师维特鲁威就提出了建筑的三条基本原则：实用、坚固、美观。**\n直至今天，它们仍然是建筑师们遵循的基本规律。\n分类：建筑的类型，一般是按使用功能为标准进行划分的。 一般包括民用建筑、公共建筑、工业建筑、\n文化建筑、交通建筑、园林建筑、纪念性建筑、宗教建筑等。"}, {"id": 116, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "12.戏曲艺术", "answer": "**定义：戏曲艺术，是我国传统戏剧艺术形式的总称，属于表现性综合艺术，有鲜明的民族特色。戏曲**\n既具有戏剧艺术的共同特征，又区别于话剧等其他戏剧艺术，具有不同的表现手段与艺术特点。\n种类：我国戏曲艺术的种类十分丰富，代表性的剧种主要有昆曲、京剧、豫剧、越剧、黄梅戏、评剧、\n川剧等，而其中，又以昆曲、京剧的影响最为广泛。\n**发展：戏曲艺术具有悠久的历史， 一般认为，戏曲的发源可追溯到秦汉时期的乐舞、俳优和百戏。其**\n后，在唐代出现的歌舞戏和参军戏，则使“戏”和“曲”两个方面进一步融合。宋金时期，戏曲艺术才真\n正趋于成熟，宋杂剧和金院本都能演出相对完整的故事，并形成戏曲表演行当的初步分类体系。元代时期，\n由于多重的社会历史原因，戏曲的创作和演出一度兴盛，关汉卿的《窦娥冤》和王实甫的《西厢记》正是\n这一时期的代表作品。到明清时期，中国戏曲史则经历了又一个繁荣的阶段，包括具有划时代意义的浪漫\n主义杰作——汤显祖的《牡丹亭》等大量传奇作品都在这一时期涌现，与此同时，大量戏曲理论著作也在\n这一时期出现，促进了戏曲艺术的发展。"}, {"id": 117, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "13.悲 剧", "answer": "**定义：悲剧起源于古希腊。它以剧中主人公与现实之间不可调和的冲突、悲惨的结局、美好理想的破**\n灭，斥恶扬善，给人以激励和启迪。用鲁迅的话说，悲剧即“将人生有价值的东西毁灭给人看”,从而激\n起观众的悲愤及崇敬，达到提高思想情操的目的。\n分类：悲剧一般又分为四个类型：英雄悲剧、性格悲剧、命运悲剧、社会悲剧。英雄悲剧主要是表现\n英雄人物在政治的、民族的、阶级的或为人类利益的斗争中遭到失败或毁灭，歌颂他的崇高精神和伟大人\n格。代表作品如《被缚的普罗米修斯》。性格悲剧是指由于人物内在性格的矛盾或弱点所导致的悲剧。如\n莎士比亚的《哈姆雷特》《奥赛罗》等。命运悲剧是指人的意志逃避不了恶劣的命运而产生的悲剧。如索\n福克勒斯的《俄狄浦斯王》。社会悲剧是指由于社会生活中存在的深刻矛盾所造成的悲剧。如莎士比亚的\n《罗密欧与朱丽叶》,关汉卿的《窦娥冤》等。\n### (二)简答题"}, {"id": 118, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "1.简述音乐艺术的审美特征。", "answer": "音乐艺术，指的是在时间上通过有组织的乐音流动来诉诸听觉、传达思想感情、表现生活感受的一种\n表现性艺术。它是人类社会历史上产生最早的艺术种类之一。从艺术类型的划分来看，音乐是听觉的艺术、\n时间的艺术，也是表现的艺术、传达情感的艺术。\n音乐艺术语言丰富多样，特别是其中的旋律堪称音乐的灵魂，和声体现出音乐的空间感，节奏体现出\n音乐的时间感。\n( 1 ) 节 奏 性\n在音乐中，节奏性是音乐最基本和最重要的审美特征。音乐的节奏，指的是乐音的长短、强弱、高低\n等变化形式，它是乐曲结构的基本构成因素，同时也是旋律的主干。作为时间艺术，音乐是依靠乐音有规\n律的运动变化来构成艺术形象的，因此，音乐必然需要将节奏作为艺术表现的最核心手段。\n不同的节奏可以具有不同的表现作用，从而使旋律更加鲜明，节奏可以增强乐曲的艺术表现力，有时\n甚至可以从不同的节奏来区别出不同的音乐体裁。此外，节奏还直接影响音乐的抒情，当音乐家们想要在\n音乐作品中反映一定强度的情感情绪时，常常会利用节奏这一表现手段，从而造成音乐特殊的审美心理效\n果。一般来讲，节奏缓慢、沉重的音乐作品，会传达给听众忧郁、悲伤的情绪情感，如柴可夫斯基的《悲\n怆交响曲》即是如此。在作品中，柴可夫斯基为了表现人们对理想的热烈追求以及希望最终破灭的结局，\n特意打破了交响曲的古典创作规范，把第四章写成了缓慢的柔板，以这种缓慢沉重的节奏与不协和的和弦，\n表现出剧烈的哀伤。而那些节奏轻快的音乐作品，传达给听众的则往往是欢快、热烈的情绪情感，如贝多\n芬的钢琴奏鸣曲《黎明》,就以明朗的曲调和清澈的音色，体现出了音乐家对大自然的热爱，对生活的赞\n美以及对光明和幸福的向往。\n( 2 ) 表 现 性\n由于音乐是以乐音为媒介材料和表现手段并作用于人们听觉的艺术，可直接传达和表现音乐家感情的\n变化起伏，因而音乐更是擅长表现情感的艺术，表现性也是音乐艺术的一项重要的审美特征，就像黑格尔\n所说的那样，音乐作品于是透入人心与主体合而为一。可见，音乐最基本的艺术功能就是表现情感，即使\n描绘性的音乐作品也不例外。例如，我国的唢呐独奏曲《百鸟朝凤》,以唢呐模拟斑鸠、猫头鹰、布谷鸟\n等各种鸟类的鸣叫声，富于浓厚的生活气息，但全曲从总体上讲仍着重于表现欢快热烈的生活情趣和情感。"}, {"id": 119, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "2.简述舞蹈艺术的审美特征。", "answer": "舞蹈是以有韵律的人体动作为主要表现手段，运用舞蹈语言、表情和构图等多种要素，塑造出具有直\n观性和动态性的舞蹈形象，并从而表达人们思想情感的一种艺术类型。舞蹈艺术的审美特征主要包括以下\n方面：\n(1)表演性\n由于舞蹈是以人体的姿态、表情、造型，尤其是动作来表现思想情感，因而表演性的审美特征在塑造\n舞蹈形象时具有更加重要的意义和作用。德国现代舞蹈家玛丽 ·魏格曼认为，舞蹈属于一种表演艺术，舞\n蹈的舞台现实，有赖于合格的解释者，即舞蹈表演家。而且，对于舞蹈艺术来说，同样题材的舞蹈通过不\n同艺术家具有创造性的表演，往往也会呈现出迥然不同的艺术风格。例如，由傣族舞蹈家演出的《金色的\n孔雀》和由白族舞蹈家演出的《雀之灵》,虽然同样是以表演“吉祥的孔雀”为题材的女子独舞，但傣族\n舞蹈家的表演带有浓郁的傣族民间艺术特色，借助于整个身体来模仿孔雀的形态，使其作品具有引人入胜\n的东方色彩。而白族舞蹈家的表演既有强烈的民族特色，又有鲜明的时代风韵，她从现实生活中寻找到了\n创作的灵感，创作出新颖的舞蹈语言和别致的艺术手法，同样成功地塑造了一个美丽的孔雀形象，并具有\n非凡的艺术感染力。所以，对于舞蹈这一类表演艺术而言，表演性具有举足轻重、不可或缺的重要地位。\n(2) 形象性\n同其他艺术类型相似，形象性是舞蹈艺术又一重要的审美特征，而且舞蹈形象更具有自己的特点。舞\n蹈形象的塑造，完全要依靠演员的形体动作来实现，可以说，舞蹈中的表演性是形象性的基础。例如，女\n子独舞作品《水》,是编导长期深入傣族地区生活，从傣族妇女担水、洗发、戏水的生活细节出发，再结\n合傣族舞蹈“三道弯”的形式美特点，加工提炼而成的舞蹈形象，这一舞蹈形象又通过演员精湛的表演，\n描绘出傣族少女澜沧江畔汲水、夕阳余晖映照的优美意境，十分耐人寻味。总之，不论是塑造人物，还是\n表现意境，舞蹈形象都需要依靠演员的姿态和动作来表现人物性格，创造情绪氛围。因此，舞蹈形象又总\n是具有直观性、动态性和表情性的美学特征。"}, {"id": 120, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "3.简述戏剧艺术的审美特征。", "answer": "戏剧艺术，指的是在舞台上由演员扮演角色，以对话和动作为主，运用多种艺术手段，为观众当场表\n演故事情节的一门综合艺术。戏剧艺术是二度创作的艺术，因而，作为舞台演出基础的戏剧文学和导演、\n演员创造舞台形象的表演艺术，就成为构成戏剧艺术的两个重要的组成部分，剧本又是戏剧表演的基础。\n戏剧艺术历史悠久、种类繁多、特征鲜明，每一类戏剧艺术又都具有相对独立的审美特征。戏剧艺术的审\n美特征主要包括以下方面：\n(1)戏剧性\n在戏剧艺术的所有审美特征中，戏剧性无疑占有最重要的地位。所谓戏剧性，就是戏剧艺术通过演员\n扮演的角色之间的冲突来展开剧情、刻画人物，借以吸引观众，实现其艺术效果和审美作用的特性。构成\n戏剧性的中心环节是戏剧冲突，可以说，没有冲突就没有戏剧。中外古今的优秀的戏剧作品，都具有强烈\n的戏剧性。例如，老舍的话剧作品《茶馆》,只描写了一个小茶馆中所发生的事，却能够以小见大，反映\n出广阔的社会生活和时代变迁，究其原因，正是因为剧中准确表现了出入茶馆的各种人物之间的矛盾冲突。\n(2 ) 剧 场 性\n与影视艺术运用胶片和录像将表演固定下来的方式不同，话剧和戏曲一般需要演员在舞台上为观众进\n行现场表演。因此，剧场性就构成了戏剧艺术的另一个审美特点。戏剧通过演员的表演再现剧中人物、环\n境和故事的发展过程，演员与观众可以直接交流，所以演员的每一次表演都是一次艺术的创造。正是因为\n戏剧通过演员的二度创作，用真实形象直接打动观众，所以戏剧表演的过程既是演员创造的过程，同时也\n是观众欣赏的过程，观众一方面欣赏舞台上演员的精彩表演，另一方面又通过情绪情感的反应直接影响着\n演员，这种现场反馈的现象构成了戏剧艺术的重要特点，也使得戏剧艺术具有了独特的审美特征和艺术感\n染力。"}, {"id": 121, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "4.简述影视艺术的审美特征。", "answer": "影视艺术，是指通过画面、声音和蒙太奇等影视语言，在银幕或荧屏上创造出感性直观的形象，再现\n和表现生活的艺术。影视艺术的审美特征主要包括以下方面：\n(1)蒙太奇思维\n首先，影视艺术的审美特征，主要体现在运动着的画面、声音以及完成画面、声音组合的蒙太奇之中。\n影视艺术的画面是运动的，因此与绘画、雕塑等静态的艺术不同，电影、电视不是通过瞬间，而是通过过\n程来反映生活的艺术。而将这些运动着的画面进行组合，形成有表意作用的影视作品时，又离不开蒙太奇\n的运用。蒙太奇是法文Montage 的音译，意为装配、组合、构成等，是从建筑学用语中借用来的名词。在\n影视艺术中，这一术语被用来指画面、镜头和声音的组织结构方式。蒙太奇的完整概念，应当包括以下三\n方面的含义：首先，从技术层面上讲，蒙太奇就是剪辑，而且不仅镜头与镜头、段落与段落，甚至画面与\n声音均可通过剪辑，构成蒙太奇的组合关系，蒙太奇可算是电影电视的基本结构手段；其次，从艺术层面\n上讲，蒙太奇是影视特有的艺术语言和艺术手段；最后，从美学层面上讲，蒙太奇还可看作是影视艺术的\n一种独特的思维方式，因为蒙太奇不仅体现在剪辑，而且也体现在前期的文学剧本和分镜头剧本，乃至整\n个创作拍摄过程之中。从这个意义上讲，蒙太奇思维是影视艺术独特的思维方法，展现出了影视艺术的审\n美特征。\n(2)民族性与时代性\n其次，影视艺术又具有鲜明的民族性与时代性。\n一方面，影视艺术作为一种大众文化艺术，具有广泛的受众群体，不同民族与地域的影视作品，往往\n既是国际文化交流的重要载体，同时又保有着浓郁的民族特色与风格，因此，优秀的影视作品，通常具有\n鲜明的民族性审美特征，并在世界各个国家、地区和民族间实现着本民族文化传播的作用，曾被誉为“盛\n在铁盒子里的大使”。\n另一方面，影视艺术又是时代的多棱镜与社会的万花筒，展现着不同时代的斑斓图景，更是纪录每一\n个时代具体风貌的最佳载体，中外优秀的影视作品，无不因体现出较高的时代文化品格和独特的艺术创新，\n而具有着经久不衰的艺术魅力。\n(3)艺术性与娱乐性\n再次，影视艺术又兼具艺术性与娱乐性、商品性与文化性等审美特征。例如，从商品性来看，影视音\n像制品一直高居美国出口商品的前列，1997年拍摄的影片《泰坦尼克号》,耗资虽高达2.3亿美元，但\n这部影片既在全世界赚回了18亿美元的票房收入，而且这部影片的各项附加收入也高达10多亿美元。又\n如，从文化性来看，影视艺术作品由于具有巨大观众群，具有巨大的社会影响，所以影视艺术具有其他艺\n术类型所难以比拟的审美教育与认知作用、审美娱乐与宣泄作用。当然，影视还具有不容忽视的负面作用\n等，也应引起足够的重视。"}, {"id": 122, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "5.简述书法艺术的审美特征。", "answer": "书法是书写的艺术，更是中华民族一种独特的传统艺术类型。书法艺术主要通过汉字书写过程中的笔\n墨、点画和章法等造型美，来构成美学境界，并从而表现出人的精神、气质和品格。书法艺术运用抽象的\n“点、线、笔、画”,将本来只有实用价值的文字书写，升华到艺术的境界。\n正如宗白华所指出：“中国的书法，是节奏化了的自然，表达着深一层的对生命形象的构思，因此，\n中国的书法，不像其他民族的文字，停留在作为符号的阶段，而是走上艺术美的方向，而成为表达民族美\n感的工具。这也可说是中国书法的一个特点。”书法艺术确实蕴含着博大精深的传统艺术思想，在体现书\n法家品格、心性的同时，更将艺术家的精神气质外化到作品中，使艺术接近了自然生命的律动，人们常说\n的“字如其人”,即是对书法这一独特艺术表现力的概括。例如，被誉为“天下第一行书”的王羲之《兰\n亭集序》,即体现出了魏晋风度影响下鲜活的人格风采和自然天性，整幅作品既具有流畅的笔势， 一气呵\n成，又含蓄蕴藉，给人以变化莫测而有法度，清俊典雅而又不失活泼的审美体验。"}, {"id": 123, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "6.简述中西绘画的区别。", "answer": "绘画是美术中最主要的一种艺术形式，在美术类型当中的应用也最为广泛。绘画艺术指的是以线条、\n色彩和形体等造型手段，在平面空间里塑造出艺术形象的静态视觉艺术。\n从世界绘画的两大体系来看，以中国画为代表的东方绘画和以油画为代表的西方绘画，各有自己的基\n本特征和历史传统，从而形成各自不同的表现形式与审美特点。二者的差异主要体现在：\n(1)工具材料不同\n中国画往往采用中国特制的毛笔、墨或颜料，在宣纸或绢帛上作画。因此，中国画又可称之为“水墨\n画”或“彩墨画”。西方绘画的主要工具是油彩、画笔和画布或画板，欧洲传统油画是用油质颜料在布、\n木板或厚纸板上画成。\n(2) 透视法则不同\n西方擅用焦点透视法，中国擅用散点透视法。西方绘画追求对象的真实和环境的真实。为了达到逼真\n的艺术效果，十分讲究比例、明暗、透视、解剖、色度、色性等科学法则，运用光学、几何学、解剖学、\n色彩学等作为科学依据。中国画在构图方法上不受焦点透视的束缚，多采用散点透视法(即可移动的远近\n法),使得视野宽广辽阔，构图灵活自由，画中的物象可以随意列置，冲破了时间与空间的局限。\n(3 )附加元素不同\n中国绘画喜与诗文、书法、篆刻四者有机地结合在一起，相互补充，交相辉映，由此形成了中国画独\n特的内容美和形式美。西方绘画多是纯粹的线条、光线、色彩。西洋画的空间构造、形象塑造单纯地借助\n光影明暗、色彩和线条比例。\n(4)美学思想不同\n中国绘画形式有工笔有写意，内容偏重感情。与中国绘画追求的“神形兼备”“气韵生动”不同，西\n方绘画形式偏重摹仿，注重写实，内容偏重理性。概括地讲，如果中国绘画尚意，那么西方绘画则尚形；\n中国绘画重表现、重情感，西方绘画则重再现、重理性，中国绘画以线条为主要造型手段，西方绘画则主\n要是由光和色来表现物象；中国绘画不受空间和时间的局限，西方绘画则严格遵守空间和时间的界限。总\n之，西方绘画注重再现与写实，同中国绘画注重表现与写意，形成鲜明差异。"}, {"id": 124, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "7.简述雕塑艺术的审美特征。", "answer": "雕塑是一种最具有实体感的造型艺术类型。雕塑是立体(三度空间)的空间艺术和视觉艺术，因运用\n一定的物质材料制作出具有实体形象的艺术品，且制作方法主要是雕刻和塑造两大类，故被称为“雕塑”。\n值得注意的是，雕塑不仅诉诸视觉，而且是可以触摸的，雕塑是在三度空间里用物质材料创造出实体形象，\n所以，雕塑作品往往可以使观赏者唤起更多的艺术想象，产生独特的审美效果。\n比起其他艺术类型，雕塑艺术更加注重形式，也特别强调作品对形式美规律的服从。正如王朝闻所指\n出：“所谓形式感，它在雕塑艺术上的运用，是形体的基本形状特征被强调。它和原型相联系，在一定程\n度上删除其中某些细节而夸张其整体感，因而构成一种非常明晰的形态。这种一看就能构成鲜明印象的作\n品很多。唐代乾陵石狮那柱形的四条腿，对于狮的庄严感的形成所起的作用，既是对于素材的简化，也是\n对于内容的强化。”例如，西汉名将霍去病墓前的大型石刻组雕包括《马踏匈奴》《跃马》《卧马》《卧\n虎》《石人》等10余件作品，就是经过精心构思的高度概括和典型的艺术形象，成为中国古代雕塑艺术的\n传世佳作。"}, {"id": 125, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "8.简述美术的审美特征。", "answer": "“美术”是对采用造型手段塑造视觉形象的众多艺术类型的一种统称，广义来说，包括书法、绘画、\n雕塑、工艺美术以及设计艺术、建筑、园林等。美术的审美特征包括以下方面：\n(1)造型性和视觉性\n美术作为一门空间艺术和视觉艺术，它的审美特征首先体现在造型性和视觉性。美术最基本的审美特\n征就是造型性。它是指艺术家运用一定的物质材料，塑造出欣赏者可以通过感官直接感受到的艺术形象。\n书法是通过笔墨、布白、结构、用笔来呈现精神气韵，绘画是用线条、色彩在二度空间里塑造形象，雕塑\n则是用泥土、木石在三度空间里创作出具有实在物质性的艺术形象，它们的共同特点都是以塑造客观对象\n的视觉形象来作为基木的表现方式，所以说，造型性是这类艺术最基本的特征。\n与造型性一致的审美特征，是美术的视觉性，或称“直观性”。因为美术的造型必然是可以接诉诸欣\n赏者眼睛的实在形体，这是使美术同其他艺术类型区分来开的重要特征，也是美术的巨大优势所在。 一件\n书法、绘画、雕塑或工艺作品，都需要存在于一定的空间之中，因此美术比起其他艺术种类来，更加注重\n对直观、生动的形式美的追求。\n( 2)瞬间性与水固性\n美术还有一个重要的审美特征，就是它的瞬间性与永固性。不同于某些艺术类型创造出可视的活动图\n像，书法、绘画、雕塑和工艺品从某种意义上讲，都是静态艺术，不适于表现事物的运动和过程。但是，\n由于客观世界中的一切事物都处于运动之中，静止只是相对的，因此美术的静态，必然带来瞬间性的特点。\n18世纪德国启蒙运动美学家莱辛在其著作《拉奥孔》中，以古希腊群雕《拉奥孔》为例证(这个作品就是\n选取了巨蛇缠住拉奥孔父子三人时，受难者濒临死亡前最后挣扎那一瞬间)所指出的：美术所表现的是“最\n富于孕育性的那一顷刻”。莱辛认为，美术不能表现激情的顶点，因为顶点就意味着止境，就无法调动欣\n赏者的想象力了。最佳的一瞬间，应当选取即将到达顶点前的那一顷刻，因为“最能产生效果的只能是可\n以让想象自由活动的那一顷刻了，我们愈看下去，就一定在它里面愈能想象出更多的东西来”。大量艺术\n作品的实例说明，莱辛这个富有创见的结论，确实在一定程度上阐明了美术瞬间性的特点，不但适用于雕\n塑，也同样适用于绘画和其他美术类型。\n美术采用物质材料和艺术语言将瞬间的造型表现出来，这使得美术在具有瞬间性特点的同时，也具有\n了永固性的特点。所谓永固性，就是指美术的瞬间形象一旦被创作出来，也就同时被物质材料固定下来，\n可以供人们多次欣赏，甚至可以千百年流传下去。美术作品的永固性，使这些古老的艺术品能够被若干年\n后的现代人欣赏，成为人类灿烂文化宝库中的重要财富。"}, {"id": 126, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "9.简述设计艺术的审美特征。", "answer": "现代设计，是20世纪中叶发展起来的一个新兴的艺术类型。“它是工业革命后，从包豪斯到现在国际\n上广泛兴起的一门交叉性应用学科，既区别于手工业品制作也不同于纯艺术品创作，它是在现代大工业生\n产基础上产生的工业产品创新的社会实践形态。”现代设计几乎包括一切与人们生活紧密相关的造型设计，\n涉及范围十分广泛。设计艺术的审美特征主要包括以下方面：\n(1)实用性与审美性相结合\n设计艺术最基本的特征是实用性与审美性相结合。设计艺术与人们的衣、食、住、用等日常生活关系\n密切，而且，设计艺术与其他艺术的重要区别之一，就在于它不仅能够满足人们精神上的审美需要，而且\n还在一定程度上满足人们物质上的需要。尤其是现代社会中，随着科学技术的飞速发展与人类社会的不断\n进步，人们对物质生活与精神生活都提出了更高的标准和要求，人们希望居住环境乃至室内装饰都更加符\n合美的标准，现代设计便应运而生，包括平面设计、服装设计、家具设计、装潢设计、广告设计，乃至环\n境设计、工业产品设计等，几乎遍及现代人类生活的方方面面，使得设计艺术比以往任何历史时期都显得\n更加普及和重要。\n(2) 时 代性\n现代设计艺术的出现，无疑还具有时代性的审美特征，作为一门新兴学科，它是在现代工业和现代科\n技迅猛发展的基础上才得以成长起来的。例如，随着现代科技的发展，视觉设计已经不再局限于平面设计，\n而是充分调动了光、色、文字、图形、运动等多种手段，扩展到电视、计算机等领域。"}, {"id": 127, "chapter": "第六章艺术类型", "knowledge_point": "知识点2.主要艺术类型", "type": "(一)名词解释", "question": "10.简述建筑园林艺术的审美特征。", "answer": "建筑与园林都是具有很高实用性价值的艺术类型，二者皆以改善和美化人类的生活与居住环境为最主\n要的诉求，有时候，建筑与园林还会互相成为对方的组成部分。建筑园林艺术的审美特征主要包括以下方\n面：\n(1)形式美\n首先，这一类型的艺术如其他艺术门类一样，非常重视形式美。所谓形式美，主要是指人类在长期实\n践活动中发现、总结和创造出的许多有规律的组合，包括色彩、线条、形体等因素，也包括对称均衡、多\n样统一等形式法则，形式美大大提高了建筑园林艺术的创造力和表现力。以建筑艺术为例，自从古希腊的\n毕达哥拉斯学派发现了“黄金分割”比例后，历代的建筑师们一直把它奉为重要的形式美法则来遵循。两\n千多年前，古希腊、古罗马的建筑师就精心设计出他们认为比例关系最美的五种柱式，形成了建筑艺术史\n上有名的“五种典范”或“五种柱式”。\n(2) 时代性\n其次，建筑园林艺术的审美特征往往又体现为鲜明的时代特色。建筑艺术总是以自己巨大的形象，反\n映一定时代和一定社会的经济基础、社会面貌、审美理想与时代风尚。古埃及金字塔是古埃及奴隶社会时\n期建筑的代表，哥特式教堂则是西欧中世纪建筑的代表，法国新古典主义建筑是欧美资产阶级革命时期建\n筑的代表，德国包豪斯校舍可以说是现代建筑艺术的开端。如我国明消时代典型的北方住宅形式——四合\n院，就以一种封闭性较强的建筑空间，体现出中国古代的宗法制度和礼教制度。 一般来说，四合院的正房\n属长辈居住，东西厢房为晚辈、耳房为仆人居住，南房主要是客房，这种格局体现出封建社会尊卑有序、\n长幼有别的伦理观念和宗法观念。\n(3)民族性\n最后，建筑园林艺术的审美特征还体现在独特的民族风格。如中国古典园林，则具有与西方园林和阿\n拉伯式园林迥然不同的民族风格，我国古典园林与文化传统关系密切，许多园林意境取材于古代文化，引\n用神话传说，借鉴文化典故，诗化自然风光，追求诗情画意的审美境界。至于建筑艺术，其民族风格和特\n色更是格外鲜明。同样是皇宫，北京的故宫同法国巴黎的凡尔赛宫的区别，可以说一目了然。同样是陵墓，\n北京十三陵的建筑风格同埃及金字塔更是截然不同。"}, {"id": 128, "chapter": "第六章艺术类型", "knowledge_point": "知识点3.各种艺术之间的关系", "type": "(一)简答题", "question": "1.简述各种艺术之间的相通性。", "answer": "在艺术领域，各个类型的艺术之间始终存在着相互的联系与普遍的融通。而不同的艺术类型之所以能\n够联系甚至结合在一起，首先是因为它们具有共同的特征：\n(1)形象塑造相通\n第一，艺术的基本特征之一是形象性。如果说，哲学、社会科学总是以抽象的、概念的形式来反映客\n观世界，艺术则是以具体的、生动感人的艺术形象来反映社会生活和表现艺术家的思想情感。普列汉诺夫\n曾讲过，艺术“既表现人们的感情，也表现人们的思想，但是并非抽象地表现，而是用生动的形象来表现。\n这就是艺术的最主要的特点”。虽然各个具体的艺术类型，它们所塑造的艺术形象可以具有各自不同的特\n点，但无论怎样，任何艺术类型都是以感性形象来反映世界，这是艺术共同的“基因”,也成了各个类型\n艺术能够相互联系的基础。\n(2)表现方式相通\n第二，各个艺术类型的表现方式也同样存在着相似之处，而且通常来说，某些艺术类型之间还具有密\n不可分的关联。如舞蹈和音乐就是一个十分明显的例证，尤其对于舞蹈来说，音乐的伴奏作用十分明显。\n此外，中国的书法与绘画之间也始终存在着“书画同源”的说法，绘画借助于书法，往往不仅强化了主题，\n而且还能够增添形式上的美感。两者融为一体，相得益彰。\n(3) 审美诉求相通\n第三，各个类型的艺术还具有相通的审美诉求。如建筑与园林都注重实用性价值，戏剧与绘画都诉诸\n视觉，音乐与舞蹈都讲求节奏性和韵律美等。诸如此类的情况，成了不同艺术类型能够相互联系的又一原\n因。"}, {"id": 129, "chapter": "第六章艺术类型", "knowledge_point": "知识点3.各种艺术之间的关系", "type": "(一)简答题", "question": "2.简述艺术类型的分化与综合。", "answer": "各个艺术类型在自身的历史发展中，不断经历着分化与综合的过程。可以说，各个艺术类型之间的分\n化与综合不只是“物理层面”的叠加，更是“化学层面”的融合。\n比如，文学、音乐与舞蹈曾经从原始的乐舞中分离出来，成了现今各自独衣的艺术类型，而且，其中\n的文学又逐步演化出诗歌、散文、小说等不同的形式，音乐逐渐区分了声乐与器乐，舞蹈也具有了生活舞\n蹈与艺术舞蹈的划分。又比如，文学、音乐与舞蹈又在综合中产生出更多新的艺术类型，如文学与音乐、\n戏剧的综合，产生了歌剧：文学与舞蹈、戏剧的综合，又发展出舞剧；文学与音乐、舞蹈、戏剧的综合，\n则产生了音乐剧等等。\n可见，艺术的各个类型以及类型中的各种形式，都是彼此开放的体系。只要具备了一定的条件，艺术\n类型就可能在分化与综合中呈现内容丰富和形式多样的发展，使得整个艺术系统得到推进，并使得一门新\n兴学科比较艺术学应运而生。 在当代社会，随着经济和文化的加速演进，各个类型艺术之间的分化与综合\n呈现日益频繁的态势，而且，艺术与文化系统中的哲学、宗教、道德以及科学等不同学科之间的联系也越\n发紧密，出现了许多跨学科的艺术探索，新的艺术形式与艺术类型也在不断涌现。"}, {"id": 130, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "1.模仿说", "answer": "观点：这是一种较早提出的艺术起源理论，该学说认为，艺术起源于人类对于自然或社会生活中存在\n事物的模仿，它假定人类具有一种“模仿本能”,从这种本能出发，通过对物体或现象的模仿而创造出了\n艺术。\n代表人物：古希腊哲学家赫拉克利特、德谟克利特、苏格拉底和亚里士多德等人对模仿说都有论述。\n**评价：模仿说反映了古人通过观察和模拟这两种主要手段认识和改造自然的创造活动方式，包含着朴**\n素的唯物主义思想。在今天看来，艺术中无疑包含着模拟性因素，但它又绝不是简单的模仿，模仿活动之\n中也渗透着创作者个性的、表现性因素，所谓“千人千面，绝不雷同”;还有文化的因素对于艺术的影响\n也不容忽视，由此而产生了样式区别很大的东、西方古典艺术。模仿说显然是有一定局限性的。"}, {"id": 131, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "2.游戏说", "answer": "观点：游戏说的核心观点是认为艺术活动起源于人的游戏冲动和游戏活动。这一学说认为，人类在进\n化过程中发展出了“过剩的精力”,而且喜欢把这种“过剩的精力”运用到没有功利性的活动中，当人们\n把自己“过剩的精力”运用于非功利的活动中，就体现为一种自由的游戏，由此产生了艺术。\n代表人物：这一学说首先由18世纪德国哲学家、文学家席勒明确提出，到19世纪，英国哲学家斯宾\n塞对此学说加以发展，后来再由现代德国哲学家、心理学家谷鲁斯不断完善。\n**评价：游戏说的观念之下，产生了“为艺术而艺术”的主张，曾经风靡一时，催生了法国的“唯美主**\n义”艺术流派；这一观念影响之下，艺术家们力图脱离现实束缚而进行自由创作，进入一种独特的自由境\n界。然而游戏说在解释艺术起源时，它的局限也是比较明显的，尤其是不能解释原始艺术神秘而富有神话\n含义的仪式活动，这些仪式活动绝非个人的自由游戏，这些活动当然是有目的和功利的。"}, {"id": 132, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "3.表现说", "answer": "观点：表现说认为，艺术起源于人类表现情感的需要，因此艺术就成为艺术家表现主观想象和内在情\n感的产物，因而只有表现情感的艺术才是真正的艺术。\n代表人物：\n意大利美学家克罗齐，他提出了“直觉即表现”的命题，克罗齐轻视艺术传达活动，认为艺术乃是情\n感的表现，内心的直觉即是表现了的艺术，不用另外再物化心灵感受的意象。\n科林伍德也认为，艺术的目的在于激发情感，艺术是主观想象和情感的表现。\n苏珊 ·朗格也说：“艺术是人类情感的符号表现”。\n**评价：此观点进步性在于从主体心灵角度审视艺术，但其局限性是脱离人类的社会实践、脱离原始社**\n会生产力低下的实际情况。"}, {"id": 133, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "4.巫术说", "answer": "观点： 巫术说主张艺术发端于原始巫术。 19世纪以来，随着人类学、文化学、民俗学、考古学等学科\n研究成果的不断公布，人们对于原始巫术活动有了更深入的了解，艺术起源于原始巫术的说法逐渐被很多\n人认可，该学说在20世纪的影响进一步扩大。\n代表人物：英国人类学家爱德华 ·泰 勒《原始文化》最早提出“巫术说”,认为“万物有灵”,并且\n都可以与人交感； 弗雷泽《金枝》提出原始部落的一切风俗、仪式和信仰都起源于“交感巫术”;芬兰艺\n术史学家希尔恩在《艺术的起源》 一书中指出原始舞蹈与交感巫术的联系，他认为，当原始人在表演舞蹈\n时，这种舞蹈全部都是对狩猎活动的模仿，这些模仿有着一种实践的目的。\n**评价：巫术说的艺术起源说有着考古学的依据，它从一个侧面表明了艺术起源的“非纯粹性”,对于**\n19世纪以来的“为艺术而艺术”的抽离艺术精神性的思潮给予了有力的反驳。尽管原始艺术与原始巫术存\n在着密切联系，但认为艺术源于巫术，却忽略了人作为创造主体的另外一种实践形式，即用工具改造自然\n的劳动实践活动。"}, {"id": 134, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "5.劳动说", "answer": "观点：劳动说重点突出了在艺术起源过程中劳动创造所起到的推动作用，由于劳动，人从自然界分离\n出来，形成与动物不同的生存方式，逐渐锻炼出灵巧的双手和高度发达的大脑，形成人的各种感觉器官及\n相应的感觉和思维能力，并且形成相互之间表达思想感情的语言。所以说，劳动创造了人本身。\n代表人物： 普列汉诺夫认为，原始艺术是适应劳动的需要并在劳动实践过程中产生的，与原始人的劳\n动生活和生产斗争有着密切的联系； 鲁迅也认为劳动在艺术起源过程中发挥了重要作用。\n**评价：虽然劳动是艺术起源的内在动力，但是艺术的产生却不能简单地仅仅归因于劳动。因为巫术活**\n动、图腾崇拜和原始歌舞等原始人类活动中也有庆祝和娱乐的成分。除劳动外，其他社会生活的内容，例\n如政治、战争、情爱和休息等，也都与艺术起源有着必然的联系。"}, {"id": 135, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "6.文化实践说", "answer": "观点：该观点认为艺术起源于以劳动为内动力的人类整体文化创造的实践活动。所谓“文化实践”,\n就是指人类创造符号并赋予符号以特定意义的实践活动。\n代表人物：德国哲学家卡西尔认为，人类具有一种它自身才具有的特殊能力，即创造和使用符号的能\n力，通过这种精神活动，人类创造了语言、神话、科学和艺术等文化成果，文化是由一个又一个的有特定\n指向和意义符号的系统构成的，文化是人类创造的表意符号体系。人的艺术符号的创造沿着物质、精神、\n制度三个层面展开，在物质层面主要是物质生产和物质生活中器物的创造和装饰，在精神层面主要是象征\n符号的创作，在制度层面主要是礼节性、仪式性和威权性符号的生产。\n### (二)简答题"}, {"id": 136, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "1.简述艺术起源的模仿说。", "answer": "模仿说是一种较早提出的艺术起源理论，该学说认为，艺术起源于人类对于自然或社会生活中存在事\n物的模仿，它假定人类具有一种“模仿本能”,从这种本能出发，通过对物体或现象的模仿而创造出了艺\n术 。\n(1)代表人物\n古希腊哲学家赫拉克利特、德谟克利特、苏格拉底和亚里士多德等人对模仿说都有论述。\n德谟克利特说：“从蜘蛛我们学会了织布和缝补；从燕子学会了造房子：从天鹅和黄莺等歌唱的鸟学\n会了唱歌。”亚里士多德较为系统地阐述了这一理论，他认为模仿是人类与生俱来的本性，人类在通过模\n仿而进行的艺术活动中能够获得快感，由模仿活动而产生了艺术品。同时，艺术模仿也因使用的介质不同、\n所模仿的对象不同、所使用的方式不同而产生了不尽相同的艺术类型，例如雕塑、诗歌、悲剧等。他还认\n为，艺术模仿可以由表及里，通过概括、归纳、提炼而认识事物的本质，因此艺术具有重要的认识功能。\n中国古代也有类似的说法，上古典籍《周易》中说：“古者包牺氏之王天下也，仰则观象于天，俯则观法\n于地；观鸟兽之文与地之宜，近取诸身，远取诸物。”\n(2 ) 评 价\n模仿说反映了古人通过观察和模拟这两种主要手段认识和改造自然的创造活动方式，包含着朴素的唯\n物主义思想。它从产生以后，一直是西方文艺传统中一种占主要位置的关于艺术起源的理论，在经历了近\n两千年的发展变化，在文艺复兴时期之后，它又被增添进了新的表述，发展成为一种新的理论，后人称之\n为“再现说”,文艺复兴时期的不少艺术家，如达 ·芬奇主张“艺术是第二自然”,他曾认为，心就会像\n一面镜子真实地反映面前的一切，就会变成好像是第二自然。莎士比亚也持同样观点，他认为，艺术就像\n镜子一样折射着自然和人生，艺术要真实，并且能够反映现实世界的普遍规律。\n在今天看来，艺术中无疑包含着模拟性因素，但它又绝不是简单的模仿，模仿活动之中也渗透着创作\n者个性的、表现性因素，所谓“千人千面，绝不雷同”;还有文化的因素对于艺术的影响也不容忽视，由\n此而产生了样式区别很大的东、西方古典艺术。模仿说显然是有一定局限性的。"}, {"id": 137, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "2.简述艺术起源的游戏说。", "answer": "游戏说的核心观点是认为艺术活动起源于人的游戏冲动和游戏活动。这一学说首先由18世纪德国哲学\n家、文学家席勒明确提出，到19世纪，英国哲学家斯宾塞对此学说加以发展，后来再由现代德国哲学家、\n心理学家谷鲁斯不断完善。游戏说抓住了艺术创作中的自由意志，赢得了许多艺术家的赞同，因此该学说\n至今仍有一定的影响力。\n这一学说认为，人类在进化过程中发展出了“过剩的精力”,而且喜欢把这种“过剩的精力”运用到\n没有功利性的活动中，当人们把自己“过剩的精力”运用于非功利的活动中，就体现为一种自由的游戏，\n由此产生了艺术。这一学说的哲学根源，在于德国古典哲学创始人之一的康德，康德认为美是无功利的，\n而美感产生于“想象力的自由游戏”,由于艺术创造美感，因此就要无功利的自由意志的参与。\n(1)代表人物\n席勒认为，艺术起源于非功利性的“游戏冲动”。他提出，人在现实生活中是不自由的，因为人既受\n到感性冲动的强迫，又受到理性法则的束缚。人们仅仅以功利为目的来观察外界，无法获得快乐。人只有\n在摆脱了物质与功利的强迫，才能偏爱无功利的“外观”。有审美的自由，艺术才会发生。因此“自然从\n需求的强制和物质的严肃开始，再经过剩余的强制或物质的游戏，然后再转入审美游戏”。他说：“当狮\n子不为饥饿所迫，无须和其他野兽搏斗时，它的剩余精力就为本身开辟了一个对象，它使雄壮的吼声响彻\n荒野，它的旺盛精力就在这无目的的使用中得到了享受。”席勒强调：人的这种游戏本能或冲动，是调和\n理性与感性的矛盾的“润滑剂”,而且正是这种无功利无目的的自由游戏，才能创造一个物质与精神、感\n性与理性的和谐统一世界。游戏推动了艺术的发生，使原始人无规则的跳跃逐渐成为舞蹈，发之于情的声\n音逐渐成为歌曲。\n斯宾塞受康德和席勒的影响极大，他自身也形成了一套关于游戏、审美和艺术活动的理论，他认为，\n游戏与审美有一个共同的特征，那就是两者都不能直接有助于维持生命，都与功利无关。低等动物将全部\n精力都用于维持生命和延续种族生存，不具备剩余精力；高等动物具有剩余精力，剩余精力主要被用来“游\n戏”。在自由地发泄过剩精力的过程中，人获得了快感和美感，创造了艺术，因而“游戏-审美-艺术”所\n构筑的生存方式，成为与人类的功利性活动方式相对应的另一类活动方式。\n德国学者谷鲁斯试图引入现代心理学的理论成果解决功利与非功利之间的矛盾，他提出了“内模仿说”。\n他认为，人类的游戏绝不是没有目的的，他们把自己的目的隐含在游戏之中，受到他们为了将来的生存做\n准备的本能冲动的驱使。可以看到，谷鲁斯仍然承认艺术源于游戏的本质，但游戏本身含着一种人们意识\n不到的目的性，因而谷鲁斯的观点也正符合康德所提出的“无目的性的合目的性”的哲学命题。但不管是\n否具有目的性，他们认为“艺术应当是精神的自由产物”的观念是不变的。\n(2) 评价\n游戏说的观念之下，产生了“为艺术而艺术”的主张，曾经风靡一时，催生了法国的“唯美主义”艺\n术流派：中国现代文学史上的以郭沫若为首的“创造社”流派就明确以此为口号。这一观念影响之下，艺\n术家们力图脱离现实束缚而进行自由创作，进入一种独特的自由境界。然而游戏说在解释艺术起源时，它\n的局限也是比较明显的，尤其是不能解释原始艺术神秘而富有神话含义的仪式活动，这些仪式活动绝非个\n人的自由游戏，这些活动当然是有目的和功利的。\n游戏说本质上反映了人类进入现代社会以来的烦恼，因为现代社会的理性和功利造就了现代化的伟大\n成果，极大地改善和提升了人类的生活水平，但与此同时也极大地束缚了人的精神自由，使人在功利性的\n劳碌中疲于奔命，仿佛只有放弃了功利和理性，才能得到片刻的解脱。艺术因此也有助于缓解社会压力，\n放松人们紧张的神经。但以此来解释艺术起源却也未免有失于片面，是现代人的观念强加于原始艺术的产\n物。况且，艺术本身或多或少都会染上功利的色彩，纯粹的无功利艺术活动往往只是一种理想状态。"}, {"id": 138, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "3.简述艺术起源的表现说。", "answer": "表现说认为，艺术起源于人类表现情感的需要，因此艺术就成为艺术家表现主观想象和内在情感的产\n物，因而只有表现情感的艺术才是真正的艺术。《毛诗序》中说：“情动于中而形于言，言之不足故嗟叹\n之，嗟叹之不足故咏歌之，咏歌之不足，不知手之舞之，足之蹈之也。”意即： 一切艺术皆缘于情感，首\n先内心中有了情感，才产生创作的需要，情感是创作的动力，随着情感的酝酿和发酵，愈演愈烈，艺术的\n表现也呈现出递进的阶梯性特征，于是就有了“叹、咏、歌、舞”的艺术方式。它把情感看作艺术的血液\n和灵魂。\n(1 ) 代 表 人 物\n汉代司马迁有“发愤说”,他在《史记 ·太史公自序》中说：“《诗》三百篇，大抵贤圣发愤之所为\n作也。”他坚持认为，艺术是人在内心产生郁结情感之后，由于不能在现实社会中得到宜泄和表达，因此\n寄托于艺术创作之中，艺术品由此而生成。东晋画家顾恺之提出“以形写神”,把绘画中主观精神的表现\n看作是重于客观形式的因素，在绘画等视觉艺术形式上，中国传统上也重视“写意”和“写情”,注重艺\n术品对自我思想、情趣的表达，重意而轻形。晋代文学家陆机在《文赋》中提出“诗缘情而绮靡”的主张，\n是对“诗言志”传统的回应和深化，到明清时期杰出的艺术家更把表现情感作为文艺的第一要务。汤显祖\n在《〈牡丹亭记>题词》中说：“情不知所起， 一往而深，生者可以死，死可以生。生而不可与死，死而\n不可复生者，皆非情之至也。”他在戏曲《牡丹亭》中记述了杜丽娘和柳梦梅因情而死，又因情而复活的\n动人故事，所要表达的正是对情的极致推崇。\n在19世纪后期，西方“表现论”发展成为艺术思潮中的主流观念，认为艺术创作只能从作家主观的思\n想感情出发，从而把艺术看作为作家主观心灵的表现。\n克罗齐提出了一个核心命题：直觉即表现。他把自己的美学原理称为“表现的科学和一般语言学”,\n甚至认为，真正的艺术活动是在艺术家的心灵过程中完成的。科林伍德在此基础上进一步阐发认为，艺术\n的根源是纯粹的情感表现，他为强调艺术的表现性质甚至否定了艺术的再现性。他认为，真正的艺术不是\n也不可能是再现性的，只有通过自己创造一种想象性经验或想象性活动以表现自己的情感，才称得上是真\n正的艺术。艺术也不是单纯的游戏，即便是巫术活动，它的指向也是情感表现，因此原始歌舞也是表现性\n的。\n苏珊 ·朗格认为，艺术是人类情感的符号形式的创造。从原始文明的礼仪，到文明社会的艺术，无非\n是一种人类在创造符号并使用符号的活动，而艺术的符号系统不同于其他符号系统，因为艺术是人类的情\n感符号。与科林伍德相区别的是，虽然她把艺术视为表现情感意义的符号，但她强调艺术表现的是人类情\n感，而非艺术家个人的情感发泄。因此，艺术在何种程度上表现了人类共同情感，才会在相应的程度上产\n生欣赏共鸣，相应地就会获得那种程度的理解和承认。\n(2)评价\n首先，艺术起源于“表现”的说法，揭示了艺术与情感之间的密切联系。毫无疑问，艺术确实要表现\n情感，艺术家确实是通过自己的作品向他人、向社会表现自己的思想和情感。\n但是，把艺术的起源归结为“表现”,脱离开人类的社会实践，脱离原始社会生产力低下的实际情况，\n仍然是把现象当作本质，把结果当作原因，同样不能科学地阐明艺术的起源问题。"}, {"id": 139, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "4.简述艺术起源的巫术说。", "answer": "巫术说主张艺术发端于原始巫术。19世纪以来，随着人类学、文化学、民俗学、考古学等学科研究成\n果的不断公布，人们对于原始巫术活动有了更深入的了解，艺术起源于原始巫术的说法逐渐被很多人认可，\n该学说在20世纪的影响进一步扩大。原始巫术是指原始人类利用幻想的超自然神奇力量来实现他们功利性\n目的的法术。在原始社会，人类的生存能力很不发达，种族力量薄弱，生产力水平低下，于是他们以想象\n的方式将意志强加于征服对象的身上，以意念中的幻想能力，消除疾病与灾患，获取必需的生活资料，或\n者是取得部族战争的胜利。原始巫术基于“万物有灵”的观念，创造了各种各样的神灵祷告和祝咒活动，\n其中的歌舞表现和器物刻画均含有神化色彩。\n(1 ) 代表人物\n巫术说最早是由英国人类学家爱德华 ·泰勒在《原始文化》 一书中提出的。泰勒认为，原始人类世界\n观就是给一切现象凭空加上无所不在的人格化的神灵的任性作用。他们让自己的幻想塞满自己的住宅、周\n围的环境、广大的地面和天空。简言之就是巫术活动在那个时代无处不在。因为巫术活动无处不在，于是\n包含于原始巫术中的原始艺术就必然是由巫术所派生出来的。\n英国人类学家弗雷泽在其所著《金枝》 一书中，提出了各原始部落的风俗、神话、仪式和信仰起源于\n交感巫术的理论。人类最早幻想靠巫术来控制世界，但巫术的功用毕竟是虚幻的，因此又创造了宗教来祈\n求神的恩泽，最后随着科学体系的创立，“宗教控制人”的思想神学制度也被打破，因此，人类又进入以\n科学模式阐释世界的时代。\n芬兰艺术史学家希尔恩在《艺术的起源》 一书中指出原始舞蹈与交感巫术的联系，他认为，当原始人\n在表演舞蹈时，这种舞蹈全部都是对狩猎活动的模仿，这些模仿有着一种实践的目的，因为世界上的所有\n猎人都希望能把猎物引入自己的射程之内，按着交感巫术的原理，这是可以通过模仿来办到的。因此， 一\n场野牛舞，在原始人看来就可以强迫野牛进入猎人的射击距离之内。李泽厚认为，我国最早的诗、舞、乐\n都从巫术中产生。巫术活动产生的心理积淀催生了最初的美感，在外在方面，从巫术到艺术，“内容积淀\n为形式，想象、观念积淀为感受”。经过长期的历史积淀，巫术的图像造型、礼仪形式演变为审美的艺术。\n(2)评价\n巫术说的艺术起源说有着考古学的依据，它从一个侧面表明了艺术起源的“非纯粹性”,对于19世纪\n以来的“为艺术而艺术”的抽离艺术精神性的思潮给予了有力的反驳。\n尽管原始艺术与原始巫术存在着密切联系，但认为艺术源于巫术，却忽略了人作为创造主体的另外一\n种实践形式，即用工具改造自然的劳动实践活动。原始人不可能整天地跳舞唱歌娱神，他们更重要的实践\n活动是为了生存而进行的渔猎和采集等活动，野兽或者植物的形象最终是要在劳动活动中成为他的对象，\n而不是通过幻想来获得，因此艺术创造的形象离不开人们在劳动中的感知和体验。作为艺术的起源来讲，原\n始文化的图腾歌舞这种巫术礼仪确实在一个相当长的历史时期与艺术活动相伴相生，但以此来统摄说明艺\n术的起源，却也不能完全令人信服。"}, {"id": 140, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "5.简述艺术起源的劳动说。", "answer": "马克思主义关于艺术起源的认识也经历了一个发展演变的过程，其中“劳动说”在一段时期内较受重\n视。劳动说重点突出了在艺术起源过程中劳动创造所起到的推动作用。恩格斯曾说：“首先是劳动，然后\n是语言和劳动一起，成了两个最主要的推动力，在它们的影响下，猿脑就逐渐地过渡到人脑；后者和前者\n虽然十分相似，但是要大得多和完善得多。随着脑的进一步的发育，脑的最密切的工具，即感觉器官，也\n进一步发育起来。”由于劳动，人从自然界分离出来，形成与动物不同的生存方式，逐渐锻炼出灵巧的双\n手和高度发达的大脑，形成人的各种感觉器官及相应的感觉和思维能力，并且形成相互之间表达思想感情\n的语言。所以说，劳动创造了人本身。在劳动中人开始逐渐进行越来越复杂的活动，完成了自然身心的“人\n化”过程，形成了人类的文化心理结构，包括人的审美心理结构。\n(1 ) 代 表 人 物\n普列汉诺夫在《没有地址的信》 一书中，明确阐述了艺术起源于劳动的理论。他说：“(非洲)部落\n妇女手上戴着一动就响的金属环子。她们往往聚集在一起用手磨磨自己的麦子，随着手臂有规律的运动唱\n起歌来，这些歌声是同她们的环子有节奏的响声十分谐和的。”普列汉诺夫还引用大量原始音乐、舞蹈、\n美术的资料，详细论证他的观点。他认为，原始艺术是适应劳动的需要并在劳动实践过程中产生的，与原\n始人的劳动生活和生产斗争有着密切的联系。\n鲁迅说：“人类是在未有文字之前，就有了创作的，可惜没有人记下，也没有法子记下。我们的祖先\n的原始人，原是连话也不会说的，为了共同劳作，必须发表意见，才渐渐的练出复杂的声音来，假如那时\n大家抬木头，都觉得吃力了，却想不到发表，其中有一个叫道‘杭育杭育派’,那么这就是创作； ……倘\n若用什么记号留存了下来，这就是文学；他当然就是作家，也是文学家，是‘杭育杭育派’。”可见鲁迅认\n为，劳动在艺术起源过程中发挥了重要作用。然而，他并未明确说艺术的产生全部由劳动实践决定。\n(2)评价\n虽然劳动是艺术起源的内在动力，但是艺术的产生却不能简单地仅仅归因于劳动。因为巫术活动、图\n腾崇拜和原始歌舞等原始人类活动中也有庆祝和娱乐的成分。除劳动外，其他社会生活的内容，例如政治、\n战争、情爱和休息等，也都与艺术起源有着必然的联系。"}, {"id": 141, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "6.简述艺术起源的文化实践说。", "answer": "本着以发展的眼光看待马克思主义，结合当代最新研究成果，我们认为：艺术起源于以劳动为内动力\n的人类整体文化创造的实践活动。所谓“文化实践”,就是指人类创造符号并赋予符号以特定意义的实践\n活动。这也有助于说明，为什么在艺术的早期活动中，人们都在从事劳动实践，但在全世界却形成了不同\n核心观念和不同类型特点的艺术样态，例如以古希腊为代表的地中海艺术、以古代中国为代表的东亚艺术\n等。其实，不同地区早期艺术样态的区分，正与它们所处的文明圈有着内在的联系。\n德国哲学家卡西尔认为，人类具有一种它自身才具有的特殊能力，即创造和使用符号的能力，通过这\n种精神活动，人类创造了语言、神话、科学和艺术等文化成果，文化是由一个又一个的有特定指向和意义\n符号的系统构成的，文化是人类创造的表意符号体系。 那些刻画在石崖和洞穴中的图像，精心雕塑出来的\n女神或者动植物形象，以及原始歌舞活动的曲目和姿态，它们都是人类所创造的符号，人们在创造这些符\n号的时候，往往还要赋予符号以特定的含义，表达他们的意志，并把这些符号传承和延续下去，形成了艺\n术符号体系。艺术符号体系和其他符号体系一起构成了特定文化。正如古代埃及文化是由金字塔、木乃伊\n和古埃及文字等符号所构成那样，这种文化最初是没有被全面了解的，随着古埃及文字的破译，其内在的\n意义被发掘出来，因此人们才可谓真正地“发现了古埃及”。\n人的艺术符号的创造沿着物质、精神、制度三个层面展开，在物质层面主要是物质生产和物质生活中\n器物的创造和装饰，例如远古时期石器、陶器的制作，在仰韶文化遗址中发掘出的鹰形陶鼎器形饱满，形\n象生动，但它作为鼎，本是煮食物的实用器物。在精神层面主要是象征符号的创作，在红山文化遗址出土\n的碧玉龙，周身卷曲，首部高昂，毛发飘举，极富动感，被誉为“天下第一龙”,它象征着高昂向上的精\n神，被很多机构作为标志。在制度层面主要是礼节性、仪式性和威权性符号的生产，例如古代饕餐纹很早\n出现在长江下游的良渚文化玉器上，它威严狞厉，神秘莫测，是权力的展示，在商周青铜器上也大量出现。\n三个层面的艺术符号在不断被创造、传承、革新的连续发展过程中，艺术的形式性因素和审美规则在不断\n地层积着，艺术世界也愈来愈丰富多彩。\n### (三)论述题"}, {"id": 142, "chapter": "第七章艺术的发展", "knowledge_point": "知识点1.艺术的起源", "type": "(一)名词解释", "question": "1.论述关于艺术起源的诸多学说。", "answer": "关于艺术的起源问题，历史上曾经有过很多种艺术起源的理论，有模仿说、表现说、游戏说、巫术说、\n劳动说、文化实践说等。\n(1)模仿说\n模仿说是一种较早提出的艺术起源理论，该学说认为，艺术起源于人类对于自然或社会生活中存在事\n物的模仿，它假定人类具有一种“模仿本能”,从这种本能出发，通过对物体或现象的模仿而创造出了艺\n术。\n古希腊哲学家赫拉克利特、德谟克利特、苏格拉底和亚里士多德等人对模仿说都有论述。德谟克利特\n说：“从蜘蛛我们学会了织布和缝补；从燕子学会了造房子；从天鹅和黄莺等歌唱的鸟学会了唱歌。”亚\n里士多德较为系统地阐述了这一理论，他认为模仿是人类与生俱来的本性，人类在通过模仿而进行的艺术\n活动中能够获得快感，由模仿活动而产生了艺术品。同时，艺术模仿也因使用的介质不同、所模仿的对象\n不同、所使用的方式不同而产生了不尽相同的艺术类型，例如雕塑、诗歌、悲剧等。他还认为，艺术模仿\n可以由表及里，通过概括、归纳、提炼而认识事物的本质，因此艺术具有重要的认识功能。\n模仿说反映了古人通过观察和模拟这两种主要手段认识和改造自然的创造活动方式，包含着朴素的唯\n物主义思想。在今天看来，艺术中无疑包含着模拟性因素，但它又绝不是简单的模仿，模仿活动之中也渗\n透着创作者个性的、表现性因素，所谓“千人千面，绝不雷同”;还有文化的因素对于艺术的影响也不容\n忽视，由此而产生了样式区别很大的东、西方古典艺术。模仿说显然是有一定局限性的。\n(2 ) 表 现 说\n表现说认为，艺术起源于人类表现情感的需要，因此艺术就成为艺术家表现主观想象和内在情感的产\n物，因而只有表现情感的艺术才是真正的艺术。《毛诗序》中说：“情动于中而形于言，言之不足故嗟叹\n之，嗟叹之不足故咏歌之，咏歌之不足，不知手之舞之，足之蹈之也。”意即：一切艺术皆缘于情感，首\n先内心中有了情感，才产生创作的需要，情感是创作的动力，随着情感的酝酿和发酵，愈演愈烈，艺术的\n表现也呈现出递进的阶梯性特征，于是就有了“叹、咏、歌、舞”的艺术方式。它把情感看作艺术的血液\n和灵魂。\n克罗齐提出了一个核心命题：直觉即表现。他把自己的美学原理称为“表现的科学和一般语言学”,\n甚至认为，真正的艺术活动是在艺术家的心灵过程中完成的。科林伍德在此基础上进一步阐发认为，艺术\n的根源是纯粹的情感表现，他为强调艺术的表现性质甚至否定了艺术的再现性。苏珊 ·朗格认为，艺术是\n人类情感的符号形式的创造。从原始文明的礼仪，到文明社会的艺术，无非是一种人类在创造符号并使用\n符号的活动，而艺术的符号系统不同于其他符号系统，因为艺术是人类的情感符号。\n表现说的进步性在于从主体心灵角度审视艺术，但其局限性是脱离人类的社会实践、脱离原始社会生\n产力低下的实际情况。\n(3)游戏说\n游戏说的核心观点是认为艺术活动起源于人的游戏冲动和游戏活动。\n席勒认为，艺术起源于非功利性的“游戏冲动”。他提出，人在现实生活中是不自由的，因为人既受\n到感性冲动的强迫，又受到理性法则的束缚。人们仅仅以功利为目的来观察外界，无法获得快乐。人只有\n在摆脱了物质与功利的强迫，才能偏爱无功利的“外观”。有审美的自由，艺术才会发生。斯宾塞受康德\n和席勒的影响极大，他自身也形成了一套关于游戏、审美和艺术活动的理论，他认为，游戏与审美有一个\n共同的特征，那就是两者都不能直接有助于维持生命，都与功利无关。低等动物将全部精力都用于维持生\n命和延续种族生存，不具备剩余精力；高等动物具有剩余精力，剩余精力主要被用来“游戏”。德国学者\n谷鲁斯试图引入现代心理学的理论成果解决功利与非功利之间的矛盾，他提出了“内模仿说”。他认为，\n人类的游戏绝不是没有目的的，他们把自己的目的隐含在游戏之中，受到他们为了将来的生存做准备的本\n能冲动的驱使。\n游戏说的观念之下，产生了“为艺术而艺术”的主张，曾经风靡一时，催生了法国的“唯美主义”艺\n术流派；这一观念影响之下，艺术家们力图脱离现实束缚而进行自由创作，进入一种独特的自由境界。然\n而游戏说在解释艺术起源时，它的局限也是比较明显的，尤其是不能解释原始艺术神秘而富有神话含义的\n仪式活动，这些仪式活动绝非个人的自由游戏，这些活动当然是有目的和功利的。\n(4)巫术说\n巫术说主张艺术发端于原始巫术。巫术说最早是由英国人类学家爱德华 ·泰勒在《原始文化》一书中\n提出的。泰勒认为，原始人类世界观就是给一切现象凭空加上无所不在的人格化的神灵的任性作用。他们\n让自己的幻想塞满自己的住宅、周围的环境、广大的地面和天空。简言之就是巫术活动在那个时代无处不\n在。因为巫术活动无处不在，于是包含于原始巫术中的原始艺术就必然是由巫术所派生出来的。\n英国人类学家弗雷泽在其所著《金枝》一书中，提出了各原始部落的风俗、神话、仪式和信仰起源于\n交感巫术的理论。芬兰艺术史学家希尔恩在《艺术的起源》一书中指出原始舞蹈与交感巫术的联系，他认\n为，当原始人在表演舞蹈时，这种舞蹈全部都是对狩猎活动的模仿，这些模仿有着一种实践的目的，因为\n世界上的所有猎人都希望能把猎物引入自己的射程之内，按着交感巫术的原理，这是可以通过模仿来办到\n的。因此，一场野牛舞，在原始人看来就可以强迫野牛进入猎人的射击距离之内。\n巫术说的艺术起源说有着考古学的依据，它从一个侧面表明了艺术起源的“非纯粹性”,对于19世纪\n以来的“为艺术而艺术”的抽离艺术精神性的思潮给予了有力的反驳。尽管原始艺术与原始巫术存在着密\n切联系，但认为艺术源于巫术，却忽略了人作为创造主体的另外一种实践形式，即用工具改造自然的劳动\n实践活动。\n(5)劳动说\n劳动说重点突出了在艺术起源过程中劳动创造所起到的推动作用。普列汉诺夫在《没有地址的信》 一\n书中，明确阐述了艺术起源于劳动的理论。他认为，原始艺术是适应劳动的需要并在劳动实践过程中产生\n的，与原始人的劳动生活和生产斗争有着密切的联系。鲁迅说：“人类是在未有文字之前，就有了创作的，\n可惜没有人记下，也没有法子记下。我们的祖先的原始人，原是连话也不会说的，为了共同劳作，必须发\n表意见，才渐渐的练出复杂的声音来，假如那时大家抬木头，都觉得吃力了，却想不到发表，其中有一个\n叫道‘杭育杭育派’,那么这就是创作；……倘若用什么记号留存了下来，这就是文学；他当然就是作家，\n也是文学家，是‘杭育杭育派’。”可见鲁迅认为，劳动在艺术起源过程中发挥了重要作用。然而，他并未\n明确说艺术的产生全部由劳动实践决定。\n虽然劳动是艺术起源的内在动力，但是艺术的产生却不能简单地仅仅归因于劳动。因为巫术活动、图\n腾崇拜和原始歌舞等原始人类活动中也有庆祝和娱乐的成分。除劳动外，其他社会生活的内容，例如政治、\n战争、情爱和休息等，也都与艺术起源有着必然的联系。\n(6)文化实践说\n本着以发展的眼光看待马克思主义，结合当代最新研究成果，我们认为：艺术起源于以劳动为内动力\n的人类整体文化创造的实践活动。所谓“文化实践”,就是指人类创造符号并赋予符号以特定意义的实践\n活动。这也有助于说明，为什么在艺术的早期活动中，人们都在从事劳动实践，但在全世界却形成了不同\n核心观念和不同类型特点的艺术样态，例如以古希腊为代表的地中海艺术、以古代中国为代表的东亚艺术\n等。其实，不同地区早期艺术样态的区分，正与它们所处的文明圈有着内在的联系。\n德国哲学家卡西尔认为，人类具有一种它自身才具有的特殊能力，即创造和使用符号的能力，通过这\n种精神活动，人类创造了语言、神话、科学和艺术等文化成果，文化是由一个又一个的有特定指向和意义\n符号的系统构成的，文化是人类创造的表意符号体系。那些刻画在石崖和洞穴中的图像，精心雕塑出来的\n女神或者动植物形象，以及原始歌舞活动的曲目和姿态，它们都是人类所创造的符号，人们在创造这些符\n号的时候，往往还要赋予符号以特定的含义，表达他们的意志，并把这些符号传承和延续下去，形成了艺\n术符号体系。艺术符号体系和其他符号体系一起构成了特定文化。正如古代埃及文化是由金字塔、木乃伊\n和古埃及文字等符号所构成那样，这种文化最初是没有被全面了解的，随着古埃及文字的破译，其内在的\n意义被发掘出来，因此人们才可谓真正地“发现了古埃及”。"}, {"id": 143, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "1.简述时代决定说。", "answer": "艺术发展是多种力量复合作用的结果，包括经济的发展水平、政治的开明程度等，当然也有艺术自身\n的积累。历史上关于艺术发展规律曾有过多种多样的解释。\n时代决定说认为，艺术的发展与时代变化相辅相成，时代是主导艺术发展的核心要素。 从艺术发展的\n一般表征上看，艺术与时代进程总是相适应的，是一种显而易见的现实状况。无论是欧洲艺术从古希腊罗\n马时期到中世纪，再到文艺复兴的变化；还是中国历史上不同朝代的不同艺术风貌，显然时代一旦变化，\n人所创造的艺术势必也会随之嬗变。南北朝著名文艺理论家刘勰曾在他的《文心雕龙》中专门设立《时序》\n一章，着重阐述了文学艺术十代九变的详细过程，还提出了著名的论断：“文变染乎世情，兴废系乎时序。”\n法国哲学家、历史学家丹纳在《艺术哲学》 一书中也抓住了“时代”这一影响艺术至深的要素，并进行了\n透彻的阐述。他在书中列举和分析了古希腊、中世纪的欧洲、文艺复兴时期的意大利、16世纪的法国、17\n世纪荷兰的艺术史实，认为艺术与时代、民族、地域三个要素有着紧密的联系。丹纳所谓的“时代”,包\n含的内容比较丰富，有精神文化、社会制度、政治经济状况等，它们决定了时代精神和风俗习惯，形成一\n个时代独有的“精神的气候”,影响和制约着艺术家，决定着艺术类型的起伏变化。"}, {"id": 144, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "2.简述观念演变说。", "answer": "艺术发展是多种力量复合作用的结果，包括经济的发展水平、政治的开明程度等，当然也有艺术自身\n的积累。历史上关于艺术发展规律曾有过多种多样的解释。\n观念演变说认为，艺术发展是人的思想观念变化引起并主导的。中国古代很早就出现了“言意说”,\n探讨创作者的“意趣”与艺术表现的关系。例如庄子在《庄子 ·天道》里曾说：“语之所贵者意也，意有\n所随。意之所随者，不可以言传也。”魏晋时代玄学盛行，“意趣”得到了更大的重视，尚意之风盛行。\n德国哲学家黑格尔建立的理念决定一切的哲学体系中认为，艺术发展的本质是因为作为世界本原的理\n念 (idea) 的发展变化对文艺产生了不同作用。艺术不过是理念的感性显现，而理念在其感性的辩证运动\n的过程中，依次会经历不同的阶段性演变和发展。艺术理念(内容)和感性显现(形式)有着不同的关系：\n最早是感性形式胜过了理念，于是有象征型文艺，例如古代东方艺术；接着会经历理念与感性形式处于平\n衡状态的时期，由此会出现古典型文艺；在最后则是理念溢出感性形式，进而会有浪漫型文艺。"}, {"id": 145, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "3.简述艺术自律说。", "answer": "艺术发展是多种力量复合作用的结果，包括经济的发展水平、政治的开明程度等，当然也有艺术自身\n的积累。历史上关于艺术发展规律曾有过多种多样的解释。\n艺术自律说认为，艺术发展取决于其内部各要素的不同组合变化。这一观点注重从艺术作品的形式和\n结构来分析问题，认为艺术的发展处在一个“创立-繁荣-衰落”的自律性过程之中。近代以来，由于艺术\n本身的快速发展并且日益独立，艺术自律的观点影响力日增。这种观点的立论基础是：艺术的发展总是在\n风格变化上呈现两种形态，即传统模式和背叛模式，如果背叛的模式战胜了传统的模式，则艺术就会出现\n风格的变化和转型。例如西方的现代主义艺术流派：达达主义、立体主义、超现实主义等，无一不是在打\n破传统的一贯性的基础上发展起来的，它们相较于此前的艺术，都呈现出了超越常规发展的叛逆性，换言\n之，可称之为“传统的断裂”。\n瑞士美术史家沃尔夫林曾在《从文艺复兴到巴洛克》《艺术风格学》等著作中，用形式分析的方法对\n风格问题做艺术史的宏观比较和微观分析。他认为，从文艺复兴到巴洛克的变迁，是艺术由稳重、和谐和\n雅静的风格向巴洛克艺术中所表现出的粗野、任性的风格转变。巴洛克艺术相较于文艺复兴并不是退步，\n而是更富于情感与运动感，同样具有美学价值。它注重艺术作品自身的形式和风格特征的分析，对艺术自\n律理论产生了重大影响。"}, {"id": 146, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "4.简述生产实践说。", "answer": "生产实践说认为，艺术发展的根本性的动力是人类的生产劳动实践。生产劳动实践说阐明了艺术发展\n的动力机制。\n(1)生产劳动实践为艺术的发展创造了前提\n马克思主义认为，劳动是人们有意识、有目的地使用工具、征服自然以满足自己物质需要的活动。在\n这种生产劳动实践中创造了人本身的意识和思想，有了意识和思想，人才能从事复杂的、精神性的艺术活\n动，生产劳动实践也为艺术活动提供了丰富的源泉，是艺术活动的内容的基本来源，也是艺术活动的对象。\n没有了人类的生产实践活动，艺术活动无从谈起。在现代生产中，艺术更是成为一种带有物质性的劳动生\n产类型，它满足人的审美需求的同时也创造了经济价值，推动着生产实践的发展。\n(2)生产劳动实践水平本质上决定着艺术发展的阶段\n一定的艺术发展阶段总是与那个时代的生产劳动实践的水平相适应的，在生产力十分低下、生产关系\n十分简单的原始社会里，艺术的发展直接为生产工具所决定。人类最早的工艺品是打制石器，这些石器反\n映着当时人与自然之间的关系，自然力十分强大，而人类处于弱小的地位，他们使用简单的工具努力在自\n然物上留下自己生存的痕迹，艺术的精神性和审美性让位于实用性，旧石器时期的生产劳动实践直接决定\n着当时艺术的内容与形态。到了新石器时代，人类开始有农耕文明出现，陶器作为主要的器具显示了人类\n塑形的自由力量。在陶器上，人类留下日益繁复多样的形象塑造，包括动植物肖形器具和具象、抽象的图\n案。这也表明生产工具有了很大发展，这种新的生产劳动实践也就决定了艺术的变化和发展。由于当时是\n母系氏族公社形式，因此雕像大都是女性，并极力夸大女性的生殖力量。进入阶级社会以后，人类的生产\n工具以金属器具为主，改造自然的力量得到了大幅提升，因此造型艺术、歌舞艺术相应有了跨越式的发展，\n艺术的审美性和精神性需求高涨，艺术与实用性产生了某种程度的分离倾向。同样，在现代由于影像技术\n的发展而出现了影视艺术，计算机技术的发展而催生了新媒体艺术的产生。\n(3)经济基础始终制约和影响着艺术发展\n马克思主义把人类的社会结构划分为经济基础和上层建筑两大部分，经济基础是与一定的物质生产力\n相适应的，由社会生产关系的总和构成的现实物质基础，上层建筑是建立在经济基础之上的政治、制度及\n思维方式、世界观或社会意识形态的总和。经济基础是决定和制约着上层建筑的本质性的力量。根据马克\n思主义观点，上层建筑包括两个部分： 一是政治、法律等制度，包括相应的机构及其措施； 一是社会意识\n形态。社会意识形态有许多种形式，主要指政治观点、法律观点、道德观念以及哲学、宗教、艺术等。艺\n术属于意识形态，又具有不同于其他意识形态的特征。艺术的发展也要受到经济基础的制约和影响。例如\n在旧石器时代，由于人类处于原始狩猎经济时代，因此在岩壁和洞窟中出现大量的动物图案，如阴山岩画\n和欧洲洞穴壁画中描绘的图像动物形象野牛、鹿群等，反映的正是当时人类社会的狩猎经济，植物图案很\n少出现。当新石器时代人类进入农业社会以后，艺术中开始出现植物的形象，这与农耕经济相适应。因此，\n以生产劳动实践为中心的人们的经济活动是推动艺术发展的根本因素。"}, {"id": 147, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "5.简述艺术发展的特征。", "answer": "艺术的发展是延续的、流动的，总体上呈现出层积性、复调性、多元性的特征。\n(1) 层积性\n所谓层积性是指艺术发展中的艺术形式和艺术思想是层层累积而不断拓展的，像树木的年轮的生长，\n前阶段的艺术并未彻底消亡，它的因子蕴含在后起的艺术活动中。比如《诗经》所开创的现实主义传统，\n在后世的杜甫、白居易等文学家那里得到了继承， 一直到现代的鲁迅、柔石等作家也受到这一传统的影响。\n(2)复调性\n所谓的复调性是指艺术发展中几组因素相互作用，反复出现。例如绘画领域中的形、神两个因素组之\n间的纽结、区隔、相生的关系，西方古希腊艺术总体重形而轻神，但中世纪宗教艺术却是通过夸张而突出\n宗教意味，显然是重视精神的。文艺复兴以来重拾古希腊重视写实的风格，然而在19世纪末到20世纪初\n兴起的现代派艺术那里，否定形似和唯美又成为主流艺术思想思潮。中国古代艺术总体上重神轻形，但特\n定时段里又有高度重视形似的现象存在，例如工笔花鸟绘画追求逼真和肖形。因此可以看到艺术发展中某\n一特定时段一个主因群被另一个主因群不断取代，被取代的主因群并不从艺术体系中全然消失，它们一时\n隐退到历史背景中，但日后可能以一种新的方式重新出现。\n(3)多元性\n所谓多元性是指特定时代的艺术发展往往是多元共存的格局。例如文艺复兴时期的美术总体特征是追\n求逼真的写实风格，但在西班牙画派中却有如著名的画家埃尔 ·格列柯大胆地通过变形描述动荡内心，表\n现神秘主义意趣。他的画风与当时主流风格不合，却开启了现代派绘画的先声，因此被称为“现代绘画的\n先驱”。在中国宋代倡导文人写意山水绘画的文化环境里，也有张择端重视绘形写真的《清明上河图》存\n在着，这幅绘画作品也因其写实性而成为研究宋代社会的重要史料，被称为“宋代风俗的历史长卷”。艺\n术发展的多元性更提示我们认识艺术史要有综合和全面的眼光，既要看到主流艺术倾向，又要兼顾非主流\n艺术创作，可能这种非主流艺术创作恰恰是一个新时代的主流艺术的发韧之处。"}, {"id": 148, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "6.简述艺术发展的继承性。", "answer": "所谓艺术发展的继承性，是指前代的艺术，总会给后代的艺术以明显的或潜在的巨大影响；后代的艺\n术又总是要继承前代艺术的成就而发展。尽管有时后代艺术的继承表现为一种明确的批判性，甚至是对前\n代艺术进行批判，但实质上这仍然是以前代艺术为基础的一种发展形式。正如唐朝初期，陈子昂对于六朝\n文学的批评，认为六朝文学空洞乏味，走入辞藻游戏的死胡同，但实际上六朝文学追求形式的华丽深深地\n影响了唐代诗歌的形式，最终促成了律诗和绝句这类成熟的中国经典性诗歌形式的出现。如果没有六朝时\n期在诗歌形式方面的探索，律诗和绝句在唐代的成熟是不可想象的。\n(1)继承的原因\n艺术的继承性是由两方面的原因决定的。第一，艺术发展赖以存在的社会物质生活具有连续性，社会\n的物质生活的发展像一条奔涌不息的河流，构成一个绵延不断的过程。过去的历史形成了当下现实发展的\n一个基础，同时也制约着当下的发展。因此，艺术是社会生活的反映，社会物质生活的连续性从内容上决\n定了艺术发展的继承性。第二，艺术自身的发展具有承续性。艺术是以形象的方式构筑特定审美领域的精\n神活动，艺术自身的形式和美感在不断的层积中，前代的艺术形式是今天艺术重新出发的基点，今天的艺\n术本身又成为下一代艺术的基础，这是一个不中断的连续过程。没有任何艺术产生于真空之中，当下艺术\n总是站在前人的肩膀之上继续前行。可见在艺术领域里，前代艺术成就不仅形成了后代艺术的基础，并势\n必对后代艺术产生规范性的影响。\n(2) 继承的对象\n艺术继承的对象有两个方面。第一，艺术继承是指对本民族艺术传统的继承，这从艺术形式、艺术精\n神和文化内涵等层面都体现了出来。例如，从艺术形式看，中国国画艺术是世界艺术领域的独特创造，国\n画艺术的发展的根在中国，传统国画重情趣和写意，近代以来受到西方油画艺术的影响，出现了写实的画\n风，但其存在的形式并未发生根本改变。第二，艺术继承的对象还有其他民族和文化的艺术成果。艺术继\n承要勇于吸纳其他民族的一切优秀艺术因子，“他山之石，可以攻玉”。别人的优势和长处可能恰是我们\n的劣势和短处，艺术在取长补短中方能有健康的发展，闭关自守的态度不可取。从中国艺术发展历史看，\n艺术繁荣的时代总是一个大胆吸收其他民族艺术成就的时代，汉代和唐代的音乐都深受西域音乐的影响，\n西域的箜篌、胡琴等乐器的传入和流行极大地丰富了中国音乐的表现形式。唐代流行从西域而来的胡旋舞，\n也是对中国传统舞蹈的一次丰富和发展。"}, {"id": 149, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "7.简述艺术发展的创新性。", "answer": "艺术要有继承，但又不能停留在继承的层面上无所作为，在艺术继承中应防止僵化、停滞的想法，继\n承传统是一方面，另一方面又要注重对艺术传统的发展。同时，继承也并不意味着所有传统的东西全部拿\n来，一概吸收，而是一个去粗存精、推陈出新的过程，这也意味着艺术必然要在坚持继承的基础上进行创\n新。\n(1)创新的原因\n艺术必须要创新。原因来自四个方面。第一，创新是由艺术的内容所决定的。艺术是生活的反映，生\n活是发展的，因而，反映生活的艺术也不可能是停滞不前的。第二，创新是由艺术的性质所决定的。艺术\n的生命就在于创新，没有创新就没有艺术。齐白石对自己的学生说“学我者生，似我者死”,意思就是说\n如果学生拘泥于老师自己的创作，亦步亦趋，就会走入死胡同，因为你永远也不是齐白石，然而如果学习\n了齐白石的创作精神，在其基础上有所创新，就有可能赢得社会的承认。第三，创新是由艺术创作的主体\n的独特性所决定的。艺术家都是独立的个体，世界上没有两片完全相同的树叶，也没有两个完全相同的艺\n术家。个性不同的艺术家在从事创作的时候非打上他个人的主观烙印不可，因此只有敢于坚持个性的艺术\n家才能在创新之路上推陈出新。第四，创新是由欣赏者的审美需求所决定的。欣赏者在艺术欣赏时总是求\n新、求异、求变，欣赏者的审美需求决定了艺术创新的必要性。\n(2)创新的体现\n艺术创新从内容和形式上都鲜明地展现出来。从内容上看，每一个时代都有这个时代特定的新问题、\n新现象，艺术家应该敏锐地发现属于他自己时代的独特的审美认识和时代精神，并通过自己的作品展现出\n来。所谓“江山代有才人出，各领风骚数百年”,面对火热的生活，艺术应该创造新的艺术形象，表现新\n的思想感情，呈现新的时代气质。从形式上看，一代人有一代人的艺术表现方式，复制过去就意味着消灭\n自己。任何艺术潮流都有萌芽、成熟、衰亡的历史过程，这是不可避免的历史法则，因此在艺术形式、艺\n术语言、艺术表现手法等方面的必要创新才能寻找到自己时代的独特艺术道路。从古典主义、浪漫主义、\n现实主义、象征主义，再到现代主义，艺术的创新从未停止过。\n艺术创新不仅表现为突破过去的典范，还表现为不断超越前人。有个性的艺术创作者，往往并不满足\n于对先辈和同辈艺术家的学习，而是在学习中寻求突破，求新求变，确立新的典范。艺术的创新还要超越\n自己，超越自我比超越他人更为困难。齐白石在这方面树立了一个很好的榜样。他最初的绘画是以“冷逸”\n著称的，陈师曾劝齐白石改变画风，尝试“雄健烂漫”的风格，并以“画吾自画自今古，何必低首求同群”\n的诗句来激励他。57岁的齐白石以不同常人的勇气毅然开始了对自己画风的变革，他称之为“衰年变法”,\n他发誓说，我即使在变革中失败，落得个身败名裂，也在所不辞，将来饿死在北京城，你们也不必怜悯我，\n我自问这时我内心是畅快的。毕加索也是一位不断超越自我的而家，他早年的绘画具有明显的写实性，其\n画作《人生》已经得到艺术界的承认，但他却转变画风，开始创作立体主义绘画，最终开创了一代画风，\n取得更大的艺术成就。\n### (二)论述题"}, {"id": 150, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "1.论述影响艺术发展的因素。", "answer": "影响艺术发展的要素有很多，人们根据不同的要素而将艺术史划分为不同的发展阶段，综合来看，划\n分艺术发展阶段的标志性因素主要有三个： 一是政治经济的因素，二是文化类型因素，三是艺术观念和艺\n术表现方式因素。\n(1)政治经济的因素\n政治经济的因素主要体现在以王朝史和政治经济史作为艺术发展阶段划分的主要依据。例如，英国都\n铎王朝时期的艺术。都铎王朝处于英国从封建社会向资本主义社会转型的关键时代，实行重商主义政策，\n对英国社会的各个方面都产生了极大的影响，其建筑呈现出凝练内敛、追求精致的时代精神。再如，法国\n加洛林王朝艺术，加洛林王朝是指8世纪中叶到10世纪统治法国的法兰克王国时期。这一时期在国王查理\n曼大帝的支持下兴起的对罗马古典主义艺术的复兴，但这一复兴主要表现是对早期基督教式样和拜占庭以\n及古希腊一罗马风格的模仿，与14世纪意大利兴起的呼唤人的精神复苏的文艺复兴有着本质区别。\n中国传统的艺术史分期主要以王朝和政治经济史为依据，属于政治经济形态型。根据这种划分方式，\n一般地把艺术史划分为夏商周、秦汉、魏晋南北朝、隋唐、宋辽金元、明清、近代、现代、当代。这个划\n分标准一直延续至今，形成了我国认识自身艺术发展的重要传统，中国艺术史一般地都是按照这个传统编\n写的。\n(2)文化类型因素\n文化类型因素主要体现在以文化圈和文化精神作为艺术发展阶段划分的主要依据。例如古希腊艺术，\n它崇尚理想主义，具有简朴凝重、典雅精致、强调共性的特点，其庄重的艺术品格和严谨的写实精神形成\n了西方艺术的重要传统。再如中世纪艺术，它是西方文化的特殊表现形式之一。作为宗教信仰和神学的表\n达形式，这种艺术不注重客观世界的真实描写，而强调所谓精神世界的表现。为此，它往往以夸张、变形、\n改变真实空间序列等多种手法来达到强烈表现的目的。以哥特式建筑为代表的独特的风格在西方艺术史上\n占有其一席地位。又如文艺复兴时期的艺术，集中体现了人文主义思想，主张个性解放，反对中世纪的禁\n欲主义和宗教观，艺术创作中追寻现实主义和人类的情感，开启了人性解放的伟大时代。\n中国艺术分期中也有以文化演进作为主要依据的例子，例如依据文化由萌芽向成熟再到衰落的发展进\n程，将中国古代艺术划分为上古(先秦)、中古(秦到唐)、近古(宋到清)三个阶段。\n(3)艺术观念和艺术表现方式的因素\n艺术观念和艺术表现方式的因素主要体现在以艺术思潮或艺术形式风格作为划分艺术发展阶段的主要\n依据。依据艺术思潮，西方艺术史一般可以划分为古典主义艺术、浪漫主义艺术、批判现实主义艺术、印\n象和象征主义艺术、现代主义艺术、后现代主义艺术等。在中国，人们也依据这一因素将艺术划分为古代\n艺术、现代艺术和当代艺术。艺术的形式和风格有其自身的演化特点，人们往往抓住其中某些形式特征变\n化过程专门性地对某一时段的艺术做探讨，例如瑞士美术史家海因里希 ·沃尔夫林在《艺术风格学》中以\n线描和涂绘、平面和纵深、封闭的和开放的形式、多样性和同一性以及清晰性和模糊性五对基本概念为准\n则，从素描、绘画、雕塑、建筑等角度来分析文艺复兴艺术与巴洛克艺术之间的区别。\n一般来说，艺术史研究可以归纳为基于自律论观念的风格史、形式史模式与基于他律论观念的广义的\n社会学模式之分。但任何因素都不可能是绝对完全的、普适的。从以上的艺术分期中可以看到艺术发展的\n复杂性，它是多种要素共同作用的结果，其中有艺术自身的要素，也有艺术之外的政治、经济、哲学、宗\n教等方面的要素，认识艺术史需要多方面综合考虑。"}, {"id": 151, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "2.论述艺术发展中的平衡与不平衡。", "answer": "所谓的艺术发展中的平衡与不平衡是指艺术与社会物质基础之间的关系而言的。艺术总体上与社会物\n质基础的发展水平同步，但在特殊的时期，二者之间也呈现出相异的步调。\n(1)艺术与社会物质基础总体协调一致\n艺术是特定时代的产物，它势必要受到这一时期社会生产力主导性力量的制约。在人类生产力低下的\n原始社会，人们在自然力面前处于无能为力的地位，只能在想象中征服自然力，幻想出来一些超人的神或\n神化的人，这就产生了神话故事。随着生产力的发展及人们征服自然能力的增强，产生神话的物质基础也\n就随之消失了，神话也成为一种历史遗迹。人类进入阶级社会以后，艺术与社会物质基础之间的关系更加\n复杂。然而尽管艺术与社会物质基础的关系越来越复杂，而它们之间的联系始终是存在的，艺术归根到底\n是社会物质基础的反映。中国商周时代的青铜艺术是中国青铜器发展的鼎盛时期的产物，商周时期特定的\n生产力水平促进了青铜艺术发展，到战国时代，铁器普遍使用，青铜艺术也走向了衰落。中国古代的盛世\n汉唐，物质生产达到高度繁荣，造就了恢弘阔达、积极有为的社会风气，取得了杰出的艺术成就，这正是\n艺术与社会物质基础总体协调一致的体现。\n然而，社会物质基础对于艺术的制约和影响作用并不是直接的，往往要经过一定社会的、制度的各种\n因素的中介环节起作用。法国社会学家丹纳曾说：“要了解一件艺术品， 一个艺术家， 一群艺术家，必须\n正确地设想他们所属的时代的精神和风俗概况。这是艺术品最后的解释，也是决定一切的基本原因。”丹\n纳所主张的“时代、民族、地域”三要素说，其实质认同社会物质基础对于艺术的根本性的影响力，但这\n种影响要通过时代精神、民族文化和地域传统等中介产生作用。\n(2)物质生产与精神生产的不平衡\n社会物质基础的发达与艺术的繁荣虽然有密切的关系，但并不是机械地互为因果关系。这种情况表明，\n艺术的发展与社会物质基础的发展并不总是同步的，有时艺术的发展显得快些，有时显得慢些，有时甚至\n与社会物质基础呈反方向发展。正如马克思所指出的物质生产与精神生产的不平衡关系。从根本上讲，艺\n术是被社会物质基础决定的，但艺术又有其相对的独立性和特殊性，在某种程度上，艺术一经产生，就不\n是消极地反映物质基础，而是要对物质基础发生反作用，即对社会的发展会起到一定程度的促进或阻碍作\n用，而且在特定的社会物质基础改变后，旧的艺术形态并不一定会随之消失，还会在相当长的时间内发生\n影响。例如中国古代的魏晋南北朝时期，经历了东汉末年的黄巾起义和三国时期的战乱，进入到分裂为南\n朝和北朝的军事冲突时代，社会物质基础受到很大破坏，出现了哀鸿遍野、千里无鸡鸣的惨状。但这种时\n代恰恰也促使人的生命意识的觉醒，在文艺与哲学上取得了很大的发展，形成了文艺自觉的局面。\n总体来说，任何形态的艺术，都是受制于一定社会物质基础，与此同时，文艺又反作用于物质基础，\n具有相对的独立性，因此，艺术与经济基础之间存在着双向的交互作用的辩证关系。因此，我们应该以辩\n证的、发展的眼光来看待艺术与社会物质基础之间的关系问题。"}, {"id": 152, "chapter": "第七章艺术的发展", "knowledge_point": "知识点2.艺术的发展进程", "type": "(一)简答题", "question": "3.论述艺术发展中的继承与创新的关系。", "answer": "继承与创新之间辩证和互动关系是推动艺术自身发展的重要条件。任一时代的艺术都是在继承前代艺\n术的基础上发展而来的，同样， 一个时代的艺术又总是对前一个时代的艺术进行反思、变革而产生新的演\n变。继承与创新构成了艺术发展中一对矛盾统一的基本范畴，两者相互对立又相辅相成。\n(1)艺术发展离不开继承性\n所谓艺术发展的继承性，是指前代的艺术，总会给后代的艺术以明显的或潜在的巨大影响；后代的艺\n术又总是要继承前代艺术的成就而发展。尽管有时后代艺术的继承表现为一种明确的批判性，甚至是对前\n代艺术进行批判，但实质上这仍然是以前代艺术为基础的一种发展形式。正如唐朝初期，陈子昂对于六朝\n文学的批评，认为六朝文学空洞乏味，走入辞藻游戏的死胡同，但实际上六朝文学追求形式的华丽深深地\n影响了唐代诗歌的形式，最终促成了律诗和绝句这类成熟的中国经典性诗歌形式的出现。如果没有六朝时\n期在诗歌形式方面的探索，律诗和绝句在唐代的成熟是不可想象的。\n艺术的继承性是由两方面的原因决定的。第一，艺术发展赖以存在的社会物质生活具有连续性，社会\n的物质生活的发展像一条奔涌不息的河流，构成一个绵延不断的过程。过去的历史形成了当下现实发展的\n一个基础，同时也制约着当下的发展。因此，艺术是社会生活的反映，社会物质生活的连续性从内容上决\n定了艺术发展的继承性。第二，艺术自身的发展具有承续性。艺术是以形象的方式构筑特定审美领域的精\n神活动，艺术自身的形式和美感在不断的层积中，前代的艺术形式是今天艺术重新出发的基点，今天的艺\n术本身又成为下一代艺术的基础，这是一个不中断的连续过程。没有任何艺术产生于真空之中，当下艺术\n总是站在前人的肩膀之上继续前行。可见在艺术领域里，前代艺术成就不仅形成了后代艺术的基础，并势\n必对后代艺术产生规范性的影响。\n艺术继承的对象有两个方面。第一，艺术继承是指对本民族艺术传统的继承，这从艺术形式、艺术精\n神和文化内涵等层面都体现了出来。例如，从艺术形式看，中国国画艺术是世界艺术领域的独特创造，国\n画艺术的发展的根在中国，传统国画重情趣和写意，近代以来受到西方油画艺术的影响，出现了写实的画\n风，但其存在的形式并未发生根本改变。第二，艺术继承的对象还有其他民族和文化的艺术成果。艺术继\n承要勇于吸纳其他民族的一切优秀艺术因子，“他山之石，可以攻玉”。别人的优势和长处可能恰是我们\n的劣势和短处，艺术在取长补短中方能有健康的发展，闭关自守的态度不可取。从中国艺术发展历史看，\n艺术繁荣的时代总是一个大胆吸收其他民族艺术成就的时代，汉代和唐代的音乐都深受西域音乐的影响，\n西域的箜篌、胡琴等乐器的传入和流行极大地丰富了中国音乐的表现形式。唐代流行从西域而来的胡旋舞，\n也是对中国传统舞蹈的一次丰富和发展。\n(2)艺术发展离不开创新性\n艺术要有继承，但又不能停留在继承的层面上无所作为，在艺术继承中应防止僵化、停滞的想法，继\n承传统是一方面，另一方面又要注重对艺术传统的发展。同时，继承也并不意味着所有传统的东西全部拿\n来，一概吸收，而是一个去粗存精、推陈出新的过程，这也意味着艺术必然要在坚持继承的基础上进行创\n新。\n艺术必须要创新。原因来自四个方面。第一，创新是由艺术的内容所决定的。艺术是生活的反映，生\n活是发展的，因而，反映生活的艺术也不可能是停滞不前的。第二，创新是由艺术的性质所决定的。艺术\n的生命就在于创新，没有创新就没有艺术。齐白石对自己的学生说“学我者生，似我者死”,意思就是说\n如果学生拘泥于老师自己的创作，亦步亦趋，就会走入死胡同，因为你永远也不是齐白石，然而如果学习\n了齐白石的创作精神，在其基础上有所创新，就有可能赢得社会的承认。第三，创新是由艺术创作的主体\n的独特性所决定的。艺术家都是独立的个体，世界上没有两片完全相同的树叶，也没有两个完全相同的艺\n术家。个性不同的艺术家在从事创作的时候非打上他个人的主观烙印不可，因此只有敢于坚持个性的艺术\n家才能在创新之路上推陈出新。第四，创新是由欣赏者的审美需求所决定的。欣赏者在艺术欣赏时总是求\n新、求异、求变，欣赏者的审美需求决定了艺术创新的必要性。\n艺术创新从内容和形式上都鲜明地展现出来。从内容上看，每一个时代都有这个时代特定的新问题、\n新现象，艺术家应该敏锐地发现属于他自己时代的独特的审美认识和时代精神，并通过自己的作品展现出\n来。所谓“江山代有才人出，各领风骚数百年”,面对火热的生活，艺术应该创造新的艺术形象，表现新\n的思想感情，呈现新的时代气质。从形式上看，一代人有一代人的艺术表现方式，复制过去就意味着消灭\n自己。任何艺术潮流都有萌芽、成熟、衰亡的历史过程，这是不可避免的历史法则，因此在艺术形式、艺\n术语言、艺术表现手法等方面的必要创新才能寻找到自己时代的独特艺术道路。从古典主义、浪漫主义、\n现实主义、象征主义，再到现代主义，艺术的创新从未停止过。\n艺
